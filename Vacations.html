<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuenta Regresiva - 10 de Diciembre</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', monospace;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Efectos de fondo neón */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 30% 30%, rgba(0, 255, 255, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 70% 70%, rgba(255, 0, 255, 0.1) 0%, transparent 40%);
            animation: rotate 20s linear infinite;
            z-index: -1;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 1200px;
            width: 100%;
        }

        .title {
            font-size: 3.5rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: 1rem;
            text-shadow: 
                0 0 10px rgba(0, 255, 255, 0.8),
                0 0 20px rgba(0, 255, 255, 0.6),
                0 0 30px rgba(0, 255, 255, 0.4),
                0 0 40px rgba(0, 255, 255, 0.2);
            animation: pulse 2s ease-in-out infinite;
        }

        .subtitle {
            font-size: 1.5rem;
            color: #00ffff;
            margin-bottom: 3rem;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            opacity: 0.9;
            animation: fadeIn 1s ease-in;
        }

        .location {
            font-size: 1.2rem;
            color: #ff00ff;
            text-shadow: 0 0 15px rgba(255, 0, 255, 0.5);
            margin-bottom: 0.5rem;
        }

        .date-display {
            font-size: 1rem;
            color: #00ff00;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            margin-bottom: 3rem;
        }

        .countdown-wrapper {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .time-box {
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 15px;
            padding: 2rem 1rem;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .time-box:hover {
            transform: translateY(-10px);
            border-color: rgba(0, 255, 255, 0.8);
            box-shadow: 
                0 0 30px rgba(0, 255, 255, 0.6),
                inset 0 0 20px rgba(0, 255, 255, 0.2);
        }

        .time-box::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #00ffff);
            border-radius: 15px;
            opacity: 0;
            z-index: -1;
            transition: opacity 0.3s ease;
            animation: borderGlow 3s linear infinite;
        }

        .time-box:hover::before {
            opacity: 0.5;
        }

        @keyframes borderGlow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }

        .time-value {
            font-size: 4rem;
            font-weight: 700;
            color: #fff;
            display: block;
            line-height: 1;
            text-shadow: 
                0 0 10px rgba(0, 255, 255, 1),
                0 0 20px rgba(0, 255, 255, 0.8),
                0 0 30px rgba(0, 255, 255, 0.6);
            animation: numberGlow 2s ease-in-out infinite alternate;
        }

        @keyframes numberGlow {
            0% { text-shadow: 0 0 10px rgba(0, 255, 255, 1), 0 0 20px rgba(0, 255, 255, 0.8); }
            100% { text-shadow: 0 0 20px rgba(0, 255, 255, 1), 0 0 30px rgba(0, 255, 255, 0.8), 0 0 40px rgba(0, 255, 255, 0.6); }
        }

        .time-label {
            font-size: 1.2rem;
            color: #00ffff;
            margin-top: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .progress-bar {
            width: 100%;
            max-width: 600px;
            height: 30px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 15px;
            margin: 2rem auto;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            border-radius: 13px;
            transition: width 0.5s ease;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            position: relative;
            overflow: hidden;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .message {
            font-size: 1.8rem;
            color: #ff00ff;
            text-shadow: 0 0 20px rgba(255, 0, 255, 0.7);
            margin-top: 2rem;
            opacity: 0;
            animation: fadeIn 1s ease-in forwards;
            animation-delay: 0.5s;
        }

        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00ffff;
            border-radius: 50%;
            opacity: 0.5;
            animation: float 10s infinite;
            box-shadow: 0 0 10px #00ffff;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 0.5;
            }
            90% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }

        /* Animaciones de entrada */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .time-box:nth-child(1) { animation: fadeIn 0.5s ease-in; }
        .time-box:nth-child(2) { animation: fadeIn 0.7s ease-in; }
        .time-box:nth-child(3) { animation: fadeIn 0.9s ease-in; }
        .time-box:nth-child(4) { animation: fadeIn 1.1s ease-in; }

        /* Responsive */
        @media (max-width: 768px) {
            .title {
                font-size: 2.5rem;
            }
            .time-value {
                font-size: 3rem;
            }
            .countdown-wrapper {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Efecto de glitch ocasional */
        @keyframes glitch {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <h1 class="title">CUENTA REGRESIVA</h1>
        <p class="subtitle">Tiempo restante para el 10 de Diciembre</p>
        
        <div class="location">
            <span>📍 México, Quintana Roo, Cancún, Benito Juárez</span>
        </div>
        <div class="date-display" id="dateDisplay">
            Cargando fecha y hora local...
        </div>
        
        <div class="countdown-wrapper" id="countdown">
            <div class="time-box">
                <span class="time-value" id="days">00</span>
                <div class="time-label">Días</div>
            </div>
            <div class="time-box">
                <span class="time-value" id="hours">00</span>
                <div class="time-label">Horas</div>
            </div>
            <div class="time-box">
                <span class="time-value" id="minutes">00</span>
                <div class="time-label">Minutos</div>
            </div>
            <div class="time-box">
                <span class="time-value" id="seconds">00</span>
                <div class="time-label">Segundos</div>
            </div>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressBar"></div>
        </div>
        
        <div class="message" id="message">¡El tiempo vuela! 🚀</div>
    </div>

    <script>
        // Crear partículas de fondo
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.animationDuration = (10 + Math.random() * 10) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // Formatear número con dos dígitos
        function formatNumber(num) {
            return num.toString().padStart(2, '0');
        }

        // Actualizar cuenta regresiva
        function updateCountdown() {
            // Zona horaria de Quintana Roo (Cancún)
            const timeZone = 'America/Cancun';
            
            // Fecha actual en Quintana Roo
            const now = new Date();
            const nowInTimeZone = new Date(now.toLocaleString("en-US", {timeZone: timeZone}));
            
            // Fecha objetivo (10 de diciembre del año actual)
            const currentYear = nowInTimeZone.getFullYear();
            const targetDate = new Date(currentYear, 11, 10, 0, 0, 0); // 10 de diciembre
            
            // Si ya pasamos el 10 de diciembre este año, usar el próximo año
            if (nowInTimeZone > targetDate) {
                targetDate.setFullYear(currentYear + 1);
            }
            
            // Calcular la diferencia
            const difference = targetDate - nowInTimeZone;
            
            // Calcular unidades de tiempo
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);
            
            // Actualizar display
            document.getElementById('days').textContent = formatNumber(days);
            document.getElementById('hours').textContent = formatNumber(hours);
            document.getElementById('minutes').textContent = formatNumber(minutes);
            document.getElementById('seconds').textContent = formatNumber(seconds);
            
            // Calcular progreso del año
            const yearStart = new Date(currentYear, 0, 1);
            const yearEnd = new Date(currentYear, 11, 31);
            const totalYearMilliseconds = yearEnd - yearStart;
            const elapsedMilliseconds = nowInTimeZone - yearStart;
            const progressPercent = (elapsedMilliseconds / totalYearMilliseconds) * 100;
            
            // Actualizar barra de progreso
            document.getElementById('progressBar').style.width = progressPercent + '%';
            
            // Actualizar fecha actual
            const options = {
                timeZone: timeZone,
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            };
            const dateString = nowInTimeZone.toLocaleDateString('es-MX', options);
            document.getElementById('dateDisplay').textContent = 
                `Fecha actual: ${dateString} (hora de Quintana Roo)`;
            
            // Cambiar mensaje cuando falte poco
            if (days === 0 && hours < 24) {
                document.getElementById('message').textContent = '🎉 ¡Ya casi llega el día! 🎉';
                document.getElementById('message').style.color = '#00ff00';
            }
            
            // Efecto glitch ocasional
            if (Math.random() < 0.001) {
                document.querySelector('.title').style.animation = 'glitch 0.3s';
                setTimeout(() => {
                    document.querySelector('.title').style.animation = 'pulse 2s ease-in-out infinite';
                }, 300);
            }
        }

        // Inicializar
        createParticles();
        updateCountdown();
        
        // Actualizar cada segundo
        setInterval(updateCountdown, 1000);
        
        // Efecto de parpadeo en el título
        setInterval(() => {
            const title = document.querySelector('.title');
            title.style.textShadow = 
                title.style.textShadow === 'none' 
                ? '0 0 10px rgba(0, 255, 255, 0.8), 0 0 20px rgba(0, 255, 255, 0.6), 0 0 30px rgba(0, 255, 255, 0.4), 0 0 40px rgba(0, 255, 255, 0.2)' 
                : 'none';
        }, 3000);
    </script>
</body>
</html>
