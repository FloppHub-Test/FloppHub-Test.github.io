<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" id="themeColorMeta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Horario 2°C</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
--bg-light: #F2F2F7;
--bg-dark: #000000;
--card-light: rgba(255,255,255,0.65);
--card-dark: rgba(28,28,30,0.65);
--text-light: #000000;
--text-dark: #FFFFFF;
--text-muted-light: #8E8E93;
--text-muted-dark: #98989D;
--blue-light: #007AFF;
--blue-dark: #0A84FF;
--purple-light: #AF52DE;
--purple-dark: #BF5AF2;
--green-light: #34C759;
--green-dark: #30D158;
--orange-light: #FF9500;
--orange-dark: #FF9F0A;
--border-light: rgba(60,60,67,0.18);
--border-dark: rgba(255,255,255,0.15);
--glass-blur: blur(40px) saturate(200%);
--spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
--smooth: cubic-bezier(0.25, 0.1, 0.25, 1);
--text-primary: var(--text-light);
--text-secondary: var(--text-muted-light);
--app-blue: var(--blue-light);
--app-purple: var(--purple-light);
--app-border: var(--border-light);
--card-bg: var(--card-light);
--app-bg: var(--bg-light);
--app-green: var(--green-light);
--app-orange: var(--orange-light);
}
@media (prefers-color-scheme: dark) {
:root {
--text-primary: var(--text-dark); --text-secondary: var(--text-muted-dark);
--app-blue: var(--blue-dark); --app-purple: var(--purple-dark);
--app-border: var(--border-dark); --card-bg: var(--card-dark);
--app-bg: var(--bg-dark); --app-green: var(--green-dark); --app-orange: var(--orange-dark);
}
}
body.dark-theme {
--text-primary: var(--text-dark); --text-secondary: var(--text-muted-dark);
--app-blue: var(--blue-dark); --app-purple: var(--purple-dark);
--app-border: var(--border-dark); --card-bg: var(--card-dark);
--app-bg: var(--bg-dark); --app-green: var(--green-dark); --app-orange: var(--orange-dark);
}
body.light-theme {
--text-primary: var(--text-light); --text-secondary: var(--text-muted-light);
--app-blue: var(--blue-light); --app-purple: var(--purple-light);
--app-border: var(--border-light); --card-bg: var(--card-light);
--app-bg: var(--bg-light); --app-green: var(--green-light); --app-orange: var(--orange-light);
}
html, body {
width: 100%; min-height: 100vh;
font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
-webkit-font-smoothing: antialiased; letter-spacing: -0.02em;
color: var(--text-primary); background-color: var(--app-bg);
transition: background-color 0.4s var(--smooth), color 0.4s var(--smooth);
overflow-x: hidden;
overscroll-behavior-y: none;
}
.mesh-bg {
position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none;
background: radial-gradient(circle at 10% 20%, rgba(0, 122, 255, 0.12) 0%, transparent 50%),
radial-gradient(circle at 90% 10%, rgba(175, 82, 222, 0.12) 0%, transparent 50%),
radial-gradient(circle at 80% 90%, rgba(52, 199, 89, 0.08) 0%, transparent 50%),
radial-gradient(circle at 20% 80%, rgba(255, 149, 0, 0.08) 0%, transparent 50%);
transition: background 0.5s var(--smooth);
}
body.dark-theme .mesh-bg, @media (prefers-color-scheme: dark) {
.mesh-bg {
background: radial-gradient(circle at 10% 20%, rgba(10, 132, 255, 0.25) 0%, transparent 60%),
radial-gradient(circle at 90% 10%, rgba(191, 90, 242, 0.25) 0%, transparent 60%),
radial-gradient(circle at 80% 90%, rgba(48, 209, 88, 0.18) 0%, transparent 60%),
radial-gradient(circle at 20% 80%, rgba(255, 159, 10, 0.18) 0%, transparent 60%);
}
}
.app-header {
position: sticky; top: 0; z-index: 100; padding: env(safe-area-inset-top) 20px 14px;
background: var(--card-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
border-bottom: 0.5px solid var(--app-border);
transition: background 0.4s var(--smooth), border-color 0.4s var(--smooth);
}
.header-container { max-width: 800px; margin: 0 auto; display: flex; justify-content: space-between; align-items: flex-end; }
.header-titles { display: flex; flex-direction: column; gap: 2px; }
.header-date { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 0.05em; }
.header-title { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.04em; }
.theme-btn {
width: 36px; height: 36px; border-radius: 18px; background: rgba(142,142,147,0.15);
display: flex; justify-content: center; align-items: center; border: none; cursor: pointer;
color: var(--app-blue); transition: transform 0.2s var(--spring), background 0.2s;
}
.theme-btn:active { transform: scale(0.85); background: rgba(142,142,147,0.3); }
.theme-btn svg { width: 20px; height: 20px; fill: currentColor; }
.main-content { max-width: 800px; margin: 0 auto; padding: 20px 20px calc(env(safe-area-inset-bottom) + 40px); }
.holiday-alert {
background: rgba(255,149,0,0.15); border-radius: 20px; padding: 16px 20px; margin-bottom: 24px;
display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 0.95rem; color: var(--app-orange);
animation: scaleIn 0.6s var(--spring) both;
}
.holiday-alert svg { width: 24px; height: 24px; fill: currentColor; flex-shrink:0; }
.timeline-scroll {
display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory;
padding-bottom: 20px; margin: 0 -20px; padding-inline: 20px;
-webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.timeline-scroll::-webkit-scrollbar { display: none; }
.status-card {
flex: 0 0 calc(100% - 40px); max-width: 340px; scroll-snap-align: center;
background: var(--card-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
border: 0.5px solid var(--app-border); border-radius: 32px; padding: 24px;
box-shadow: 0 8px 32px rgba(0,0,0,0.06); position: relative; overflow: hidden;
transition: transform 0.3s var(--spring);
}
.status-card.active { border-color: var(--app-blue); box-shadow: 0 12px 40px rgba(0, 122, 255, 0.15); }
.status-card.recess { border-color: var(--app-orange); box-shadow: 0 12px 40px rgba(255, 149, 0, 0.12); }
@media (min-width: 768px) {
.timeline-scroll { grid-template-columns: 1fr 1fr; display: grid; overflow: visible; margin:0; padding:0 0 24px; }
.status-card { flex: auto; max-width: none; }
}
.status-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.status-label { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;}
.status-label.current { color: var(--app-blue); }
.status-card.recess .status-label.current { color: var(--app-orange); }
.status-label.next { color: var(--app-purple); }
.status-label svg { width: 14px; height: 14px; fill: currentColor; }
.status-badge { background: rgba(142,142,147,0.15); color: var(--text-primary); padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.status-card.active .status-badge { background: rgba(0,122,255,0.15); color: var(--app-blue); }
.status-card.recess .status-badge { background: rgba(255,149,0,0.15); color: var(--app-orange); }
.status-card.next .status-badge { background: rgba(175,82,222,0.15); color: var(--app-purple); }
.status-subject { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.04em; margin-bottom: 6px; line-height: 1.1; }
.status-detail { font-size: 0.95rem; font-weight: 600; color: var(--text-secondary); display: flex; flex-direction: column; gap: 2px; }
.status-teacher { margin-top: 24px; padding-top: 20px; border-top: 0.5px solid var(--app-border); display: flex; align-items: center; gap: 14px; }
.teacher-ava { width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(135deg, var(--app-blue), var(--app-purple)); color: white; display: flex; justify-content: center; align-items: center; font-weight: 700; font-size: 1.1rem; box-shadow: 0 4px 16px rgba(0, 122, 255, 0.3); }
.status-card.next .teacher-ava { background: linear-gradient(135deg, var(--app-purple), #FF2D55); box-shadow: 0 4px 16px rgba(175, 82, 222, 0.3); }
.teacher-name { font-size: 1rem; font-weight: 600; color: var(--text-primary); }
.progress-bar-container { position: absolute; bottom: 0; left: 0; width: 100%; height: 6px; background: transparent;}
.progress-fill { height: 100%; background: var(--app-blue); width: 0%; transition: width 1s linear; border-radius: 0 6px 6px 0; }
.status-card.recess .progress-fill { background: var(--app-orange); }
.quick-stats { display: flex; gap: 12px; margin-bottom: 32px; flex-wrap: wrap;}
.stat-pill { background: var(--card-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 0.5px solid var(--app-border); border-radius: 20px; padding: 12px 20px; flex: 1; min-width: 140px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); }
.stat-icon { width: 36px; height: 36px; border-radius: 12px; display: flex; justify-content: center; align-items: center; background: rgba(142,142,147,0.15); color: var(--text-primary); }
.stat-icon.blue { background: rgba(0, 122, 255, 0.15); color: var(--app-blue); }
.stat-icon.purple { background: rgba(175, 82, 222, 0.15); color: var(--app-purple); }
.stat-icon svg { width: 18px; height: 18px; fill: currentColor; }
.stat-info { display: flex; flex-direction: column; }
.stat-val { font-size: 1.1rem; font-weight: 800; letter-spacing: -0.02em; }
.stat-lbl { font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em;}
.section-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 16px; margin-top: 10px; }
.section-title { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.03em; display: flex; align-items: center; gap: 8px; }
.section-title svg { width: 22px; height: 22px; fill: var(--app-blue); }
.section-action { color: var(--app-blue); font-size: 0.9rem; font-weight: 600; text-decoration: none; background: none; border: none; cursor: pointer; padding: 4px 8px; border-radius: 12px; transition: background 0.2s; }
.section-action:active { background: rgba(0,122,255,0.1); }
.schedule-container { background: var(--card-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 0.5px solid var(--app-border); border-radius: 32px; padding: 20px 0; margin-bottom: 32px; overflow-x: auto; -webkit-overflow-scrolling: touch; box-shadow: 0 8px 32px rgba(0,0,0,0.04); }
.schedule-scroll-inner { padding: 0 20px; min-width: max-content; }
.days-row { display: grid; grid-template-columns: 80px repeat(5, 140px); gap: 12px; margin-bottom: 12px; }
.day-hdr { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); text-align: center; padding: 8px 0; }
.day-hdr.today { color: var(--app-blue); background: rgba(0,122,255,0.1); border-radius: 14px; }
.time-row { display: grid; grid-template-columns: 80px repeat(5, 140px); gap: 12px; margin-bottom: 12px; align-items: stretch; }
.time-col { font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); text-align: right; padding-right: 12px; display: flex; flex-direction: column; justify-content: center; }
.cell-block { background: rgba(142,142,147,0.1); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; cursor: pointer; transition: transform 0.2s var(--spring), background 0.2s, box-shadow 0.2s var(--spring); border: 1.5px solid transparent; min-height: 90px; }
.cell-block:active { transform: scale(0.95); }
.cell-block.active { background: var(--app-blue); box-shadow: 0 8px 24px rgba(0,122,255,0.3); border-color: rgba(255,255,255,0.2); }
.cell-block.active .cell-sj, .cell-block.active .cell-cd { color: white; }
.cell-block.recess { background: rgba(255,149,0,0.12); pointer-events: none; }
.cell-block.recess .cell-sj { color: var(--app-orange); }
.cell-block.free { background: transparent; border: 1.5px dashed var(--app-border); opacity: 0.6; pointer-events: none; }
.cell-sj { font-size: 0.9rem; font-weight: 700; margin-bottom: 4px; line-height: 1.2; word-break: break-word; }
.cell-cd { font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); }
.list-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px; }
.list-row { background: var(--card-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 0.5px solid var(--app-border); border-radius: 24px; padding: 16px; display: flex; align-items: center; gap: 16px; cursor: pointer; transition: transform 0.2s var(--spring), background 0.2s; box-shadow: 0 4px 16px rgba(0,0,0,0.03); }
.list-row:active { transform: scale(0.97); background: rgba(142,142,147,0.15); }
.row-icon { width: 52px; height: 52px; border-radius: 16px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-variant-numeric: tabular-nums; }
.row-icon.blue { background: rgba(0,122,255,0.12); color: var(--app-blue); }
.row-icon.orange { background: rgba(255,149,0,0.12); color: var(--app-orange); }
.row-icon.green { background: rgba(52,199,89,0.12); color: var(--app-green); }
.row-icon.purple { background: rgba(175,82,222,0.12); color: var(--app-purple); }
.row-icon.ava { background: linear-gradient(135deg, var(--app-blue), var(--app-purple)); color: white; font-weight: 700; font-size: 1.2rem; box-shadow: 0 4px 12px rgba(0, 122, 255, 0.2); }
.r-day { font-size: 1.1rem; font-weight: 800; line-height: 1; }
.r-mo { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; margin-top: 2px;}
.row-content { flex: 1; }
.row-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 2px; }
.row-desc { font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); }
.row-arrow { color: var(--text-secondary); opacity: 0.5; }
.row-arrow svg { width: 24px; height: 24px; fill: currentColor; }
.modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 2000; display: flex; justify-content: center; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.4s var(--smooth); }
@media (min-width: 768px) { .modal-overlay { align-items: center; } }
.modal-overlay.show { opacity: 1; pointer-events: all; }
.modal-pane { background: var(--bg-light); width: 100%; max-width: 500px; border-radius: 36px 36px 0 0; padding: 32px 24px calc(env(safe-area-inset-bottom) + 24px); transform: translateY(100%); transition: transform 0.5s var(--spring); position: relative; }
@media (prefers-color-scheme: dark) { .modal-pane { background: #1C1C1E; } }
body.dark-theme .modal-pane { background: #1C1C1E; border-top: 0.5px solid var(--app-border); }
body.light-theme .modal-pane { background: var(--bg-light); }
@media (min-width: 768px) { .modal-pane { border-radius: 36px; transform: scale(0.9) translateY(40px); border: 0.5px solid var(--app-border); padding-bottom: 32px;} .modal-overlay.show .modal-pane { transform: scale(1) translateY(0); } }
.modal-overlay.show .modal-pane { transform: translateY(0); }
.modal-drag { width: 40px; height: 5px; border-radius: 3px; background: rgba(142,142,147,0.3); margin: -16px auto 24px; }
@media (min-width: 768px) { .modal-drag { display: none; } }
.modal-close { position: absolute; top: 20px; right: 20px; width: 32px; height: 32px; border-radius: 16px; background: rgba(142,142,147,0.2); display: flex; justify-content: center; align-items: center; border: none; color: var(--text-primary); cursor: pointer; }
.modal-close svg { width: 14px; height: 14px; fill: currentColor; }
.m-icon { width: 80px; height: 80px; border-radius: 24px; background: linear-gradient(135deg, var(--app-blue), var(--app-purple)); margin: 0 auto 20px; display: flex; justify-content: center; align-items: center; box-shadow: 0 12px 32px rgba(0,122,255,0.3); }
.m-icon.ava { font-size: 2rem; font-weight: 800; color: white; }
.m-icon svg { width: 40px; height: 40px; fill: white; }
.m-title { text-align: center; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.04em; margin-bottom: 4px; }
.m-subtitle { text-align: center; font-size: 1rem; font-weight: 600; color: var(--app-blue); margin-bottom: 32px; }
.m-box { background: rgba(142,142,147,0.1); border-radius: 20px; padding: 16px 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
.m-lbl { font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }
.m-val { font-size: 1rem; font-weight: 700; text-align: right; }
.m-chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 24px; }
.m-chip { background: rgba(0,122,255,0.1); color: var(--app-blue); padding: 10px 18px; border-radius: 20px; font-size: 0.9rem; font-weight: 700; border: 0.5px solid rgba(0,122,255,0.2); }
@keyframes scaleIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
<div class="mesh-bg"></div>
<header class="app-header">
<div class="header-container">
<div class="header-titles">
<div class="header-date" id="date">Cargando...</div>
<div class="header-title">2° Grupo C</div>
</div>
<button class="theme-btn" id="themeBtn" aria-label="Toggle Theme">
<svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9-4.03-9-9-9zm0 16c-3.86 0-7-3.14-7-7s3.14-7 7-7 7 3.14 7 7-3.14 7-7 7z"/></svg>
</button>
</div>
</header>
<main class="main-content">
<div id="holidayAlert" class="holiday-alert" style="display:none;">
<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
<span><span id="holidayName"></span></span>
</div>
<div class="quick-stats">
<div class="stat-pill">
<div class="stat-icon blue"><svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/><path d="M12.5 7H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg></div>
<div class="stat-info"><div class="stat-val" id="clock">--:--</div><div class="stat-lbl">Hora Actual</div></div>
</div>
<div class="stat-pill">
<div class="stat-icon purple"><svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM5 19V9h14v10H5z"/></svg></div>
<div class="stat-info"><div class="stat-val" id="timeLeft">--</div><div class="stat-lbl">Para Salir</div></div>
</div>
</div>
<div class="timeline-scroll">
<div class="status-card" id="currentCard">
<div class="progress-bar-container"><div class="progress-fill" id="classProgress"></div></div>
<div class="status-header">
<div class="status-label current"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>EN CURSO</div>
<div class="status-badge" id="currentTimeBadge">--:-- - --:--</div>
</div>
<div class="status-subject" id="currentSubject">Cargando...</div>
<div class="status-detail"><span id="currentRoom"></span></div>
<div class="status-teacher" id="currentTeacherInfo">
<div class="teacher-ava" id="currentInitials">--</div>
<div class="teacher-name" id="currentTeacher">--</div>
</div>
</div>
<div class="status-card next" id="nextCard">
<div class="status-header">
<div class="status-label next"><svg viewBox="0 0 24 24"><path d="M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61l1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42C16.07 4.74 14.12 4 12 4c-4.97 0-9 4.03-9 9s4.02 9 9 9 9-4.03 9-9c0-2.12-.74-4.07-1.97-5.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>SIGUIENTE</div>
<div class="status-badge" id="nextTimeBadge">--:--</div>
</div>
<div class="status-subject" id="nextSubject">--</div>

{ n: 'Luis Humberto Concha Caballero', s: ['Actividades Físicas II'], i: 'LH' }
];
const hols = [
{ d: '2026-02-16', n: 'Carnaval' }, { d: '2026-02-17', n: 'Carnaval' },
{ d: '2026-03-21', n: 'Natalicio de Juárez' }, { d: '2026-04-06', n: 'Inicio Sem. Santa' },

{ d: '2026-05-05', n: 'Batalla de Puebla' }
];
const tz = 'America/Cancun';
const dys = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes'];
function pad(n){ return n<10?'0'+n:n; }
function to12(t) { let [h,m]=t.split(':').map(Number); return `${h%12||12}:${pad(m)} ${h>=12?'PM':'AM'}`; }
function psTm(t) { let [h,m]=t.split(':').map(Number); return h*60+m; }
function nn() { let d=new Date(new Date().toLocaleString("en-US",{timeZone:tz})); return d.getHours()*60+d.getMinutes(); }
function gd() { return ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'][new Date(new Date().toLocaleString("en-US",{timeZone:tz})).getDay()]; }
function chkHol() {
let dt = new Date().toISOString().split('T')[0]; let h = hols.find(x=>x.d===dt);
if(h){document.getElementById('holidayAlert').style.display='flex'; document.getElementById('holidayName').textContent=h.n;}
}
function tCls() { let t=gd(); if(!data[t]) return null; let n=nn(); return data[t].find(s=>{let [b,e]=s.time.split('-').map(psTm); return n>=b&&n<e;}); }
function nCls() { let t=gd(); let n=nn(); if(!data[t]) return null;
for(let s of data[t]){if(psTm(s.time.split('-')[0])>n && s.type==='cls') return s;}
for(let j=dys.indexOf(t)+1; j<dys.length; j++){for(let s of data[dys[j]]){if(s.type==='cls') return {...s,dy:dys[j]};}}
return null;
}
function upd() {
let d = new Date(new Date().toLocaleString("en-US",{timeZone:tz}));
document.getElementById('clock').textContent=`${d.getHours()%12||12}:${pad(d.getMinutes())} ${d.getHours()>=12?'PM':'AM'}`;
document.getElementById('date').textContent=d.toLocaleDateString('es-MX',{weekday:'long',month:'long',day:'numeric'});
let c=tCls(); let n=nCls(); let t=gd(); let nm=nn();
if(c){
document.getElementById('currentSubject').textContent=c.sbj;
document.getElementById('currentTimeBadge').textContent=c.time.split('-').map(to12).join(' - ');
if(c.type==='cls'){
document.getElementById('currentRoom').textContent=`Aula ${c.code} • Prof. ${c.teacher}`;
document.getElementById('currentTeacherInfo').style.display='flex';
document.getElementById('currentTeacher').textContent=c.teacher;
document.getElementById('currentInitials').textContent=c.teacher.split(' ').map(x=>x[0]).join('').substring(0,2).toUpperCase();
} else { document.getElementById('currentRoom').textContent='Descanso'; document.getElementById('currentTeacherInfo').style.display='none'; }
let [b,e]=c.time.split('-').map(psTm);
document.getElementById('classProgress').style.width=Math.min(100,Math.max(0,((nm-b)/(e-b))*100))+'%';
document.getElementById('currentCard').className=`status-card ${c.type==='recess'?'recess':'active'}`;
} else {
document.getElementById('currentSubject').textContent='Sin Clase';
document.getElementById('currentTimeBadge').textContent='--:--';
document.getElementById('currentRoom').textContent='Fuera de horario';
document.getElementById('currentTeacherInfo').style.display='none';
document.getElementById('classProgress').style.width='0%';
document.getElementById('currentCard').className='status-card';
}
if(n){
document.getElementById('nextSubject').textContent=n.sbj;
document.getElementById('nextTimeBadge').textContent=to12(n.time.split('-')[0]);
document.getElementById('nextRoom').textContent=`Aula ${n.code}`;
if(n.dy) document.getElementById('nextCountdown').textContent=`Mañana (${n.dy})`;
else document.getElementById('nextCountdown').textContent=`En ${psTm(n.time.split('-')[0])-nm} min`;
document.getElementById('nextTeacherInfo').style.display='flex';
document.getElementById('nextTeacher').textContent=n.teacher;
document.getElementById('nextInitials').textContent=n.teacher.split(' ').map(x=>x[0]).join('').substring(0,2).toUpperCase();
} else {
document.getElementById('nextSubject').textContent='Fin de clases';
document.getElementById('nextTimeBadge').textContent='--:--';
document.getElementById('nextRoom').textContent='';
document.getElementById('nextCountdown').textContent='';
document.getElementById('nextTeacherInfo').style.display='none';
}
if(data[t]){
let ls=[...data[t]].reverse().find(s=>s.type==='cls');
if(ls&&nm<psTm(ls.time.split('-')[1])){let df=psTm(ls.time.split('-')[1])-nm; document.getElementById('timeLeft').textContent=`${Math.floor(df/60)}h ${df%60}m`;}
else document.getElementById('timeLeft').textContent='--';
}else document.getElementById('timeLeft').textContent='--';
hiLT(c);
}
function bldTbl() {
let dR=document.getElementById('daysRow'); dR.innerHTML=`<div></div>`;
dys.forEach(d=>{let dc=document.createElement('div'); dc.className=`day-hdr ${d===gd()?'today':''}`; dc.textContent=d.substring(0,3); dR.appendChild(dc);});
let tR=document.getElementById('timeRows'); tR.innerHTML='';
let slts=data['Lunes'].map(s=>s.time);
slts.forEach((tm,i)=>{
let row=document.createElement('div'); row.className='time-row';
let tc=document.createElement('div'); tc.className='time-col'; tc.innerHTML=tm.split('-').map(to12).join('<br>'); row.appendChild(tc);
dys.forEach(d=>{
let sd=data[d][i]; let cc=document.createElement('div');
if(sd.type==='free') cc.className='cell-block free';
else if(sd.type==='recess') { cc.className='cell-block recess'; cc.innerHTML=`<div class="cell-sj">Receso</div>`; }
else {
cc.className='cell-block'; cc.innerHTML=`<div class="cell-sj">${sd.sbj}</div><div class="cell-cd">${sd.code}</div>`;
cc.onclick=()=>openModal('Clase', sd.sbj, sd.time.split('-').map(to12).join(' - '), sd.teacher, false, sd.code);
}
row.appendChild(cc);
});
tR.appendChild(row);
});
}
function hiLT(c) {
document.querySelectorAll('.cell-block.active').forEach(e=>e.classList.remove('active'));
if(!c||c.type==='recess'||c.type==='free') return;
let dI=dys.indexOf(gd()); if(dI===-1) return;
let rs=document.getElementById('timeRows').children;
for(let r of rs){let cl=r.children[dI+1]; if(cl&&cl.textContent.includes(c.sbj)) cl.classList.add('active');}
}
function scrollToToday(){
let dI=dys.indexOf(gd()); if(dI===-1) return;
let sc=document.getElementById('scheduleCont');
sc.scrollTo({left: 80+(dI*152)-40, behavior:'smooth'});
}
function bldTch() {
let c=document.getElementById('teachersList'); c.innerHTML='';
tchrs.forEach(t=>{
let el=document.createElement('div'); el.className='list-row';
el.onclick=()=>openModal('Docente', t.n, t.s.join(', '), '', false, '', t.i);
el.innerHTML=`<div class="row-icon ava">${t.i}</div><div class="row-content"><div class="row-title">${t.n}</div><div class="row-desc">${t.s.length} Materia${t.s.length>1?'s':''}</div></div><div class="row-arrow"><svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></div>`;
c.appendChild(el);
});
}
function openModal(tp, ti, su, dp, ev, cd, ava) {
document.getElementById('mTitle').textContent=ti; document.getElementById('mSubtitle').textContent=su;
let ic='';
if(ava) ic=`<div class="m-icon ava">${ava}</div>`;
else if(ev) ic=`<div class="m-icon"><svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg></div>`;
else ic=`<div class="m-icon"><svg viewBox="0 0 24 24"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9z"/></svg></div>`;
document.getElementById('modalIconContainer').outerHTML=`<div id="modalIconContainer" class="m-icon ${ava?'ava':''}">${ava?ava:ic}</div>`;
let b=document.getElementById('modalBody'); b.innerHTML='';
if(dp) b.innerHTML+=`<div class="m-box"><div class="m-lbl">${ev?'Detalle':'Profesor'}</div><div class="m-val">${dp}</div></div>`;
if(cd) b.innerHTML+=`<div class="m-box"><div class="m-lbl">Aula / Código</div><div class="m-val">${cd}</div></div>`;
if(ava){
let s=tchrs.find(x=>x.i===ava).s; let h=`<div class="m-chips">`;
s.forEach(x=>h+=`<div class="m-chip">${x}</div>`); h+=`</div>`; b.innerHTML+=h;
}
document.getElementById('customModal').classList.add('show');
}
function closeModal(){document.getElementById('customModal').classList.remove('show');}
document.getElementById('customModal').addEventListener('click', e=>{if(e.target.id==='customModal') closeModal();});
function togThm() {
let b=document.body, isD=!b.classList.contains('dark-theme');
if(localStorage.getItem('theme')==='dark') isD=false; else if(localStorage.getItem('theme')==='light') isD=true; else isD=!window.matchMedia('(prefers-color-scheme: dark)').matches;
if(isD){b.classList.add('dark-theme'); b.classList.remove('light-theme'); localStorage.setItem('theme','dark'); document.getElementById("themeColorMeta").content="#000000";}
else{b.classList.add('light-theme'); b.classList.remove('dark-theme'); localStorage.setItem('theme','light'); document.getElementById("themeColorMeta").content="#F2F2F7";}
}
document.getElementById('themeBtn').onclick=togThm;
document.addEventListener('DOMContentLoaded', ()=>{
let t=localStorage.getItem('theme');
if(t==='dark'){document.body.classList.add('dark-theme'); document.getElementById("themeColorMeta").content="#000000";}
else if(t==='light'){document.body.classList.add('light-theme'); document.getElementById("themeColorMeta").content="#F2F2F7";}
chkHol(); bldTbl(); bldTch(); upd(); setInterval(upd, 1000);
setTimeout(scrollToToday, 500);
});
