<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#041018" id="themeColorMeta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Horario III B">
  <title>Horario III B | COBAQROO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #041018;
      --ink: #F7FBFF;
      --mute: #C5D4E2;
      --faint: #9AADC0;
      --line: rgba(255,255,255,0.14);
      --brand: #4DA6FF;
      --brand-ink: #041018;
      --accent: #4DA6FF;
      --glass: linear-gradient(165deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.05) 45%, rgba(40,120,200,0.12) 100%);
      --g-bd: rgba(255,255,255,0.22);
      --g-hi: inset 0 1px 0 rgba(255,255,255,0.34), inset 0 -1px 0 rgba(255,255,255,0.05);
      --g-sh: inset 0 1px 0 rgba(255,255,255,0.34), 0 16px 40px rgba(4,16,32,0.5);
      --r: 22px;
      --r-sm: 16px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --safe-b: env(safe-area-inset-bottom, 0px);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { overflow-x: hidden; color-scheme: dark; }
    body {
      font-family: var(--font);
      background: #041018;
      color: var(--ink);
      min-height: 100vh;
      min-height: 100dvh;
      padding-bottom: calc(108px + var(--safe-b));
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    .ambient {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 90% 55% at -10% -8%, rgba(20, 90, 180, 0.55), transparent 52%),
        radial-gradient(ellipse 80% 50% at 110% 8%, rgba(40, 140, 220, 0.38), transparent 50%),
        radial-gradient(ellipse 70% 45% at 50% 110%, rgba(8, 40, 80, 0.55), transparent 55%),
        radial-gradient(ellipse 40% 30% at 70% 40%, color-mix(in srgb, var(--accent) 28%, transparent), transparent 60%);
      transition: background 0.8s var(--ease);
    }

    .wrap {
      position: relative; z-index: 1;
      width: min(520px, 100%);
      margin: 0 auto;
      padding: 18px 16px 8px;
    }

    .wrap > header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 18px; gap: 12px;
    }
    .brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .brand small {
      font-size: 11px; color: var(--mute); font-weight: 600;
      letter-spacing: 0.14em; text-transform: uppercase;
    }
    .brand h1 {
      font-size: 26px; font-weight: 800; letter-spacing: -0.05em; line-height: 1.05;
    }
    .brand h1 span { color: #fff; }
    .brand p { font-size: 12px; color: var(--mute); font-weight: 500; margin-top: 3px; }

    .meta {
      text-align: right;
      padding: 8px 12px;
      border-radius: 16px;
      background: var(--glass);
      border: 1px solid var(--g-bd);
      box-shadow: var(--g-sh);
      backdrop-filter: blur(22px) saturate(160%);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
    }
    #clock {
      font-size: 15px; font-weight: 700; letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums; color: var(--ink);
    }
    #date { font-size: 10px; color: var(--mute); margin-top: 2px; font-weight: 500; }

    .glass {
      background: var(--glass);
      border: 1px solid var(--g-bd);
      box-shadow: var(--g-sh);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
    }

    .tab { display: none; }
    .tab.active { display: block; animation: in 0.45s var(--ease); }
    @keyframes in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }

    .alert {
      display: none; align-items: center; gap: 10px;
      padding: 12px 14px; border-radius: 16px; margin-bottom: 14px;
      font-size: 13px; font-weight: 500;
      background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03));
      border: 1px solid rgba(255,255,255,0.14);
    }
    .alert b { color: var(--brand); font-weight: 700; }

    .hero {
      border-radius: 24px; padding: 18px 18px 16px;
      margin-bottom: 10px; position: relative; overflow: hidden;
      background: linear-gradient(165deg,
        color-mix(in srgb, var(--accent) 28%, rgba(255,255,255,0.12)) 0%,
        rgba(8, 24, 48, 0.45) 70%);
      border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--g-bd));
      box-shadow: var(--g-hi), 0 18px 44px rgba(4,16,32,0.45), 0 0 60px color-mix(in srgb, var(--accent) 22%, transparent);
      backdrop-filter: blur(32px) saturate(170%);
      -webkit-backdrop-filter: blur(32px) saturate(170%);
    }
    .hero::before {
      content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px;
      background: var(--accent); border-radius: 0 3px 3px 0; opacity: 0.95;
      box-shadow: 0 0 16px var(--accent);
    }
    .hero::after {
      content: ""; position: absolute; inset: 0 auto auto 0; width: 140%; height: 48%;
      background: linear-gradient(135deg, rgba(255,255,255,0.10), transparent 55%);
      pointer-events: none;
    }
    .hero-top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; position: relative; z-index: 1; gap: 10px;
    }
    .chip {
      font-size: 11px; color: #fff; font-weight: 800;
      letter-spacing: 0.08em; text-transform: uppercase;
      display: inline-flex; align-items: center; gap: 7px;
      padding: 5px 10px 5px 8px; border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,0.16), color-mix(in srgb, var(--accent) 18%, transparent));
      border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--g-bd));
      box-shadow: var(--g-hi);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }
    .chip i {
      width: 7px; height: 7px; border-radius: 50%; background: #fff;
      box-shadow: 0 0 0 4px rgba(255,255,255,0.22);
      animation: live 1.8s ease-in-out infinite;
    }
    @keyframes live {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.82); opacity: 0.7; }
    }
    .hero time {
      font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; font-weight: 600;
    }
    .hero h2 {
      font-size: 24px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.18;
      position: relative; z-index: 1;
    }
    .hero-meta {
      margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px;
      position: relative; z-index: 1;
    }
    .pill {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 12px; color: #fff; font-weight: 600;
      padding: 5px 10px; border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.04));
      border: 1px solid var(--g-bd);
      box-shadow: var(--g-hi);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    .pill ion-icon { font-size: 13px; color: var(--accent); }
    .who {
      display: flex; align-items: center; gap: 10px;
      margin-top: 14px; padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.08);
      position: relative; z-index: 1;
    }
    .ava {
      width: 36px; height: 36px; border-radius: 50%;
      display: grid; place-items: center;
      background: linear-gradient(180deg, rgba(255,255,255,0.18), color-mix(in srgb, var(--accent, var(--brand)) 22%, transparent));
      color: var(--accent, var(--brand));
      font-size: 11px; font-weight: 800; letter-spacing: 0.04em;
      border: 1px solid var(--g-bd);
      box-shadow: var(--g-hi);
    }
    .who p { font-size: 13.5px; font-weight: 600; }
    .who small { display: block; font-size: 11px; color: var(--mute); font-weight: 500; margin-top: 1px; }

    .hero-progress { margin-top: 16px; position: relative; z-index: 1; }
    .progress {
      height: 5px; border-radius: 99px; overflow: hidden;
      background: rgba(255,255,255,0.08);
    }
    .progress i {
      display: block; height: 100%; width: 0%;
      border-radius: inherit; background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      transition: width 0.7s var(--ease);
    }
    .remain-row {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-top: 8px; gap: 10px;
    }
    .remain-row span { font-size: 11px; color: var(--mute); font-weight: 600; }
    .remain-row b {
      font-size: 13px; font-weight: 800; color: #fff;
      font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
    }

    .next {
      border-radius: 20px; padding: 14px 16px;
      display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center;
      margin-bottom: 10px; position: relative; overflow: hidden;
      background: linear-gradient(165deg, rgba(255,255,255,0.12), color-mix(in srgb, var(--accent) 18%, rgba(8,24,48,0.4)));
      border: 1px solid var(--g-bd);
      box-shadow: var(--g-sh);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
    }
    .next::before {
      content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 2px;
      background: var(--accent); border-radius: 2px; opacity: 0.8;
    }
    .next small {
      grid-column: 1 / -1; font-size: 10px; color: var(--mute); font-weight: 800;
      letter-spacing: 0.12em; text-transform: uppercase;
    }
    .next h3 {
      font-size: 15px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.25;
    }
    .next em {
      font-style: normal; font-size: 13px; color: var(--brand); font-weight: 800;
      font-variant-numeric: tabular-nums; text-align: right;
    }
    .next span { font-size: 12px; color: var(--mute); font-weight: 500; }
    .next .next-time { text-align: right; }

    .strip {
      display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 12px;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .strip::-webkit-scrollbar { display: none; }
    .strip button {
      flex: 0 0 auto; border: 1px solid var(--g-bd);
      background: var(--glass); color: var(--mute);
      font: 700 10px var(--font); letter-spacing: 0.02em;
      padding: 8px 10px; border-radius: 14px; cursor: pointer;
      min-width: 58px; text-align: left; transition: 0.25s var(--ease);
      box-shadow: var(--g-hi);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }
    .strip button b { display: block; font-size: 11px; font-weight: 700; color: #fff; }
    .strip button span { display: block; margin-top: 2px; font-size: 9px; font-weight: 600; color: var(--faint); }
    .strip button.done { opacity: 0.45; }
    .strip button.live {
      background: linear-gradient(180deg, rgba(255,255,255,0.2), color-mix(in srgb, var(--accent) 28%, transparent));
      border-color: color-mix(in srgb, var(--accent) 55%, var(--g-bd));
      box-shadow: var(--g-hi), 0 0 18px color-mix(in srgb, var(--accent) 28%, transparent);
    }
    .strip button.live b { color: var(--ink); }
    .strip button.live span { color: var(--accent); }

    .metrics {
      display: grid; grid-template-columns: 1fr auto 1fr auto 1fr;
      align-items: center; gap: 0;
      border-radius: 20px; padding: 14px 6px; margin-bottom: 4px;
    }
    .metric { text-align: center; }
    .metric b {
      display: block; font-size: 18px; font-weight: 800; letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums; color: var(--ink);
    }
    .metric span {
      display: block; margin-top: 3px; font-size: 10px; color: var(--mute); font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    .rule { width: 1px; height: 28px; background: var(--line); }

    .bar { display: flex; justify-content: flex-end; margin-bottom: 12px; }
    .seg {
      display: flex; padding: 3px; border-radius: 999px; width: 100%;
    }
    .seg button {
      border: 0; background: transparent; color: var(--mute); flex: 1;
      font: 700 13px var(--font); padding: 9px 16px; border-radius: 999px;
      cursor: pointer; transition: 0.25s var(--ease);
    }
    .seg button.active {
      background: linear-gradient(180deg, rgba(255,255,255,0.28), rgba(255,255,255,0.08));
      color: #fff;
      border: 1px solid var(--g-bd);
      box-shadow: var(--g-hi);
    }

    .days {
      display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 14px;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .days::-webkit-scrollbar { display: none; }
    .days button {
      border: 1px solid var(--g-bd); background: var(--glass);
      color: var(--mute); font: 600 13px var(--font); padding: 9px 16px;
      border-radius: 999px; cursor: pointer; white-space: nowrap; transition: 0.25s var(--ease);
      box-shadow: var(--g-hi);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }
    .days button.active {
      background: linear-gradient(180deg, rgba(255,255,255,0.32), rgba(255,255,255,0.1));
      color: #fff; border-color: var(--g-bd);
      font-weight: 800;
      box-shadow: var(--g-hi), 0 8px 20px rgba(40,120,200,0.25);
    }

    .rail { display: flex; flex-direction: column; gap: 0; }
    .row {
      display: grid; grid-template-columns: 72px 16px 1fr;
      gap: 0 6px; cursor: pointer; min-height: 84px;
    }
    .row.quiet { cursor: default; min-height: 56px; }
    .tcol {
      display: flex; flex-direction: column; justify-content: center;
      font-variant-numeric: tabular-nums; padding: 12px 0;
    }
    .tcol b { font-size: 12px; font-weight: 700; }
    .tcol span { font-size: 11px; color: var(--mute); margin-top: 2px; font-weight: 500; }
    .axis { position: relative; }
    .axis::before {
      content: ""; position: absolute; left: 7px; top: 0; bottom: 0; width: 1px;
      background: linear-gradient(#1c2430, #2a3444, #1c2430);
    }
    .axis::after {
      content: ""; position: absolute; left: 4px; top: 32px; width: 7px; height: 7px;
      border-radius: 50%; background: var(--accent, var(--brand));
      box-shadow: 0 0 0 4px #041018, 0 0 10px color-mix(in srgb, var(--accent) 55%, transparent);
    }
    .row.quiet .axis::after { background: var(--faint); opacity: 0.7; box-shadow: 0 0 0 4px #041018; }
    .row.now .axis::after {
      width: 9px; height: 9px; left: 3px; top: 31px;
      background: var(--accent);
      box-shadow: 0 0 0 4px #041018, 0 0 14px var(--accent);
    }
    .card {
      margin: 7px 0; padding: 14px 14px 12px; border-radius: 18px;
      background: linear-gradient(165deg, rgba(255,255,255,0.14), color-mix(in srgb, var(--accent) 22%, rgba(8,24,48,0.42)));
      border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--g-bd));
      box-shadow: var(--g-hi), 0 12px 28px rgba(4,16,32,0.35);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      transition: transform 0.2s var(--ease);
    }
    .row:active .card { transform: scale(0.98); }
    .row.now .card {
      background: linear-gradient(165deg, rgba(255,255,255,0.2), color-mix(in srgb, var(--accent) 32%, rgba(8,24,48,0.5)));
      border-color: color-mix(in srgb, var(--accent) 55%, var(--g-bd));
      box-shadow: var(--g-hi), 0 12px 36px color-mix(in srgb, var(--accent) 28%, transparent);
    }
    .card h4 {
      font-size: 14.5px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.3;
    }
    .card p { margin-top: 6px; font-size: 12px; color: #D5E4F0; font-weight: 500; }
    .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .now-tag {
      flex-shrink: 0; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;
      color: #fff; background: linear-gradient(180deg, rgba(255,255,255,0.22), var(--accent));
      padding: 4px 8px; border-radius: 8px;
      font-weight: 800; margin-top: 1px;
      border: 1px solid var(--g-bd); box-shadow: var(--g-hi);
    }
    .mini-progress {
      height: 3px; border-radius: 99px; background: rgba(255,255,255,0.08);
      margin-top: 10px; overflow: hidden;
    }
    .mini-progress i {
      display: block; height: 100%; background: var(--accent); border-radius: inherit;
    }
    .note {
      margin: 10px 0; text-align: center; font-size: 12px; color: var(--mute); font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
    }

    .week { border-radius: 24px; padding: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; min-width: 720px; table-layout: fixed; border-collapse: separate; border-spacing: 6px; }
    th {
      font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--mute); font-weight: 700; padding: 10px 4px;
    }
    td {
      border-radius: 14px; padding: 12px 8px; text-align: center; cursor: pointer;
      background: rgba(255,255,255,0.03); border: 1px solid transparent;
      transition: 0.25s var(--ease); vertical-align: middle;
    }
    th:first-child, td.time { width: 72px; }
    th:not(:first-child), td:not(.time) { width: calc((100% - 72px) / 5); }
    td.time {
      background: none; cursor: default; width: 72px;
      font-size: 10px; color: var(--mute); font-variant-numeric: tabular-nums;
      line-height: 1.4; font-weight: 600;
    }
    td.cls {
      background: linear-gradient(165deg, rgba(255,255,255,0.14), color-mix(in srgb, var(--accent) 24%, rgba(8,24,48,0.4)));
      border-color: color-mix(in srgb, var(--accent) 40%, var(--g-bd));
      box-shadow: var(--g-hi);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }
    td.cls b { display: block; font-size: 12px; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; }
    td.cls span { display: block; margin-top: 3px; font-size: 10px; color: #D5E4F0; font-weight: 600; }
    td.off { border: 1px dashed var(--line); color: var(--faint); font-size: 11px; cursor: default; font-weight: 600; }
    td.rec { cursor: default; font-size: 11px; color: var(--mute); background: rgba(255,255,255,0.03); font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
    td.now {
      outline: none;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.16),
        0 0 0 1.5px var(--accent),
        0 0 20px color-mix(in srgb, var(--accent) 28%, transparent);
    }

    .search {
      width: 100%; border: 1px solid var(--g-bd);
      background: var(--glass); color: var(--ink);
      border-radius: 16px; padding: 14px 16px 14px 42px;
      font: 500 16px var(--font); outline: none; margin-bottom: 14px;
      box-shadow: var(--g-hi);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    }
    .search:focus { border-color: color-mix(in srgb, var(--brand) 50%, transparent); }
    .search-wrap { position: relative; }
    .search-wrap ion-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--mute); font-size: 18px;
    }

    .faculty { display: flex; flex-direction: column; gap: 8px; }
    .prof {
      display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center;
      padding: 14px 14px; border-radius: 18px; cursor: pointer;
      transition: transform 0.25s var(--ease);
      background: var(--glass);
      border: 1px solid var(--g-bd);
      box-shadow: var(--g-sh);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
    }
    .prof:active { transform: scale(0.985); }
    .prof h4 { font-size: 14px; font-weight: 700; letter-spacing: -0.02em; }
    .prof p { font-size: 12px; color: var(--mute); margin-top: 3px; font-weight: 500; }
    .hrs {
      font-size: 12px; color: #D6ECFF; font-weight: 800;
      padding: 6px 10px; border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,0.16), color-mix(in srgb, var(--brand) 22%, transparent));
      border: 1px solid var(--g-bd);
      box-shadow: var(--g-hi);
    }

    .task-compose {
      position: relative; z-index: 2;
      border-radius: 22px; padding: 16px; margin-bottom: 16px;
    }

    .task-compose small {
      display: block; font-size: 10px; font-weight: 800; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--mute); margin-bottom: 10px;
    }
    .task-filters {
      display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 12px;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
      position: relative; z-index: 0;
    }
    .task-filters::-webkit-scrollbar { display: none; }
    .task-chip {
      flex: 0 0 auto; border: 1px solid var(--g-bd);
      background: var(--glass); color: var(--mute);
      font: 700 12px var(--font); padding: 8px 12px; border-radius: 999px;
      cursor: pointer; white-space: nowrap; transition: 0.25s var(--ease);
      box-shadow: var(--g-hi);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    .task-chip.on {
      color: var(--ink);
      background: color-mix(in srgb, var(--accent, var(--brand)) 22%, transparent);
      border-color: color-mix(in srgb, var(--accent, var(--brand)) 42%, transparent);
    }
    .sub-pick { position: relative; margin-bottom: 12px; z-index: 1; }
    .sub-pick.open { z-index: 76; }
    .sub-trigger {
      width: 100%; display: flex; align-items: center; gap: 12px;
      border: 1px solid var(--g-bd);
      background: var(--glass);
      color: var(--ink); font: 700 14px var(--font);
      padding: 12px 14px; border-radius: 16px; cursor: pointer; text-align: left;
      box-shadow: var(--g-sh);
      backdrop-filter: blur(22px) saturate(160%);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
    }
    .sub-trigger span.label { flex: 1; letter-spacing: -0.02em; }
    .burger {
      width: 18px; height: 14px; display: flex; flex-direction: column; justify-content: space-between; flex-shrink: 0;
    }
    .burger i {
      display: block; height: 2px; border-radius: 2px; background: #fff;
      transition: transform 0.45s cubic-bezier(0.22, 1.7, 0.36, 1), opacity 0.2s;
    }
    .sub-pick.open .burger i:nth-child(1) { transform: translateY(6px) rotate(45deg); }
    .sub-pick.open .burger i:nth-child(2) { opacity: 0; transform: scaleX(0.3); }
    .sub-pick.open .burger i:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
    .sub-menu {
      position: absolute; left: 0; right: 0; top: calc(100% + 8px);
      max-height: 52vh; overflow: auto; -webkit-overflow-scrolling: touch;
      border-radius: 18px; padding: 6px;
      background: #0c2238;
      border: 1px solid var(--g-bd);
      box-shadow: 0 18px 40px rgba(0,0,0,0.55);
      transform-origin: top center;
      opacity: 0; visibility: hidden; pointer-events: none;
      transform: translateY(-16px) scale(0.86);
      animation: none;
      z-index: 0;
    }
    .sub-pick.open .sub-menu {
      visibility: visible; pointer-events: auto;
      z-index: 77;
      animation: menuBounce 0.58s cubic-bezier(0.22, 1.85, 0.32, 1) forwards;
    }
    @keyframes menuBounce {
      0% { opacity: 0; transform: translateY(-22px) scale(0.78); }
      58% { opacity: 1; transform: translateY(10px) scale(1.08); }
      78% { transform: translateY(-5px) scale(0.97); }
      100% { opacity: 1; transform: none; }
    }
    .sub-item {
      width: 100%; display: flex; align-items: center; gap: 10px;
      border: 0; background: transparent; color: var(--ink);
      font: 650 14px var(--font); padding: 12px 12px; border-radius: 12px;
      cursor: pointer; text-align: left;
    }
    .sub-item:active { background: rgba(255,255,255,0.08); }
    .sub-item.on {
      background: #1a3f63;
      color: #fff; font-weight: 800;
    }
    .sub-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
      background: var(--accent, #fff);
    }
    .task-input {
      width: 100%; min-height: 96px; resize: vertical;
      border: 1px solid var(--g-bd); border-radius: 16px;
      background: var(--glass); color: var(--ink);
      font: 500 16px var(--font); padding: 12px 14px; outline: none;
      line-height: 1.45;
      box-shadow: var(--g-hi);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }
    .task-input:focus { border-color: color-mix(in srgb, var(--brand) 50%, transparent); }
    .task-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    .btn-save, .btn-ghost {
      border: 0; cursor: pointer; font: 800 13px var(--font);
      padding: 11px 18px; border-radius: 999px; font-family: inherit;
    }
    .btn-save {
      background: linear-gradient(180deg, rgba(255,255,255,0.28), rgba(77,166,255,0.35));
      color: #fff; border: 1px solid var(--g-bd);
      box-shadow: var(--g-hi), 0 8px 20px rgba(40,120,200,0.3);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }
    .btn-save:active { transform: scale(0.97); }
    .btn-ghost {
      background: var(--glass); color: var(--mute);
      border: 1px solid var(--g-bd);
      box-shadow: var(--g-hi);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    .task-head {
      display: flex; justify-content: space-between; align-items: baseline;
      margin: 4px 2px 8px;
    }
    .task-head h3 { font-size: 15px; font-weight: 800; letter-spacing: -0.03em; }
    .task-head span {
      font-size: 12px; font-weight: 700; color: var(--brand);
      padding: 4px 8px; border-radius: 999px;
      background: color-mix(in srgb, var(--brand) 12%, transparent);
    }
    .task-gallery { display: flex; flex-direction: column; gap: 8px; position: relative; z-index: 0; isolation: isolate; }
    .task-card {
      border-radius: 18px; padding: 14px;
      background: linear-gradient(165deg, rgba(255,255,255,0.14), color-mix(in srgb, var(--accent) 22%, rgba(8,24,48,0.42)));
      border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--g-bd));
      box-shadow: var(--g-sh);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
    }
    .task-card header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px; gap: 10px;
    }
    .task-card h4 { font-size: 13px; font-weight: 800; letter-spacing: -0.02em; }
    .task-card time { font-size: 11px; color: var(--mute); font-weight: 600; }
    .task-card p {
      font-size: 14px; line-height: 1.45; font-weight: 500; white-space: pre-wrap;
      color: #E6ECF4;
    }
    .task-card footer {
      display: flex; justify-content: flex-end; gap: 6px; margin-top: 12px;
    }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 14px; cursor: pointer;
      display: grid; place-items: center; color: #7EC4FF;
      background: var(--glass);
      border: 1px solid var(--g-bd);
      box-shadow: var(--g-hi);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    .icon-btn ion-icon { font-size: 18px; }
    .icon-btn.danger {
      color: #FF8AA0;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,107,138,0.16));
      border-color: rgba(255,138,160,0.35);
    }
    .task-empty {
      text-align: center; color: var(--mute); font-size: 13px; font-weight: 600;
      padding: 28px 16px; line-height: 1.5;
    }

    .dock-wrap {
      position: fixed; left: 50%; bottom: calc(12px + var(--safe-b));
      transform: translateX(-50%);
      width: calc(100% - 18px); max-width: 430px;
      z-index: 90;
    }
    .dock {
      position: relative;
      height: 72px; display: flex; justify-content: space-around; align-items: center;
      border-radius: 28px; padding: 6px; gap: 2px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.06) 22%, rgba(8,28,56,0.55) 100%);
      border: 1px solid var(--g-bd);
      backdrop-filter: blur(44px) saturate(210%);
      -webkit-backdrop-filter: blur(44px) saturate(210%);
      box-shadow:
        inset 0 1.5px 0 rgba(255,255,255,0.4),
        inset 0 -1px 0 rgba(255,255,255,0.06),
        0 16px 40px rgba(4,16,32,0.55);
    }
    .dock-edge {
      position: absolute; inset: 1px; border-radius: 27px; pointer-events: none; z-index: 2;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
      background: linear-gradient(180deg, rgba(255,255,255,0.16), transparent 36%);
    }
    .dock-pill {
      position: absolute; top: 0; left: 0; z-index: 0; pointer-events: none;
      border-radius: 20px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.28) 0%, rgba(77,166,255,0.18) 100%);
      border: 1px solid var(--g-bd);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.5),
        0 8px 22px rgba(40,120,200,0.28);
      transform: translate3d(0,0,1px);
      transition:
        transform 0.62s cubic-bezier(0.32, 1.55, 0.42, 1),
        width 0.5s cubic-bezier(0.22, 1, 0.36, 1),
        height 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .dock-pill.punch { animation: pillPunch 0.5s var(--ease); }
    @keyframes pillPunch {
      0% { filter: brightness(1) saturate(1); }
      35% { filter: brightness(1.45) saturate(1.2); }
      100% { filter: brightness(1) saturate(1); }
    }
    .nav {
      position: relative; z-index: 4;
      background: none; border: 0; color: var(--mute);
      flex: 1; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; cursor: pointer; font-family: inherit; border-radius: 20px;
      transition: color 0.3s var(--ease), transform 0.25s var(--ease);
    }
    .nav-ic {
      display: grid; place-items: center; height: 24px;
      transition: transform 0.45s cubic-bezier(0.22, 1.4, 0.36, 1), filter 0.35s;
    }
    .nav ion-icon { font-size: 20px; }
    .nav > span:last-child {
      font-size: 9px; font-weight: 700; letter-spacing: 0.02em;
      transition: color 0.3s, transform 0.35s var(--ease), opacity 0.3s;
    }
    .nav.on { color: var(--brand); }
    .nav.on .nav-ic {
      transform: translateY(-2px) scale(1.14);
      filter: drop-shadow(0 6px 10px color-mix(in srgb, var(--brand) 50%, transparent));
    }
    .nav.on > span:last-child { transform: translateY(1px); }
    .nav.pop .nav-ic { animation: icPop 0.58s cubic-bezier(0.22, 1.5, 0.36, 1); }
    @keyframes icPop {
      0% { transform: scale(0.55) translateY(8px); }
      58% { transform: scale(1.28) translateY(-5px); }
      100% { transform: scale(1.14) translateY(-2px); }
    }
    .nav:active { transform: scale(0.92) translateY(1px); }

    .bot-stage {
      position: relative; height: 230px; margin: 6px -8px 0;
      overflow: hidden; pointer-events: none;
    }
    .hoy-bot {
      width: 280px; aspect-ratio: 1;
      position: absolute; bottom: 0; right: 0;
      translate: 18% 22%;
      filter: drop-shadow(0 14px 28px rgba(0,0,0,0.4));
    }
    .grok-bot-mark { width: 100%; height: auto; display: block; }
    .grok-bot-mark__head { fill: #fff; }
    .grok-bot-mark__eye { fill: #041018; }

    .veil {
      position: fixed; inset: 0; background: rgba(0, 2, 8, 0.55);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      z-index: 120; opacity: 0; visibility: hidden; transition: 0.3s var(--ease);
    }
    .veil.on { opacity: 1; visibility: visible; }
    .sheet {
      position: fixed; left: 0; bottom: 0; width: 100%;
      background: linear-gradient(180deg, rgba(8,28,56,0.78), rgba(4,16,32,0.88));
      border-top: 1px solid var(--g-bd);
      border-radius: 24px 24px 0 0; z-index: 130;
      padding: 14px 20px calc(28px + var(--safe-b)); max-height: 84vh; overflow: auto;
      transform: translateY(110%); transition: transform 0.45s var(--ease), opacity 0.3s var(--ease);
      visibility: hidden; pointer-events: none; opacity: 0;
      backdrop-filter: blur(32px) saturate(160%);
      -webkit-backdrop-filter: blur(32px) saturate(160%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
    }
    .sheet.on { transform: none; visibility: visible; pointer-events: auto; opacity: 1; }
    .handle { width: 36px; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.16); margin: 0 auto 18px; }
    .x {
      position: absolute; top: 16px; right: 16px; width: 32px; height: 32px;
      border-radius: 50%; border: 1px solid var(--g-bd);
      background: var(--glass); color: var(--mute);
      box-shadow: var(--g-hi);
      display: grid; place-items: center; cursor: pointer;
    }
    .sheet h2 { text-align: center; font-size: 20px; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.03em; }
    .sheet .sub { text-align: center; font-size: 13px; color: var(--mute); margin-bottom: 20px; font-weight: 500; }
    .kv {
      display: flex; justify-content: space-between; gap: 12px; align-items: center;
      padding: 13px 14px; border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      margin-bottom: 8px;
    }
    .kv small { font-size: 12px; color: var(--mute); font-weight: 600; }
    .kv b { font-size: 13.5px; font-weight: 700; text-align: right; }

    .s-math { --accent: #4D8EFF; }
    .s-eng  { --accent: #5B8CFF; }
    .s-hum  { --accent: #3DB4E6; }
    .s-len  { --accent: #3D9EFF; }
    .s-eco  { --accent: #2AD4C9; }
    .s-sci  { --accent: #3DDB8A; }
    .s-edu  { --accent: #5B7CFF; }
    .s-noc  { --accent: #6BB6FF; }
    .s-sal  { --accent: #FF6B8A; }
    .s-art  { --accent: #FFB43D; }
    .s-tut  { --accent: #8A9AA8; }
    .s-rec  { --accent: #6E7A86; }
    .s-off  { --accent: #7A8B9A; }

    @media (min-width: 860px) {
      .wrap { width: min(980px, 100%); padding: 28px 24px 12px; }
      #tabHoy, #tabProfesores, #tabTareas, #holidayAlertPanel { max-width: 520px; }
      header { max-width: 520px; }
      .brand h1 { font-size: 30px; }
      .hero h2 { font-size: 26px; }
      .sheet {
        max-width: 420px; left: 50%; bottom: auto; top: 50%;
        border-radius: 24px; border: 1px solid rgba(255,255,255,0.12);
        transform: translate(-50%, -46%) scale(0.98);
      }
      .sheet.on { transform: translate(-50%, -50%); }
    }
    @media (max-width: 380px) {
      .brand h1 { font-size: 22px; }
      .hero h2 { font-size: 21px; }
      .row { grid-template-columns: 64px 14px 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="ambient s-off" id="ambientGlow"></div>
  <div class="wrap">
    <header>
      <div class="brand">
        <small>Horario</small>
        <h1>III<span> · B</span></h1>
        <p>Cancún 4 · 2026-B</p>
      </div>
      <div class="meta">
        <div id="clock">--:--</div>
        <div id="date">Cargando…</div>
      </div>
    </header>

    <div id="holidayAlertPanel" class="alert">
      Hoy no hay clases · <b id="holidayAlertName"></b>
    </div>

    <section id="tabHoy" class="tab active">
      <article class="hero s-off" id="activeClassCard">
        <div class="hero-top">
          <div class="chip" id="activeChip"><i></i><span id="activeChipText">Ahora</span></div>
          <time id="activeClassTime">—</time>
        </div>
        <h2 id="activeClassSubject">Cargando…</h2>
        <div class="hero-meta" id="activeMetaRow">
          <span class="pill" id="activeClassRoomPill"><ion-icon name="location-outline"></ion-icon><span id="activeClassRoom">—</span></span>
        </div>
        <div class="who" id="activeTeacherBar">
          <div class="ava" id="activeTeacherInitials">—</div>
          <div>
            <p id="activeTeacherName">—</p>
            <small>Docente</small>
          </div>
        </div>
        <div class="hero-progress" id="activeProgressWrap" hidden>
          <div class="progress"><i id="activeClassProgress"></i></div>
          <div class="remain-row">
            <span id="activeElapsed">—</span>
            <b id="activeRemainVal">—</b>
          </div>
        </div>
      </article>

      <article class="next s-off" id="nextClassCard">
        <small>Siguiente</small>
        <h3 id="nextClassSubject">—</h3>
        <em id="nextClassCountdown">—</em>
        <span id="nextClassRoom"></span>
        <span class="next-time" id="nextClassTime">—</span>
      </article>

      <div class="strip" id="dayStrip"></div>

      <div class="metrics glass">
        <div class="metric"><b id="progressValText">0%</b><span>Progreso</span></div>
        <div class="rule"></div>
        <div class="metric"><b id="classesCountText">0</b><span>Clases</span></div>
        <div class="rule"></div>
        <div class="metric"><b id="timeLeftText">—</b><span>Salida</span></div>
      </div>
      <div class="bot-stage" aria-hidden="true">
        <div class="hoy-bot">
          <svg class="grok-bot-mark" viewBox="-15 -15 259 259" xmlns="http://www.w3.org/2000/svg">

            <g id="grokOverlay" fill="#4DA6FF" opacity="0"></g>
          </svg>
        </div>
      </div>
    </section>

    <section id="tabHorario" class="tab">
      <div class="bar">
        <div class="seg glass">
          <button id="btnSwitchTimeline" class="active" onclick="setTimetableView('timeline')">Día</button>
          <button id="btnSwitchGrid" onclick="setTimetableView('grid')">Semana</button>
        </div>
      </div>
      <div id="gridScheduleView" style="display:none">
        <div class="week glass">
          <table>
            <thead>
              <tr>
                <th>Hora</th><th>Lun</th><th>Mar</th><th>Mié</th><th>Jue</th><th>Vie</th>
              </tr>
            </thead>
            <tbody id="scheduleTableBody"></tbody>
          </table>
        </div>
      </div>
      <div id="timelineScheduleView">
        <div class="days" id="daySelectPills"></div>
        <div class="rail" id="timelineItemsContainer"></div>
      </div>
    </section>

    <section id="tabTareas" class="tab">
      <div class="task-compose glass">
        <small id="taskComposeLabel">Nueva tarea</small>
        <div class="sub-pick" id="taskSubjectPick">
          <button type="button" class="sub-trigger" id="taskSubjectBtn" onclick="toggleSubjectMenu(event)">
            <span class="burger" aria-hidden="true"><i></i><i></i><i></i></span>
            <span class="label" id="taskSubjectLabel">Materia</span>
          </button>
          <div class="sub-menu" id="taskSubjectMenu"></div>
        </div>
        <textarea id="taskTextInput" class="task-input" placeholder="Escribe la tarea que dejó esta materia" rows="3"></textarea>
        <div class="task-actions">
          <button type="button" class="btn-ghost" id="taskCancelBtn" hidden onclick="cancelTaskEdit()">Cancelar</button>
          <button type="button" class="btn-save" id="taskSaveBtn" onclick="saveTask()">Guardar</button>
        </div>
      </div>
      <div class="task-head">
        <h3>Galería</h3>
        <span id="taskCount">0</span>
      </div>
      <div class="task-filters" id="taskFilters"></div>
      <div class="task-gallery" id="taskGallery"></div>
    </section>

    <section id="tabProfesores" class="tab">
      <div class="search-wrap">

  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <script>
    const T = {
      leng: { subject: 'Lengua y Comunicación III', short: 'Lengua III', teacher: 'Helberth Arnold Ríos Sansores', codeBase: 'LENG III' },
      huma: { subject: 'Humanidades III', short: 'Humanidades III', teacher: 'Yolanda Piña Flores', codeBase: 'HUMA III' },
      sist: { subject: 'Sistema Educativo Nacional', short: 'Sist. Educativo', teacher: 'Leonela Paola Manzo de León', codeBase: 'SIST. EDUCA.' },
      eco: { subject: 'Ecosistemas', short: 'Ecosistemas', teacher: 'Carlos Castañeda Trujillo', codeBase: 'ECOSISTEMAS' },
      art: { subject: 'Actividades Físicas y Artísticas III', short: 'Act. Artísticas', teacher: 'Luis Humberto Concha Caballero', codeBase: 'ACT. ART. CULT. FIS. Y DEPOR. III' },
      eng: { subject: 'Inglés III', short: 'Inglés III', teacher: 'Graciela Rosalía May Polanco', codeBase: 'INGLÉS III' },
      pema: { subject: 'Pensamiento Matemático III', short: 'PEMA III', teacher: 'Inés Carreón Martínez', codeBase: 'PENMAT' },
      noc: { subject: 'Nociones de la Intervención Educativa', short: 'Nociones', teacher: 'Leonela Paola Manzo de León', codeBase: 'NOCIONES' },
      cien: { subject: 'Taller de Ciencias II', short: 'Ciencias II', teacher: 'Carlos Castañeda Trujillo', codeBase: 'CIENCIAS II' },
      salud: { subject: 'Educación para la Salud I', short: 'Educ. Salud I', teacher: 'Aurora de la Cruz Buenfil', codeBase: 'EDUC. SALUD I' },
      tutor: { subject: 'Tutoría', short: 'Tutoría', teacher: 'Tutor responsable de grupo', codeBase: 'TUTOR' }
    };

    function slot(time, key, room) {
      if (!key) return { time, subject: 'Libre', short: 'Libre', code: null, teacher: null, room: null, type: 'free' };
      if (key === 'recess') return { time, subject: 'Receso', short: 'Receso', code: 'RECESO', teacher: null, room: null, type: 'recess' };
      const m = T[key];
      return { time, subject: m.subject, short: m.short, code: `${m.codeBase} ${room}`, teacher: m.teacher, room, type: 'class' };
    }

    const scheduleData = {
      'Lunes': [
        slot('07:00-07:50', 'leng', 'A8'),
        slot('08:00-08:50', 'huma', 'A11'),
        slot('09:00-09:45', 'huma', 'A11'),
        slot('09:45-10:15', 'recess'),
        slot('10:15-11:00', 'sist', 'A14'),
        slot('11:00-11:50', 'sist', 'A14'),
        slot('12:00-12:50', 'eco', 'A5'),
        slot('13:00-13:50', 'art', 'A12')
      ],
      'Martes': [
        slot('07:00-07:50', 'eng', 'A10'),
        slot('08:00-08:50', 'eco', 'LM2/A5'),
        slot('09:00-09:45', 'eco', 'LM2/A5'),
        slot('09:45-10:15', 'recess'),
        slot('10:15-11:00', 'leng', 'A8'),
        slot('11:00-11:50', 'huma', 'A11'),
        slot('12:00-12:50', 'pema', 'A7'),
        slot('13:00-13:50', null)
      ],
      'Miércoles': [
        slot('07:00-07:50', null),
        slot('08:00-08:50', null),
        slot('09:00-09:45', 'eng', 'A10'),
        slot('09:45-10:15', 'recess'),
        slot('10:15-11:00', 'noc', 'A14'),
        slot('11:00-11:50', 'noc', 'A14'),
        slot('12:00-12:50', 'cien', 'A5'),
        slot('13:00-13:50', 'pema', 'A7')
      ],
      'Jueves': [
        slot('07:00-07:50', 'huma', 'A11'),
        slot('08:00-08:50', 'pema', 'A7'),
        slot('09:00-09:45', 'pema', 'A7'),
        slot('09:45-10:15', 'recess'),
        slot('10:15-11:00', 'cien', 'A5'),
        slot('11:00-11:50', 'cien', 'A5'),
        slot('12:00-12:50', 'noc', 'A14'),
        slot('13:00-13:50', 'noc', 'A14')
      ],
      'Viernes': [
        slot('07:00-07:50', 'huma', 'A11'),
        slot('08:00-08:50', 'leng', 'A8'),
        slot('09:00-09:45', 'sist', 'A14'),
        slot('09:45-10:15', 'recess'),
        slot('10:15-11:00', 'eco', 'A5'),
        slot('11:00-11:50', 'eng', 'A10'),
        slot('12:00-12:50', 'salud', 'A12'),
        slot('13:00-13:50', 'tutor', 'A11')
      ]
    };

    const teachers = [
      { name: 'Inés Carreón Martínez', subjects: ['Pensamiento Matemático III'], initials: 'IC', hours: 4 },
      { name: 'Graciela Rosalía May Polanco', subjects: ['Inglés III'], initials: 'GR', hours: 3 },
      { name: 'Aurora de la Cruz Buenfil', subjects: ['Educación para la Salud I'], initials: 'AC', hours: 1 },
      { name: 'Yolanda Piña Flores', subjects: ['Humanidades III'], initials: 'YP', hours: 5 },
      { name: 'Carlos Castañeda Trujillo', subjects: ['Taller de Ciencias II', 'Ecosistemas'], initials: 'CC', hours: 7 },
      { name: 'Leonela Paola Manzo de León', subjects: ['Sistema Educativo Nacional', 'Nociones de la Intervención Educativa'], initials: 'LM', hours: 7 },
      { name: 'Helberth Arnold Ríos Sansores', subjects: ['Lengua y Comunicación III'], initials: 'HR', hours: 3 },
      { name: 'Luis Humberto Concha Caballero', subjects: ['Actividades Físicas y Artísticas III'], initials: 'LH', hours: 2 }
    ];

    const holidays = [
      { name: 'Año Nuevo', dateStart: '2026-01-01', dateEnd: '2026-01-01' },
      { name: 'Receso intersemestral', dateStart: '2026-01-02', dateEnd: '2026-01-06' },
      { name: 'Constitución Mexicana', dateStart: '2026-02-02', dateEnd: '2026-02-02' },
      { name: 'Carnaval escolar', dateStart: '2026-02-16', dateEnd: '2026-02-17' },
      { name: 'Vacaciones de febrero', dateStart: '2026-02-18', dateEnd: '2026-02-20' },
      { name: 'Natalicio de Benito Juárez', dateStart: '2026-03-16', dateEnd: '2026-03-16' },
      { name: 'Carnaval regional', dateStart: '2026-03-17', dateEnd: '2026-03-18' },
      { name: 'Receso de primavera', dateStart: '2026-03-25', dateEnd: '2026-04-03' },
      { name: 'Vacaciones de Semana Santa', dateStart: '2026-04-06', dateEnd: '2026-04-23' },
      { name: 'Día del Trabajo', dateStart: '2026-05-01', dateEnd: '2026-05-01' },
      { name: 'Batalla de Puebla', dateStart: '2026-05-05', dateEnd: '2026-05-05' },
      { name: 'Día del Maestro', dateStart: '2026-05-15', dateEnd: '2026-05-15' },
      { name: 'Vacaciones de verano', dateStart: '2026-07-27', dateEnd: '2026-08-21' }
    ];

    const timeZone = 'America/Cancun';
    const days = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes'];
    let selectedDayForTimeline = 'Lunes';

    function getCancunDate() {
      const urlParams = new URLSearchParams(window.location.search);
      const mockDay = urlParams.get('mockDay');
      const mockTime = urlParams.get('mockTime');
      if (mockDay || mockTime) {
        const now = new Date(new Date().toLocaleString('en-US', { timeZone }));
        if (mockTime) {
          const [h, m] = mockTime.split(':').map(Number);
          now.setHours(h, m || 0, 0, 0);
        }
        if (mockDay) {
          const names = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
          const i = names.indexOf(mockDay);
          if (i !== -1) now.setDate(now.getDate() + (i - now.getDay()));
        }
        return now;
      }
      return new Date(new Date().toLocaleString('en-US', { timeZone }));
    }

    function convertTo12Hour(t) {
      const [h, m] = t.split(':').map(Number);
      return `${h % 12 || 12}:${String(m).padStart(2, '0')} ${h >= 12 ? 'PM' : 'AM'}`;
    }
    function parseTime(t) { const [h, m] = t.split(':').map(Number); return h * 60 + m; }
    function getCurrentTimeMinutes() { const n = getCancunDate(); return n.getHours() * 60 + n.getMinutes(); }
    function getTodayName() {
      const mock = new URLSearchParams(window.location.search).get('mockDay');
      if (mock) return mock;
      return ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'][getCancunDate().getDay()];
    }
    function isoToday() {
      const n = getCancunDate();
      return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
    }
    function getActiveHoliday() {
      const d = isoToday();
      return holidays.find(h => d >= h.dateStart && d <= h.dateEnd);
    }
    function getCurrentClassSlot() {
      const today = getTodayName();
      if (!scheduleData[today]) return null;
      const now = getCurrentTimeMinutes();
      const cur = scheduleData[today].find(s => {
        const [a, b] = s.time.split('-').map(t => parseTime(t.trim()));
        return now >= a && now < b;
      });
      if (cur) return cur;
      const slots = scheduleData[today];
      const first = parseTime(slots[0].time.split('-')[0].trim());
      const last = parseTime(slots[slots.length-1].time.split('-')[1].trim());
      if (now >= first && now < last) return { subject: 'Cambio de clase', type: 'gap', time: '', teacher: null, room: null };
      return null;
    }
    function getNextClassSlot() {
      const today = getTodayName();
      const now = getCurrentTimeMinutes();
      if (scheduleData[today]) {
        const f = scheduleData[today].find(s => parseTime(s.time.split('-')[0].trim()) > now && s.type !== 'free');
        if (f) return f;
      }
      const i = days.indexOf(today);
      for (let k = Math.max(i + 1, 0); k < days.length; k++) {
        const c = scheduleData[days[k]].find(s => s.type === 'class');
        if (c) return { ...c, nextDayName: days[k] };
      }
      if (i === -1) {
        const c = scheduleData.Lunes.find(s => s.type === 'class');
        if (c) return { ...c, nextDayName: 'Lunes' };
      }
      return null;
    }
    function getSubjectClass(subject) {
      if (!subject) return 's-off';
      const s = subject.toLowerCase();
      if (s.includes('matemático') || s.includes('pema')) return 's-math';
      if (s.includes('inglés')) return 's-eng';
      if (s.includes('humanidades')) return 's-hum';
      if (s.includes('lengua')) return 's-len';
      if (s.includes('ecosistema')) return 's-eco';
      if (s.includes('ciencias') || s.includes('taller')) return 's-sci';
      if (s.includes('sistema educativo') || s.includes('sist')) return 's-edu';
      if (s.includes('nociones') || s.includes('intervención')) return 's-noc';
      if (s.includes('salud')) return 's-sal';
      if (s.includes('físi') || s.includes('artíst') || s.includes('activid')) return 's-art';
      if (s.includes('tutor')) return 's-tut';
      if (s.includes('receso')) return 's-rec';
      return 's-off';
    }
    function teacherInitials(name) {
      const f = teachers.find(t => t.name === name);
      return f ? f.initials : (name ? name.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase() : '—');
    }
    function formatRange(time) {
      if (!time) return '—';
      return time.split('-').map(t => convertTo12Hour(t.trim())).join(' – ');
    }
    function roomLabel(room, type) {
      if (type === 'recess') return 'Descanso';
      if (type === 'free' || type === 'gap') return 'Sin clase';
      if (!room) return 'Sin aula';
      if (room.includes('/') || room.toLowerCase().includes('lab')) return room;
      return `Aula ${room}`;
    }
    function getSlotProgress(item) {
      if (!item || !item.time) return null;
      const now = getCurrentTimeMinutes();
      const [a, b] = item.time.split('-').map(t => parseTime(t.trim()));
      const dur = b - a;
      if (dur <= 0) return null;
      const elapsed = Math.max(0, Math.min(dur, now - a));
      return { elapsed, remaining: Math.max(0, b - now), pct: (elapsed / dur) * 100, dur };
    }
    function chipFor(current) {
      if (!current) {
        const today = getTodayName();
        return days.includes(today) ? 'Fuera de horario' : 'Fin de semana';
      }
      if (current.type === 'class') return 'En curso';
      if (current.type === 'recess') return 'Receso';
      if (current.type === 'free') return 'Hora libre';
      if (current.type === 'gap') return 'Cambio';
      return 'Ahora';
    }

    function updateAppStatus() {
      const holiday = getActiveHoliday();
      const alert = document.getElementById('holidayAlertPanel');
      if (holiday) {
        alert.style.display = 'flex';
        document.getElementById('holidayAlertName').textContent = holiday.name;
      } else alert.style.display = 'none';

      const current = getCurrentClassSlot();
      const next = getNextClassSlot();
      const today = getTodayName();
      const now = getCurrentTimeMinutes();
      const hero = document.getElementById('activeClassCard');
      const bar = document.getElementById('activeTeacherBar');
      const glow = document.getElementById('ambientGlow');
      const progressWrap = document.getElementById('activeProgressWrap');
      const chipEl = document.getElementById('activeChip');

      document.getElementById('activeChipText').textContent = chipFor(current);

      if (current) {
        document.getElementById('activeClassSubject').textContent = current.type === 'free' ? 'Hora libre' : current.subject;
        document.getElementById('activeClassTime').textContent = current.type === 'gap' ? 'Entre clases' : formatRange(current.time);
        document.getElementById('activeClassRoom').textContent = roomLabel(current.room, current.type);
        const tone = getSubjectClass(current.subject);
        hero.className = 'hero ' + tone;
        glow.className = 'ambient ' + tone;
        chipEl.style.display = 'inline-flex';
        if (current.type === 'class' && current.teacher && !current.teacher.startsWith('Tutor')) {
          bar.style.display = 'flex';
          document.getElementById('activeTeacherName').textContent = current.teacher;
          document.getElementById('activeTeacherInitials').textContent = teacherInitials(current.teacher);
        } else bar.style.display = 'none';
        const prog = getSlotProgress(current);
        if (prog && current.type !== 'gap') {
          progressWrap.hidden = false;
          document.getElementById('activeClassProgress').style.width = `${prog.pct}%`;
          document.getElementById('activeElapsed').textContent = `${prog.elapsed} min transcurridos`;
          document.getElementById('activeRemainVal').textContent = prog.remaining > 0 ? `${prog.remaining} min restantes` : 'Por terminar';
        } else progressWrap.hidden = true;
      } else {
        document.getElementById('activeClassSubject').textContent = 'Fuera de horario';
        document.getElementById('activeClassTime').textContent = '—';
        document.getElementById('activeClassRoom').textContent = days.includes(today) ? 'Sin clase ahora' : 'Fin de semana';
        bar.style.display = 'none';
        hero.className = 'hero s-off';
        glow.className = 'ambient s-off';
        progressWrap.hidden = true;
      }

      const nextCard = document.getElementById('nextClassCard');
      if (next) {
        document.getElementById('nextClassSubject').textContent = next.subject;
        document.getElementById('nextClassTime').textContent = formatRange(next.time);
        document.getElementById('nextClassRoom').textContent = next.room ? roomLabel(next.room, next.type) : (next.type === 'recess' ? 'Descanso' : '');
        nextCard.className = 'next ' + getSubjectClass(next.subject);
        document.getElementById('nextClassCountdown').textContent = next.nextDayName
          ? `${next.nextDayName} · ${convertTo12Hour(next.time.split('-')[0].trim())}`
          : `En ${parseTime(next.time.split('-')[0].trim()) - now} min`;
      } else {
        document.getElementById('nextClassSubject').textContent = 'Jornada terminada';
        document.getElementById('nextClassTime').textContent = '—';
        document.getElementById('nextClassRoom').textContent = '';
        document.getElementById('nextClassCountdown').textContent = 'Buen descanso';
        nextCard.className = 'next s-off';
      }

      if (scheduleData[today]) {
        const classes = scheduleData[today].filter(s => s.type === 'class');
        document.getElementById('classesCountText').textContent = classes.length;
        const done = classes.filter(s => now >= parseTime(s.time.split('-')[1].trim())).length;
        document.getElementById('progressValText').textContent = classes.length ? `${Math.round(done / classes.length * 100)}%` : '0%';
        const last = [...scheduleData[today]].reverse().find(s => s.type === 'class');
        if (last) {
          const d = parseTime(last.time.split('-')[1].trim()) - now;
          document.getElementById('timeLeftText').textContent = d > 0 ? `${Math.floor(d/60)}h ${d%60}m` : '—';
        }
      } else {
        document.getElementById('classesCountText').textContent = '0';
        document.getElementById('timeLeftText').textContent = '—';
        document.getElementById('progressValText').textContent = '0%';
      }

      renderDayStrip();
      highlightGridCells();
      renderTimelineView();
    }

    function renderDayStrip() {
      const box = document.getElementById('dayStrip');
      const today = getTodayName();
      const slots = scheduleData[today];
      if (!slots) { box.innerHTML = ''; box.style.display = 'none'; return; }
      box.style.display = 'flex';
      const now = getCurrentTimeMinutes();
      const cur = getCurrentClassSlot();
      box.innerHTML = '';
      slots.forEach(item => {
        const [a, b] = item.time.split('-').map(t => parseTime(t.trim()));
        const btn = document.createElement('button');
        const isNow = cur && item.time === cur.time && item.subject === cur.subject;
        const done = now >= b;
        btn.className = (isNow ? 'live ' : done ? 'done ' : '') + getSubjectClass(item.subject);
        const start = convertTo12Hour(item.time.split('-')[0].trim()).replace(' AM','').replace(' PM','');
        btn.innerHTML = `<b>${item.short}</b><span>${start}</span>`;
        if (item.type === 'class') btn.onclick = () => openClassSheet(item, today);
        box.appendChild(btn);
        if (isNow) requestAnimationFrame(() => btn.scrollIntoView({ inline: 'center', block: 'nearest' }));
      });
    }

    function layoutDockPill(btn, punch) {
      const pill = document.getElementById('dockPill');
      if (!pill || !btn) return;
      pill.style.width = btn.offsetWidth + 'px';
      pill.style.height = btn.offsetHeight + 'px';
      pill.style.transform = `translate3d(${btn.offsetLeft}px, ${btn.offsetTop}px, 0)`;
      if (punch) {
        pill.classList.remove('punch');
        void pill.offsetWidth;
        pill.classList.add('punch');
      }
    }

    function switchTab(id, btn) {
      closeSubjectMenu();
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav').forEach(b => { b.classList.remove('on', 'pop'); });
      document.getElementById('tab' + id).classList.add('active');
      btn.classList.add('on', 'pop');
      layoutDockPill(btn, true);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setTimetableView(view) {
      document.getElementById('btnSwitchTimeline').classList.toggle('active', view === 'timeline');
      document.getElementById('btnSwitchGrid').classList.toggle('active', view === 'grid');
      document.getElementById('timelineScheduleView').style.display = view === 'timeline' ? 'block' : 'none';
      document.getElementById('gridScheduleView').style.display = view === 'grid' ? 'block' : 'none';
    }

    function renderGridSchedule() {
      const body = document.getElementById('scheduleTableBody');
      body.innerHTML = '';
      scheduleData.Lunes.map(s => s.time).forEach((time, i) => {
        const tr = document.createElement('tr');
        const ttd = document.createElement('td');
        ttd.className = 'time';
        const [a, b] = time.split('-').map(t => convertTo12Hour(t.trim()));
        ttd.innerHTML = `${a}<br>${b}`;
        tr.appendChild(ttd);
        days.forEach(day => {
          const item = scheduleData[day][i];
          if (item.type === 'recess') {
            if (day === 'Lunes') {
              const td = document.createElement('td');
              td.colSpan = 5; td.className = 'rec'; td.textContent = 'Receso';
              tr.appendChild(td);
            }
            return;
          }
          const td = document.createElement('td');
          td.dataset.day = day; td.dataset.subject = item.subject; td.dataset.time = item.time;
          if (item.type === 'free') {
            td.className = 'off'; td.textContent = 'Libre';
          } else {
            td.className = 'cls ' + getSubjectClass(item.subject);
            td.innerHTML = `<b>${item.short}</b><span>${item.room || ''}</span>`;
            td.onclick = () => openClassSheet(item, day);
          }
          tr.appendChild(td);
        });
        body.appendChild(tr);
      });
    }

    function highlightGridCells() {
      const cur = getCurrentClassSlot();
      const today = getTodayName();
      document.querySelectorAll('#scheduleTableBody td').forEach(td => {
        td.classList.remove('now');
        if (cur && cur.type === 'class' && td.dataset.day === today && td.dataset.subject === cur.subject && td.dataset.time === cur.time) {
          td.classList.add('now');
        }
      });
    }

    function renderTimelineSelector() {
      const box = document.getElementById('daySelectPills');
      box.innerHTML = '';
      days.forEach(d => {
        const b = document.createElement('button');
        b.textContent = d;
        if (d === selectedDayForTimeline) b.className = 'active';
        b.onclick = () => {
          selectedDayForTimeline = d;
          document.querySelectorAll('#daySelectPills button').forEach(x => x.classList.remove('active'));
          b.classList.add('active');
          renderTimelineView();
        };
        box.appendChild(b);
        if (d === selectedDayForTimeline) requestAnimationFrame(() => b.scrollIntoView({ inline: 'center', block: 'nearest' }));
      });
    }

    function renderTimelineView() {
      const box = document.getElementById('timelineItemsContainer');
      if (!box) return;
      box.innerHTML = '';
      const slots = scheduleData[selectedDayForTimeline];
      const today = getTodayName();
      const cur = getCurrentClassSlot();
      slots.forEach(item => {
        const [start, end] = formatRange(item.time).split(' – ');
        const isNow = cur && today === selectedDayForTimeline && item.time === cur.time && item.subject === cur.subject && cur.type !== 'gap';
        const row = document.createElement('div');
        if (item.type === 'recess') {
          row.className = 'row quiet s-rec' + (isNow ? ' now' : '');
          row.innerHTML = `<div class="tcol"><b>${start}</b><span>${end}</span></div><div class="axis"></div><div class="note">Receso</div>`;
          box.appendChild(row); return;
        }
        if (item.type === 'free') {
          row.className = 'row quiet s-off' + (isNow ? ' now' : '');
          row.innerHTML = `<div class="tcol"><b>${start}</b><span>${end}</span></div><div class="axis"></div><div class="note">Libre</div>`;
          box.appendChild(row); return;
        }
        const prog = isNow ? getSlotProgress(item) : null;
        row.className = 'row ' + getSubjectClass(item.subject) + (isNow ? ' now' : '');
        row.onclick = () => openClassSheet(item, selectedDayForTimeline);
        const teacher = item.teacher && !item.teacher.startsWith('Tutor') ? ` · ${item.teacher.split(' ')[0]}` : '';
        row.innerHTML = `
          <div class="tcol"><b>${start}</b><span>${end}</span></div>
          <div class="axis"></div>
          <div class="card">
            <div class="card-head">
              <h4>${item.subject}</h4>
              ${isNow ? '<span class="now-tag">En curso</span>' : ''}
            </div>
            <p>${roomLabel(item.room, item.type)}${teacher}${isNow && prog ? ` · ${prog.remaining} min` : ''}</p>
            ${isNow && prog ? `<div class="mini-progress"><i style="width:${prog.pct}%"></i></div>` : ''}
          </div>`;
        box.appendChild(row);
      });
    }

    function renderTeachers() {
      const box = document.getElementById('teachersListContainer');
      const q = document.getElementById('teacherSearchInput').value.toLowerCase().trim();
      const list = teachers.filter(t => t.name.toLowerCase().includes(q) || t.subjects.some(s => s.toLowerCase().includes(q)));
      box.innerHTML = '';
      if (!list.length) {
        box.innerHTML = '<p class="note">Sin resultados</p>';
        return;
      }
      list.forEach(t => {
        const el = document.createElement('article');
        el.className = 'prof';
        el.innerHTML = `
          <div class="ava">${t.initials}</div>
          <div>
            <h4>${t.name}</h4>
            <p>${t.subjects.join(' · ')}</p>
          </div>
          <div class="hrs">${t.hours} h</div>`;
        el.onclick = () => openTeacherSheet(t);
        box.appendChild(el);
      });
    }
    function filterTeachers() { renderTeachers(); }

    const TASKS_KEY = 'horario-iiib-tareas';
    let tasks = [];
    let taskSubjectKey = Object.keys(T)[0];
    let editingTaskId = null;
    let taskFilter = 'all';

    function loadTasks() {
      try { tasks = JSON.parse(localStorage.getItem(TASKS_KEY) || '[]'); }
      catch (e) { tasks = []; }
      if (!Array.isArray(tasks)) tasks = [];
    }
    function persistTasks() {
      localStorage.setItem(TASKS_KEY, JSON.stringify(tasks));
    }
    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function taskDate(ts) {
      return new Date(ts).toLocaleDateString('es-MX', { day: 'numeric', month: 'short' });
    }
    function renderTaskSubjectPills() {
      const menu = document.getElementById('taskSubjectMenu');
      const label = document.getElementById('taskSubjectLabel');
      if (!menu || !label) return;
      const current = T[taskSubjectKey];
      label.textContent = current ? current.short : 'Materia';
      menu.innerHTML = '';
      Object.keys(T).forEach(key => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'sub-item ' + getSubjectClass(T[key].subject) + (key === taskSubjectKey ? ' on' : '');
        b.innerHTML = `<span class="sub-dot"></span>${esc(T[key].short)}`;
        b.onclick = () => {
          taskSubjectKey = key;
          closeSubjectMenu();
          renderTaskSubjectPills();
        };
        menu.appendChild(b);
      });
    }
    function setSubjectMenu(on) {
      const pick = document.getElementById('taskSubjectPick');
      if (pick) pick.classList.toggle('open', on);
    }
    function toggleSubjectMenu(ev) {
      if (ev) ev.stopPropagation();
      const pick = document.getElementById('taskSubjectPick');
      setSubjectMenu(!(pick && pick.classList.contains('open')));
    }
    function closeSubjectMenu() {
      setSubjectMenu(false);
    }
    document.addEventListener('click', e => {
      const pick = document.getElementById('taskSubjectPick');
      if (pick && pick.classList.contains('open') && !pick.contains(e.target)) closeSubjectMenu();
    });
    function renderTaskFilters() {
      const box = document.getElementById('taskFilters');
      if (!box) return;
      const keys = [...new Set(tasks.map(t => t.key))];
      box.innerHTML = '';
      const all = document.createElement('button');
      all.type = 'button';
      all.className = 'task-chip' + (taskFilter === 'all' ? ' on' : '');
      all.textContent = 'Todas';
      all.onclick = () => { taskFilter = 'all'; renderTaskFilters(); renderTaskGallery(); };
      box.appendChild(all);
      keys.forEach(key => {
        if (!T[key]) return;
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'task-chip ' + getSubjectClass(T[key].subject) + (taskFilter === key ? ' on' : '');
        b.textContent = T[key].short;
        b.onclick = () => { taskFilter = key; renderTaskFilters(); renderTaskGallery(); };
        box.appendChild(b);
      });
    }
    function renderTaskGallery() {
      const box = document.getElementById('taskGallery');
      const count = document.getElementById('taskCount');
      if (!box) return;
      const list = taskFilter === 'all' ? tasks : tasks.filter(t => t.key === taskFilter);
      count.textContent = String(tasks.length);
      box.innerHTML = '';
      if (!list.length) {
        box.innerHTML = '<p class="task-empty">Aún no hay tareas. Elige una materia, escríbela y guárdala aquí.</p>';
        return;
      }
      list.forEach(item => {
        const meta = T[item.key] || { short: 'Materia', subject: '' };
        const card = document.createElement('article');
        card.className = 'task-card ' + getSubjectClass(meta.subject);
        card.innerHTML = `
          <header>
            <h4>${esc(meta.short)}</h4>
            <time>${taskDate(item.updated || item.created)}</time>
          </header>
          <p></p>
          <footer>
            <button type="button" class="icon-btn" aria-label="Editar"><ion-icon name="create-outline"></ion-icon></button>
            <button type="button" class="icon-btn danger" aria-label="Borrar"><ion-icon name="trash-outline"></ion-icon></button>
          </footer>`;
        card.querySelector('p').textContent = item.text;
        const [editBtn, delBtn] = card.querySelectorAll('.icon-btn');
        editBtn.onclick = () => editTask(item.id);
        delBtn.onclick = () => deleteTask(item.id);
        box.appendChild(card);
      });
    }
    function saveTask() {
      const text = document.getElementById('taskTextInput').value.trim();
      if (!text || !taskSubjectKey) return;
      if (editingTaskId) {
        const t = tasks.find(x => x.id === editingTaskId);
        if (t) { t.text = text; t.key = taskSubjectKey; t.updated = Date.now(); }
      } else {
        tasks.unshift({
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          key: taskSubjectKey,
          text,
          created: Date.now(),
          updated: Date.now()
        });
      }
      persistTasks();
      cancelTaskEdit();
      renderTaskFilters();
      renderTaskGallery();
    }
    function editTask(id) {
      const t = tasks.find(x => x.id === id);
      if (!t) return;
      editingTaskId = id;
      taskSubjectKey = t.key;
      document.getElementById('taskTextInput').value = t.text;
      document.getElementById('taskComposeLabel').textContent = 'Editar tarea';
      document.getElementById('taskSaveBtn').textContent = 'Guardar cambios';
      document.getElementById('taskCancelBtn').hidden = false;
      renderTaskSubjectPills();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function deleteTask(id) {
      if (!confirm('¿Borrar esta tarea?')) return;
      tasks = tasks.filter(t => t.id !== id);
      if (editingTaskId === id) cancelTaskEdit();
      persistTasks();
      if (taskFilter !== 'all' && !tasks.some(t => t.key === taskFilter)) taskFilter = 'all';
      renderTaskFilters();
      renderTaskGallery();
    }
    function cancelTaskEdit() {
      editingTaskId = null;
      document.getElementById('taskTextInput').value = '';
      document.getElementById('taskComposeLabel').textContent = 'Nueva tarea';
      document.getElementById('taskSaveBtn').textContent = 'Guardar';
      document.getElementById('taskCancelBtn').hidden = true;
    }
    function initTasks() {
      loadTasks();
      renderTaskSubjectPills();
      renderTaskFilters();
      renderTaskGallery();
    }

    function kv(label, value) {
      return `<div class="kv"><small>${label}</small><b>${value}</b></div>`;
    }

    function openClassSheet(item, day) {
      document.getElementById('sheetTitle').textContent = item.subject;
      document.getElementById('sheetSubtitle').textContent = `Clase · ${day}`;
      let html = kv('Horario', formatRange(item.time));
      if (item.room) html += kv('Aula', item.room);
      if (item.code) html += kv('Clave', item.code);
      if (item.teacher) html += kv('Docente', item.teacher);
      document.getElementById('sheetContentList').innerHTML = html;
      showSheet();
    }

    function openTeacherSheet(t) {
      document.getElementById('sheetTitle').textContent = t.name;
      document.getElementById('sheetSubtitle').textContent = 'Docente COBAQROO';
      document.getElementById('sheetContentList').innerHTML =
        kv('Horas', `${t.hours} h / semana`) + kv('Asignaturas', t.subjects.join(' · '));
      showSheet();
    }

    function showSheet() {
      document.getElementById('modalOverlay').classList.add('on');
      const s = document.getElementById('bottomSheet');
      s.classList.add('on'); s.style.transform = '';
    }
    function closeSheet() {
      document.getElementById('modalOverlay').classList.remove('on');
      document.getElementById('bottomSheet').classList.remove('on');
    }

    const sheet = document.getElementById('bottomSheet');
    let startY = 0, curY = 0, drag = false;
    sheet.addEventListener('touchstart', e => { startY = e.touches[0].clientY; drag = true; sheet.style.transition = 'none'; }, { passive: true });
    sheet.addEventListener('touchmove', e => {
      if (!drag) return;
      curY = e.touches[0].clientY;
      const d = curY - startY;
      if (d > 0) sheet.style.transform = `translateY(${d}px)`;
    }, { passive: true });
    sheet.addEventListener('touchend', () => {
      if (!drag) return;
      drag = false;
      sheet.style.transition = '';
      if (curY - startY > 110) closeSheet(); else sheet.style.transform = '';
    });

    function tickClock() {
      const t = getCancunDate();
      let h = t.getHours();
      const m = String(t.getMinutes()).padStart(2, '0');
      const s = String(t.getSeconds()).padStart(2, '0');
      const ap = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      document.getElementById('clock').textContent = `${h}:${m}:${s} ${ap}`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderGridSchedule();
      const today = getTodayName();
      if (days.includes(today)) selectedDayForTimeline = today;
      renderTimelineSelector();
      updateAppStatus();
      renderTeachers();
      tickClock();
      setInterval(updateAppStatus, 1000);
      setInterval(tickClock, 1000);
      let ds = getCancunDate().toLocaleDateString('es-MX', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', timeZone });
      document.getElementById('date').textContent = ds.charAt(0).toUpperCase() + ds.slice(1);
      initTasks();
      requestAnimationFrame(() => layoutDockPill(document.querySelector('.nav.on')));
      window.addEventListener('resize', () => layoutDockPill(document.querySelector('.nav.on')));
    });
  </script>
  <script src="grok-data.js"></script>
  <script src="grok-bot-morph.js"></script>
</body>
</html>
