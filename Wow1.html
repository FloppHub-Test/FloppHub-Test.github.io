<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Bandicoot Run Mobile</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Press Start 2P', cursive;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        
        .game-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 900px;
            max-height: 600px;
            display: flex;
            flex-direction: column;
        }
        
        .game-container {
            position: relative;
            flex: 1;
            background: #0f3460;
            overflow: hidden;
            border: 2px solid #0f3460;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        
        /* Controles táctiles */
        .touch-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 120px;
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            z-index: 100;
            pointer-events: none;
        }
        
        .control-zone {
            pointer-events: auto;
            display: flex;
            gap: 15px;
        }
        
        .d-pad {
            display: flex;
            gap: 10px;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }
        
        .btn-touch {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(233, 69, 96, 0.6);
            border: 3px solid rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            cursor: pointer;
            transition: all 0.1s;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .btn-touch:active, .btn-touch.active {
            transform: scale(0.9);
            background: rgba(233, 69, 96, 0.9);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        
        .btn-jump {
            width: 80px;
            height: 80px;
            background: rgba(255, 215, 0, 0.6);
            border-color: rgba(255, 255, 200, 0.8);
        }
        
        .btn-jump:active, .btn-jump.active {
            background: rgba(255, 215, 0, 0.9);
        }
        
        .btn-spin {
            width: 60px;
            height: 60px;
            background: rgba(100, 200, 255, 0.6);
            border-color: rgba(200, 240, 255, 0.8);
        }
        
        .btn-spin:active, .btn-spin.active {
            background: rgba(100, 200, 255, 0.9);
        }
        
        /* UI */
        .ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            text-shadow: 2px 2px 0 #000;
            font-size: 12px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .score { color: #ffd700; }
        .lives { color: #e94560; }
        
        .wumpa-counter {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #ffa500;
            font-size: 14px;
            text-shadow: 2px 2px 0 #000;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .wumpa-icon {
            font-size: 20px;
        }
        
        /* Pantallas de inicio/game over */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 200;
            backdrop-filter: blur(5px);
        }
        
        .overlay-screen h1 {
            font-size: 24px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0 #000;
            animation: pulse 1s infinite;
            text-align: center;
            line-height: 1.4;
        }
        
        .title-start { color: #ffd700; }
        .title-gameover { color: #e94560; }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .btn-action {
            margin-top: 15px;
            padding: 15px 30px;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0 #9e2b3b;
            transition: all 0.2s;
        }
        
        .btn-action:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #9e2b3b;
        }
        
        .instructions {
            margin-top: 30px;
            font-size: 10px;
            text-align: center;
            line-height: 1.8;
            color: #aaa;
            max-width: 80%;
        }
        
        .hidden { display: none !important; }
        
        /* Orientación */
        .orientation-warning {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            z-index: 1000;
            padding: 20px;
            text-align: center;
        }
        
        .orientation-warning .icon {
            font-size: 60px;
            margin-bottom: 20px;
            animation: rotate 2s infinite;
        }
        
        @keyframes rotate {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }
        
        @media screen and (max-width: 600px) {
            .btn-touch {
                width: 60px;
                height: 60px;
                font-size: 20px;
            }
            .btn-jump {
                width: 70px;
                height: 70px;
            }
            .btn-spin {
                width: 50px;
                height: 50px;
            }
            .ui-overlay { font-size: 10px; }
            .wumpa-counter { font-size: 12px; }
        }
        
        @media screen and (max-height: 400px) {
            .touch-controls { height: 90px; }
            .btn-touch {
                width: 50px;
                height: 50px;
            }
            .btn-jump {
                width: 60px;
                height: 60px;
            }
        }
        
        /* Vibración visual al tocar */
        @keyframes touchFeedback {
            0% { transform: scale(1); }
            50% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }
        
        .touch-feedback {
            animation: touchFeedback 0.1s ease;
        }
        
        /* Tutorial flotante */
        .tutorial-hint {
            position: absolute;
            bottom: 140px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 10px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 90;
        }
        
        .tutorial-hint.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="orientation-warning" id="orientationWarning">
        <div class="icon">📱</div>
        <div>Por favor, gira tu teléfono<br>a modo horizontal</div>
    </div>
    
    <div class="game-wrapper" id="gameWrapper">
        <div class="game-container">
            <canvas id="gameCanvas"></canvas>
            
            <div class="ui-overlay">
                <div class="score">SCORE: <span id="scoreVal">0</span></div>
                <div class="lives">VIDAS: <span id="livesVal">3</span></div>
            </div>
            
            <div class="wumpa-counter">
                <span class="wumpa-icon">🥭</span>
                <span id="wumpaVal">0</span>
            </div>
            
            <div class="tutorial-hint" id="tutorialHint">
                ¡Toca los botones para jugar!
            </div>
            
            <!-- Controles táctiles -->
            <div class="touch-controls" id="touchControls" style="display: none;">
                <div class="control-zone d-pad">
                    <div class="btn-touch" id="btnLeft" data-key="ArrowLeft">←</div>
                    <div class="btn-touch" id="btnRight" data-key="ArrowRight">→</div>
                </div>
                <div class="control-zone action-buttons">
                    <div class="btn-touch btn-spin" id="btnSpin" data-key="Spin">↻</div>
                    <div class="btn-touch btn-jump" id="btnJump" data-key="Space">↑</div>
                </div>
            </div>
            
            <!-- Pantalla de inicio -->
            <div id="startScreen" class="overlay-screen">
                <h1 class="title-start">BANDICOOT<br>RUN</h1>
                <button class="btn-action" id="startBtn">TOCA PARA JUGAR</button>
                <div class="instructions">
                    ← → : Moverse | ↑ : Saltar<br>
                    Recoge wumpas, evita obstáculos<br>
                    ¡No caigas en los hoyos!
                </div>
            </div>
            
            <!-- Game Over -->
            <div id="gameOverScreen" class="overlay-screen hidden">
                <h1 class="title-gameover">GAME OVER</h1>
                <div style="font-size: 12px; margin: 10px 0;">
                    Score: <span id="finalScore">0</span><br>
                    Wumpas: <span id="finalWumpas">0</span>
                </div>
                <button class="btn-action" id="restartBtn">REINTENTAR</button>
            </div>
            
            <!-- Pausa -->
            <div id="pauseScreen" class="overlay-screen hidden">
                <h1 style="color: #4a7c59;">PAUSA</h1>
                <button class="btn-action" id="resumeBtn">CONTINUAR</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Ajustar canvas al tamaño de pantalla
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        // Detectar si es móvil
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        if (isMobile) {
            document.getElementById('touchControls').style.display = 'flex';
        }
        
        // Verificar orientación
        function checkOrientation() {
            const warning = document.getElementById('orientationWarning');
            const wrapper = document.getElementById('gameWrapper');
            
            if (window.innerHeight > window.innerWidth && window.innerWidth < 600) {
                warning.style.display = 'flex';
                wrapper.style.display = 'none';
            } else {
                warning.style.display = 'none';
                wrapper.style.display = 'flex';
                resizeCanvas();
            }
        }
        
        window.addEventListener('orientationchange', checkOrientation);
        checkOrientation();
        
        // Estado del juego
        let gameRunning = false;
        let gamePaused = false;
        let score = 0;
        let lives = 3;
        let wumpas = 0;
        let gameSpeed = 3;
        let frame = 0;
        
        // Jugador
        const player = {
            x: 0,
            y: 0,
            width: 40,
            height: 40,
            velocityY: 0,
            velocityX: 0,
            jumping: false,
            doubleJump: false,
            grounded: false,
            color: '#e94560',
            startX: 100
        };
        
        // Ajustar jugador según tamaño de pantalla
        function adjustPlayerSize() {
            const scale = Math.min(canvas.width / 800, canvas.height / 400);
            player.width = 40 * scale;
            player.height = 40 * scale;
            player.startX = canvas.width * 0.15;
            player.x = player.startX;
            player.y = canvas.height / 2;
        }
        
        // Controles
        const keys = {};
        let touchStartY = 0;
        
        // Eventos táctiles para botones
        const touchButtons = document.querySelectorAll('.btn-touch');
        
        touchButtons.forEach(btn => {
            const key = btn.dataset.key;
            
            const handleTouchStart = (e) => {
                e.preventDefault();
                btn.classList.add('active');
                
                if (key === 'Space') {
                    handleJump();
                } else if (key === 'Spin') {
                    handleSpin();
                } else {
                    keys[key] = true;
                }
                
                if (navigator.vibrate) navigator.vibrate(10);
            };
            
            const handleTouchEnd = (e) => {
                e.preventDefault();
                btn.classList.remove('active');
                if (key !== 'Space' && key !== 'Spin') {
                    keys[key] = false;
                }
            };
            
            btn.addEventListener('touchstart', handleTouchStart, {passive: false});
            btn.addEventListener('touchend', handleTouchEnd, {passive: false});
            btn.addEventListener('mousedown', handleTouchStart);
            btn.addEventListener('mouseup', handleTouchEnd);
            btn.addEventListener('mouseleave', handleTouchEnd);
        });
        
        // Controles de teclado (para PC)
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                handleJump();
            } else if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') {
                keys[e.code] = true;
            } else if (e.code === 'KeyZ' || e.code === 'KeyX') {
                handleSpin();
            } else if (e.code === 'Escape') {
                togglePause();
            }
        });
        
        document.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') {
                keys[e.code] = false;
            }
        });
        
        // Gestos táctiles en la pantalla (swipe)
        let touchStartX = 0;
        let touchStartTime = 0;
        
        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            touchStartTime = Date.now();
        }, {passive: true});
        
        canvas.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const touchDuration = Date.now() - touchStartTime;
            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;
            
            // Tap para saltar (si no hay swipe horizontal significativo)
            if (touchDuration < 200 && Math.abs(deltaX) < 30 && deltaY < -30) {
                handleJump();
            }
            // Swipe para moverse
            else if (Math.abs(deltaX) > 50) {
                const direction = deltaX > 0 ? 'ArrowRight' : 'ArrowLeft';
                keys[direction] = true;
                setTimeout(() => keys[direction] = false, 200);
            }
        }, {passive: true});
        
        function handleJump() {
            if (!gameRunning || gamePaused) return;
            
            if (!player.jumping) {
                player.velocityY = -canvas.height * 0.025;
                player.jumping = true;
                player.grounded = false;
                createParticles(player.x + player.width/2, player.y + player.height, '#fff', 5);
            } else if (!player.doubleJump) {
                player.velocityY = -canvas.height * 0.02;
                player.doubleJump = true;
                createParticles(player.x + player.width/2, player.y + player.height, '#ffd700', 3);
            }
        }
        
        function handleSpin() {
            if (!gameRunning || gamePaused) return;
            // Ataque giratorio que destruye enemigos cercanos
            createParticles(player.x + player.width/2, player.y + player.height/2, '#00ffff', 8);
            
            // Destruir enemigos cercanos
            obstacles.forEach(obs => {
                if (obs.type === 'enemy' && obs.active) {
                    const dist = Math.hypot((obs.x + obs.width/2) - (player.x + player.width/2), 
                                         (obs.y + obs.height/2) - (player.y + player.height/2));
                    if (dist < 100) {
                        obs.active = false;
                        score += 100;
                        createParticles(obs.x + obs.width/2, obs.y, '#e94560', 8);
                    }
                }
            });
        }
        
        function togglePause() {
            if (!gameRunning) return;
            gamePaused = !gamePaused;
            document.getElementById('pauseScreen').classList.toggle('hidden', !gamePaused);
            if (!gamePaused) gameLoop();
        }
        
        // Obstáculos y coleccionables
        let obstacles = [];
        let collectibles = [];
        let particles = [];
        let platforms = [];
        
        // Botones de UI
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('startBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            startGame();
        });
        
        document.getElementById('restartBtn').addEventListener('click', restartGame);
        document.getElementById('restartBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            restartGame();
        });
        
        document.getElementById('resumeBtn').addEventListener('click', togglePause);
        
        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('tutorialHint').classList.add('show');
            setTimeout(() => document.getElementById('tutorialHint').classList.remove('show'), 4000);
            
            gameRunning = true;
            gamePaused = false;
            resetGame();
            gameLoop();
        }
        
        function restartGame() {
            document.getElementById('gameOverScreen').classList.add('hidden');
            gameRunning = true;
            gamePaused = false;
            resetGame();
            gameLoop();
        }
        
        function resetGame() {
            score = 0;
            lives = 3;
            wumpas = 0;
            gameSpeed = canvas.width * 0.004;
            adjustPlayerSize();
            
            obstacles = [];
            collectibles = [];
            particles = [];
            platforms = [];
            
            // Plataformas iniciales
            const platformWidth = canvas.width * 0.25;
            for (let i = 0; i < 5; i++) {
                platforms.push({
                    x: i * platformWidth,
                    y: canvas.height * 0.8,
                    width: platformWidth,
                    height: canvas.height * 0.2
                });
            }
            
            updateUI();
        }
        
        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    life: 30,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }
        
        function spawnObstacle() {
            if (Math.random() < 0.015) {
                const type = Math.random();
                const groundY = canvas.height * 0.8;
                
                if (type < 0.33) {
                    obstacles.push({
                        x: canvas.width,
                        y: groundY - 40,
                        width: 40,
                        height: 40,
                        type: 'tnt',
                        active: true
                    });
                } else if (type < 0.66) {
                    obstacles.push({
                        x: canvas.width,
                        y: groundY - 30,
                        width: 30,
                        height: 30,
                        type: 'enemy',
                        active: true,
                        moveY: 0,
                        moveDir: 1
                    });
                } else {
                    // Hoyo - se crea eliminando parte de plataforma
                    const lastPlatform = platforms[platforms.length - 1];
                    if (lastPlatform && lastPlatform.width > 100) {
                        lastPlatform.width -= 60;
                    }
                }
            }
        }
        
        function spawnCollectible() {
            if (Math.random() < 0.025) {
                collectibles.push({
                    x: canvas.width,
                    y: canvas.height * 0.3 + Math.random() * (canvas.height * 0.4),
                    width: 25,
                    height: 25,
                    type: 'wumpa',
                    active: true,
                    floatY: 0,
                    floatDir: 1
                });
            }
        }
        
        function update() {
            if (!gameRunning || gamePaused) return;
            
            frame++;
            
            // Movimiento
            const speed = canvas.width * 0.008;
            if (keys['ArrowLeft']) player.velocityX = -speed;
            else if (keys['ArrowRight']) player.velocityX = speed;
            else player.velocityX *= 0.8;
            
            player.x += player.velocityX;
            player.y += player.velocityY;
            
            // Gravedad
            if (!player.grounded) {
                player.velocityY += canvas.height * 0.0015;
            }
            
            // Límites
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
            
            // Plataformas
            player.grounded = false;
            platforms.forEach(platform => {
                platform.x -= gameSpeed;
                
                if (player.x < platform.x + platform.width &&
                    player.x + player.width > platform.x &&
                    player.y + player.height > platform.y &&
                    player.y + player.height < platform.y + platform.height + 10 &&
                    player.velocityY >= 0) {
                    player.y = platform.y - player.height;
                    player.velocityY = 0;
                    player.grounded = true;
                    player.jumping = false;
                    player.doubleJump = false;
                }
            });
            
            // Regenerar plataformas
            platforms = platforms.filter(p => p.x + p.width > -100);
            if (platforms.length < 6) {
                const lastPlatform = platforms[platforms.length - 1];
                const minGap = 50;
                const maxGap = 150;
                const gap = minGap + Math.random() * (maxGap - minGap);
                
                platforms.push({
                    x: lastPlatform ? lastPlatform.x + lastPlatform.width + gap : canvas.width,
                    y: canvas.height * (0.7 + Math.random() * 0.15),
                    width: 100 + Math.random() * 150,
                    height: canvas.height
                });
            }
            
            // Obstáculos
            spawnObstacle();
            obstacles.forEach(obs => {
                obs.x -= gameSpeed;
                
                if (obs.type === 'enemy') {
                    obs.moveY += 0.1 * obs.moveDir;
                    if (Math.abs(obs.moveY) > 10) obs.moveDir *= -1;
                }
                
                if (obs.active && checkCollision(player, obs)) {
                    if (obs.type === 'tnt') {
                        createParticles(obs.x + obs.width/2, obs.y + obs.height/2, '#ff4444', 10);
                        loseLife();
                        obs.active = false;
                    } else if (obs.type === 'enemy') {
                        if (player.velocityY > 0 && player.y < obs.y) {
                            player.velocityY = -canvas.height * 0.015;
                            score += 100;
                            obs.active = false;
                            createParticles(obs.x + obs.width/2, obs.y, '#e94560', 8);
                        } else {
                            loseLife();
                        }
                    }
                }
            });
            
            obstacles = obstacles.filter(obs => obs.x + obs.width > -100 && obs.active);
            
            // Coleccionables
            spawnCollectible();
            collectibles.forEach(col => {
                col.x -= gameSpeed;
                col.floatY += 0.1 * col.floatDir;
                if (Math.abs(col.floatY) > 5) col.floatDir *= -1;
                
                if (col.active && checkCollision(player, {...col, y: col.y + col.floatY})) {
                    col.active = false;
                    wumpas++;
                    score += 50;
                    createParticles(col.x + col.width/2, col.y + col.height/2, '#ffa500', 5);
                    if (navigator.vibrate) navigator.vibrate(20);
                }
            });
            
            collectibles = collectibles.filter(col => col.x + col.width > 0 && col.active);
            
            // Partículas
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                p.vy += 0.2;
            });
            particles = particles.filter(p => p.life > 0);
            
            // Caída
            if (player.y > canvas.height) {
                loseLife();
                if (lives > 0) {
                    player.y = canvas.height * 0.3;
                    player.velocityY = 0;
                    // Buscar plataforma segura
                    const safePlatform = platforms.find(p => p.x > player.startX);
                    if (safePlatform) {
                        player.y = safePlatform.y - player.height;
                    }
                }
            }
            
            // Dificultad progresiva
            if (score > 0 && score % 500 === 0) {
                gameSpeed += 0.0005;
            }
            
            score++;
            updateUI();
        }
        
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }
        
        function loseLife() {
            lives--;
            createParticles(player.x + player.width/2, player.y + player.height/2, '#fff', 15);
            if (navigator.vibrate) navigator.vibrate([50, 100, 50]);
            
            if (lives <= 0) {
                gameOver();
            } else {
                player.x = player.startX;
                player.velocityX = 0;
            }
        }
        
        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalWumpas').textContent = wumpas;
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }
        
        function updateUI() {
            document.getElementById('scoreVal').textContent = score;
            document.getElementById('livesVal').textContent = lives;
            document.getElementById('wumpaVal').textContent = wumpas;
        }
        
        function draw() {
            // Fondo
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#87CEEB');
            gradient.addColorStop(0.5, '#E0F6FF');
            gradient.addColorStop(0.5, '#F4E4C1');
            gradient.addColorStop(1, '#D4A373');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Nubes decorativas (parallax lento)
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            const cloudOffset = (frame * 0.5) % (canvas.width + 200);
            for (let i = 0; i < 3; i++) {
                const x = (i * 300 - cloudOffset + canvas.width) % (canvas.width + 200) - 100;
                const y = 50 + i * 30;
                ctx.beginPath();
                ctx.arc(x, y, 30, 0, Math.PI * 2);
                ctx.arc(x + 25, y, 35, 0, Math.PI * 2);
                ctx.arc(x + 50, y, 30, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Plataformas
            platforms.forEach(platform => {
                // Hierba
                ctx.fillStyle = '#4a7c59';
                ctx.fillRect(platform.x, platform.y, platform.width, 15);
                
                // Tierra
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(platform.x, platform.y + 15, platform.width, platform.height - 15);
                
                // Detalles
                ctx.fillStyle = '#654321';
                for (let i = 0; i < platform.width; i += 20) {
                    if (i % 40 === 0) {
                        ctx.fillRect(platform.x + i, platform.y + 25, 4, 4);
                    }
                }
            });
            
            // Obstáculos
            obstacles.forEach(obs => {
                if (obs.type === 'tnt') {
                    ctx.fillStyle = '#8B0000';
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                    ctx.strokeStyle = '#ff0000';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
                    
                    ctx.fillStyle = '#ffff00';
                    ctx.font = `bold ${obs.width * 0.4}px Arial`;
                    ctx.fillText('TNT', obs.x + 5, obs.y + obs.height * 0.6);
                    
                    ctx.fillStyle = 'rgba(255,0,0,0.3)';
                    ctx.fillRect(obs.x, obs.y, obs.width, 5);
                } else if (obs.type === 'enemy') {
                    const y = obs.y + obs.moveY;
                    ctx.fillStyle = '#4a4a4a';
                    
                    // Puas
                    for (let i = 0; i < 8; i++) {
                        const angle = (i / 8) * Math.PI * 2;
                        const px = obs.x + obs.width/2 + Math.cos(angle) * (obs.width/2);
                        const py = y + obs.height/2 + Math.sin(angle) * (obs.height/2);
                        ctx.beginPath();
                        ctx.moveTo(obs.x + obs.width/2, y + obs.height/2);
                        ctx.lineTo(px, py);
                        ctx.lineWidth = 3;
                        ctx.stroke();
                    }
                    
                    ctx.fillStyle = '#2c2c2c';
                    ctx.beginPath();
                    ctx.arc(obs.x + obs.width/2, y + obs.height/2, obs.width/2.5, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Ojos
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(obs.x + obs.width/2 - 4, y + obs.height/2 - 2, 3, 0, Math.PI * 2);
                    ctx.arc(obs.x + obs.width/2 + 4, y + obs.height/2 - 2, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            
            // Coleccionables
            collectibles.forEach(col => {
                const y = col.y + col.floatY;
                
                // Sombra
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.beginPath();
                ctx.ellipse(col.x + col.width/2, y + col.height + 5, 8, 3, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Fruta
                ctx.fillStyle = '#ffa500';
                ctx.beginPath();
                ctx.ellipse(col.x + col.width/2, y + col.height/2, 12, 10, Math.PI/4, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#ffcc00';
                ctx.beginPath();
                ctx.ellipse(col.x + col.width/2 - 3, y + col.height/2 - 3, 4, 3, Math.PI/4, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#228B22';
                ctx.beginPath();
                ctx.ellipse(col.x + col.width/2, y + 2, 4, 2, 0, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // Jugador
            if (gameRunning) {
                const scale = player.width / 40;
                
                // Sombra
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(player.x + player.width/2, player.y + player.height, 15 * scale, 5 * scale, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Cuerpo
                ctx.fillStyle = player.color;
                ctx.beginPath();
                ctx.roundRect(player.x + 5 * scale, player.y + 10 * scale, 30 * scale, 25 * scale, 10 * scale);
                ctx.fill();
                
                // Pantalones
                ctx.fillStyle = '#1e3a8a';
                ctx.fillRect(player.x + 5 * scale, player.y + 25 * scale, 30 * scale, 15 * scale);
                
                // Cabeza
                ctx.fillStyle = player.color;
                ctx.beginPath();
                ctx.arc(player.x + player.width/2, player.y + 15 * scale, 12 * scale, 0, Math.PI * 2);
                ctx.fill();
                
                // Orejas
                ctx.fillStyle = '#c0392b';
                ctx.beginPath();
                ctx.ellipse(player.x + 8 * scale, player.y + 8 * scale, 4 * scale, 8 * scale, -0.5, 0, Math.PI * 2);
                ctx.ellipse(player.x + 32 * scale, player.y + 8 * scale, 4 * scale, 8 * scale, 0.5, 0, Math.PI * 2);
                ctx.fill();
                
                // Ojos
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.ellipse(player.x + 16 * scale, player.y + 12 * scale, 4 * scale, 5 * scale, 0, 0, Math.PI * 2);
                ctx.ellipse(player.x + 24 * scale, player.y + 12 * scale, 4 * scale, 5 * scale, 0, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(player.x + 16 * scale, player.y + 13 * scale, 2 * scale, 0, Math.PI * 2);
                ctx.arc(player.x + 24 * scale, player.y + 13 * scale, 2 * scale, 0, Math.PI * 2);
                ctx.fill();
                
                // Nariz
                ctx.fillStyle = '#2c2c2c';
                ctx.beginPath();
                ctx.ellipse(player.x + 20 * scale, player.y + 18 * scale, 3 * scale, 2 * scale, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Brazos
                ctx.fillStyle = player.color;
                if (player.jumping) {
                    ctx.fillRect(player.x, player.y + 15 * scale, 5 * scale, 15 * scale);
                    ctx.fillRect(player.x + 35 * scale, player.y + 15 * scale, 5 * scale, 15 * scale);
                } else {
                    ctx.fillRect(player.x, player.y + 20 * scale, 5 * scale, 12 * scale);
                    ctx.fillRect(player.x + 35 * scale, player.y + 20 * scale, 5 * scale, 12 * scale);
                }
                
                // Guantes
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(player.x + 2 * scale, player.y + 30 * scale, 4 * scale, 0, Math.PI * 2);
                ctx.arc(player.x + 38 * scale, player.y + 30 * scale, 4 * scale, 0, Math.PI * 2);
                ctx.fill();
                
                // Zapatos
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(player.x + 5 * scale, player.y + 35 * scale, 12 * scale, 5 * scale);
                ctx.fillRect(player.x + 23 * scale, player.y + 35 * scale, 12 * scale, 5 * scale);
            }
            
            // Partículas
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 30;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });
        }
        
        function gameLoop() {
            if (!gameRunning || gamePaused) return;
            
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // Prevenir scroll en móvil
        document.addEventListener('touchmove', (e) => {
            if (e.target.closest('.game-container')) {
                e.preventDefault();
            }
        }, { passive: false });
        
        // Pausar al cambiar de pestaña
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && gameRunning && !gamePaused) {
                togglePause();
            }
        });
        
        // Dibujo inicial
        resizeCanvas();
        adjustPlayerSize();
        draw();
        
        // Mostrar controles después de iniciar
        if (!isMobile) {
            document.getElementById('touchControls').style.display = 'none';
        }
    </script>
</body>
</html>
