<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blox Fruits Stock - THE NOTORIUS B.H.R</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bf-orange': '#FF8C00',
                        'bf-dark': '#050505',
                        'bf-card': '#141414',
                        'rarity-common': '#a0a0a0',
                        'rarity-uncommon': '#4CAF50',
                        'rarity-rare': '#2196F3',
                        'rarity-legendary': '#9C27B0',
                        'rarity-mythical': '#FF3D00'
                    },
                    fontFamily: {
                        'display': ['Orbitron', 'sans-serif'],
                        'body': ['Roboto', 'sans-serif'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #050505;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 140, 0, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255, 61, 0, 0.05) 0%, transparent 20%);
            color: white;
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #FF8C00; border-radius: 4px; }

        .fruit-card {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .fruit-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }

        /* Bordes brillantes según rareza */
        .border-mythical { border-color: #FF3D00; box-shadow: 0 0 15px rgba(255, 61, 0, 0.15); }
        .border-legendary { border-color: #9C27B0; }
        .border-rare { border-color: #2196F3; }
        .border-uncommon { border-color: #4CAF50; }
        .border-common { border-color: #a0a0a0; }

        .section-title {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            margin-top: 2rem;
        }
        .section-line {
            flex-grow: 1;
            height: 1px;
            background: linear-gradient(to right, currentColor, transparent);
        }

        .loader {
            border: 3px solid rgba(255, 140, 0, 0.1);
            border-top: 3px solid #FF8C00;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="font-body min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="w-full p-4 border-b border-bf-orange/20 bg-bf-dark/95 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="relative">
                    <i class="fa-solid fa-skull text-bf-orange text-3xl animate-pulse-slow relative z-10"></i>
                    <div class="absolute inset-0 bg-bf-orange blur-lg opacity-30 animate-pulse"></div>
                </div>
                <div>
                    <h1 class="font-display text-2xl font-bold text-white tracking-wider">
                        BLOX <span class="text-bf-orange">STOCK</span>
                    </h1>
                    <div class="flex items-center gap-2 text-[10px] text-gray-400 tracking-[0.3em] uppercase">
                        <span>By The Notorius B.H.R</span>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center gap-4 bg-white/5 px-5 py-2 rounded-full border border-white/10">
                <div class="flex flex-col items-end leading-tight">
                    <span class="text-[10px] text-gray-400 uppercase">Siguiente Actualización</span>
                    <span id="timer" class="font-mono text-bf-orange font-bold">--:--</span>
                </div>
                <button onclick="fetchStock()" class="w-8 h-8 flex items-center justify-center rounded-full bg-bf-orange/10 text-bf-orange hover:bg-bf-orange hover:text-white transition-all">
                    <i class="fa-solid fa-rotate"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN -->
    <main class="flex-grow container mx-auto p-4 md:p-8">
        
        <!-- Mensaje Error -->
        <div id="error-box" class="hidden bg-red-500/10 border border-red-500/50 text-red-400 p-4 rounded-lg mb-8 text-center backdrop-blur-sm">
            <i class="fa-solid fa-wifi mr-2"></i>
            <span id="error-msg">Error conectando al servidor.</span>
        </div>

        <!-- Loader Inicial -->
        <div id="initial-loader" class="flex flex-col items-center justify-center py-32">
            <div class="loader mb-4"></div>
            <p class="text-bf-orange text-sm tracking-widest animate-pulse">OBTENIENDO DATOS DEL MERCADO...</p>
        </div>

        <!-- Contenedores por Categoría -->
        <div id="content-area" class="hidden space-y-8">
            <!-- Se llenarán dinámicamente -->
            <div id="mythical-section"></div>
            <div id="legendary-section"></div>
            <div id="rare-section"></div>
            <div id="uncommon-section"></div>
            <div id="common-section"></div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="border-t border-white/5 bg-black/50 mt-12 py-8">
        <div class="container mx-auto text-center">
            <h2 class="font-display text-xl text-white mb-2">
                ⛧⃝𓄃 THE NOTORIUS B.H.R ♡♱
            </h2>
            <p class="text-gray-500 text-xs">Blox Fruits Realtime Stock Tracker API</p>
        </div>
    </footer>

    <script>
        // === CONFIGURACIÓN ===
        const ORIGINAL_API_URL = 'http://104.234.236.61:30200/api/stock?name=bf&mode=free';
        const PROXY_URL = `https://api.allorigins.win/get?url=${encodeURIComponent(ORIGINAL_API_URL)}`;
        const REFRESH_RATE = 30; // Segundos
        let countdown = REFRESH_RATE;

        // === BASE DE DATOS DE METADATOS (Colores, Emojis, Rareza) ===
        const fruitDb = {
            // MYTHICAL
            'Kitsune': { emoji: '🦊', rarity: 'mythical' },
            'Leopard': { emoji: '🐆', rarity: 'mythical' },
            'Dragon': { emoji: '🐉', rarity: 'mythical' },
            'Spirit': { emoji: '👻', rarity: 'mythical' },
            'Control': { emoji: '🎮', rarity: 'mythical' },
            'Venom': { emoji: '☠️', rarity: 'mythical' },
            'Shadow': { emoji: '👥', rarity: 'mythical' },
            'Dough': { emoji: '🍩', rarity: 'mythical' },
            'T-Rex': { emoji: '🦖', rarity: 'mythical' },
            'Mammoth': { emoji: '🦣', rarity: 'mythical' },
            'Gravity': { emoji: '🌌', rarity: 'mythical' },
            
            // LEGENDARY
            'Blizzard': { emoji: '❄️', rarity: 'legendary' },
            'Pain': { emoji: '🐾', rarity: 'legendary' },
            'Rumble': { emoji: '⚡', rarity: 'legendary' },
            'Portal': { emoji: '🚪', rarity: 'legendary' },
            'Phoenix': { emoji: '🐦', rarity: 'legendary' },
            'Sound': { emoji: '🎵', rarity: 'legendary' },
            'Spider': { emoji: '🕷️', rarity: 'legendary' },
            'Love': { emoji: '💗', rarity: 'legendary' },
            'Buddha': { emoji: '🧘', rarity: 'legendary' },
            'Quake': { emoji: '🌏', rarity: 'legendary' },

            // RARE
            'Magma': { emoji: '🌋', rarity: 'rare' },
            'Barrier': { emoji: '🚧', rarity: 'rare' },
            'Rubber': { emoji: '👒', rarity: 'rare' },
            'Light': { emoji: '💡', rarity: 'rare' },
            'Diamond': { emoji: '💎', rarity: 'rare' },
            'Revive': { emoji: '💀', rarity: 'rare' },
            'Ghost': { emoji: '👻', rarity: 'rare' },

            // UNCOMMON
            'Dark': { emoji: '⚫', rarity: 'uncommon' },
            'Sand': { emoji: '🏜️', rarity: 'uncommon' },
            'Ice': { emoji: '🧊', rarity: 'uncommon' },
            'Falcon': { emoji: '🦅', rarity: 'uncommon' },
            'Flame': { emoji: '🔥', rarity: 'uncommon' },

            // COMMON
            'Spike': { emoji: '🌵', rarity: 'common' },
            'Smoke': { emoji: '☁️', rarity: 'common' },
            'Bomb': { emoji: '💣', rarity: 'common' },
            'Spring': { emoji: '🌀', rarity: 'common' },
            'Chop': { emoji: '🔪', rarity: 'common' },
            'Spin': { emoji: '🌪️', rarity: 'common' },
            'Rocket': { emoji: '🚀', rarity: 'common' }
        };

        const rarityConfig = {
            'mythical': { color: 'text-rarity-mythical', border: 'border-mythical', label: 'MYTHICAL' },
            'legendary': { color: 'text-rarity-legendary', border: 'border-legendary', label: 'LEGENDARY' },
            'rare': { color: 'text-rarity-rare', border: 'border-rare', label: 'RARE' },
            'uncommon': { color: 'text-rarity-uncommon', border: 'border-uncommon', label: 'UNCOMMON' },
            'common': { color: 'text-rarity-common', border: 'border-common', label: 'COMMON' }
        };

        const formatMoney = (amount) => {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(amount);
        };

        // === LOGICA PRINCIPAL ===
        async function fetchStock() {
            const loader = document.getElementById('initial-loader');
            const contentArea = document.getElementById('content-area');
            const errorBox = document.getElementById('error-box');
            
            try {
                const response = await fetch(PROXY_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const proxyData = await response.json();
                const realData = JSON.parse(proxyData.contents);

                loader.classList.add('hidden');
                contentArea.classList.remove('hidden');
                errorBox.classList.add('hidden');

                processAndRender(realData);
                countdown = REFRESH_RATE;

            } catch (error) {
                console.error(error);
                loader.classList.add('hidden');
                errorBox.classList.remove('hidden');
                errorBox.querySelector('span').innerText = "Error conectando a la API. Reintentando...";
            }
        }

        function processAndRender(data) {
            // Normalizar datos: Asegurarnos que sea un array
            let stockList = [];
            if (Array.isArray(data)) stockList = data;
            else if (data.stock) stockList = data.stock;
            else if (data.data) stockList = data.data;
            else stockList = Object.values(data).flat();

            // Limpiar secciones
            ['mythical', 'legendary', 'rare', 'uncommon', 'common'].forEach(r => {
                document.getElementById(`${r}-section`).innerHTML = '';
            });

            if (stockList.length === 0) {
                document.getElementById('common-section').innerHTML = '<div class="text-center text-gray-500">No hay stock disponible.</div>';
                return;
            }

            // Agrupar por rareza
            const grouped = { mythical: [], legendary: [], rare: [], uncommon: [], common: [] };

            stockList.forEach(item => {
                const name = item.Name || item.name || "Unknown";
                // Si la API tiene campo "InStock" y es false, lo saltamos. Si no tiene el campo, asumimos true.
                if (item.hasOwnProperty('InStock') && item.InStock === false) return;

                // Buscar metadatos, si no existe, asignar Common por defecto
                const meta = fruitDb[name] || { emoji: '❓', rarity: 'common' };
                
                // Guardar el objeto completo + metadatos
                grouped[meta.rarity].push({ ...item, meta });
            });

            // Renderizar cada grupo
            Object.keys(grouped).forEach(rarity => {
                const items = grouped[rarity];
                const container = document.getElementById(`${rarity}-section`);
                
                if (items.length > 0) {
                    const config = rarityConfig[rarity];
                    
                    // Crear Titulo de Sección
                    const header = document.createElement('div');
                    header.className = `section-title ${config.color}`;
                    header.innerHTML = `
                        <h3 class="font-display font-bold text-xl tracking-widest">${config.label}</h3>
                        <div class="section-line bg-current opacity-30"></div>
                        <span class="text-xs font-mono bg-white/5 px-2 py-1 rounded">${items.length}</span>
                    `;
                    container.appendChild(header);

                    // Crear Grid para las cartas
                    const grid = document.createElement('div');
                    grid.className = "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4";

                    items.forEach(fruit => {
                        const price = fruit.Price || fruit.price || fruit.Value || 0;
                        const name = fruit.Name || fruit.name;
                        
                        const card = document.createElement('div');
                        card.className = `fruit-card p-4 rounded-lg relative overflow-hidden group ${config.border} border-l-4`;
                        
                        card.innerHTML = `
                            <div class="flex justify-between items-start z-10 relative">
                                <div>
                                    <h4 class="font-bold text-white text-lg leading-none mb-1">${name}</h4>
                                    <p class="font-mono text-green-400 text-sm">${formatMoney(price)}</p>
                                </div>
                                <div class="text-3xl animate-float filter drop-shadow-lg grayscale group-hover:grayscale-0 transition duration-500">
                                    ${fruit.meta.emoji}
                                </div>
                            </div>
                            <div class="mt-4">
                                <button class="w-full py-2 bg-white/5 hover:bg-bf-orange hover:text-black text-xs font-bold tracking-wider uppercase transition-colors rounded">
                                    COMPRAR
                                </button>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                    
                    container.appendChild(grid);
                }
            });
        }

        // Temporizador
        setInterval(() => {
            const timerEl = document.getElementById('timer');
            countdown--;
            if (countdown <= 0) {
                fetchStock();
                timerEl.textContent = "ACTUALIZANDO...";
            } else {
                timerEl.textContent = `00:${countdown.toString().padStart(2, '0')}`;
            }
        }, 1000);

        // Iniciar
        document.addEventListener('DOMContentLoaded', fetchStock);
    </script>
</body>
</html>
