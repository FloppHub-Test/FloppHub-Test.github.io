<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horario Grupo 1C - Bachilleres</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0D47A1;
            --secondary: #1976D2;
            --accent: #29B6F6;
            --accent-light: #81D4FA;
            --text: #0D47A1;
            --text-light: #546E7A;
            --bg: linear-gradient(135deg, #E3F2FD 0%, #BBDEFB 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: var(--text);
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 15px;
        }

        header {
            text-align: center;
            padding: 20px 0;
            animation: fadeInDown 0.6s ease;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
        }

        .school-logo {
            font-size: 3rem;
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .school-name {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .datetime {
            font-size: 1rem;
            background: rgba(255,255,255,0.2);
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
            backdrop-filter: blur(10px);
        }

        .current-class-container, .next-class-container {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
            animation: fadeIn 0.8s ease;
            border: 3px solid transparent;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }

        .current-class-container.active {
            border-color: var(--accent);
            transform: scale(1.02);
        }

        .current-class-container.recess {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-color: #f5576c;
        }

        .current-class-container.free {
            background: linear-gradient(135deg, var(--accent-light) 0%, #E1F5FE 100%);
            color: var(--text);
        }

        .class-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .class-icon {
            font-size: 2rem;
        }

        .current-subject, .next-subject {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .current-details, .next-details {
            font-size: 1rem;
            color: var(--text-light);
            margin-bottom: 10px;
        }

        .teacher-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent);
            opacity: 0;
            transform: translateY(10px);
            transition: var(--transition);
            margin-top: 10px;
        }

        .teacher-name.show {
            opacity: 1;
            transform: translateY(0);
        }

        .day-selector {
            display: none;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .day-btn {
            padding: 10px 15px;
            border: none;
            background: var(--card-bg);
            color: var(--text);
            border-radius: 25px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow);
            font-weight: 600;
        }

        .day-btn.active {
            background: var(--accent);
            color: white;
            transform: scale(1.05);
        }

        .schedule-table {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: var(--shadow);
            animation: fadeInUp 0.6s ease;
        }

        .desktop-view {
            display: block;
        }

        .mobile-view {
            display: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--primary);
            color: white;
            padding: 15px 10px;
            font-size: 1rem;
            position: sticky;
            top: 0;
            z-index: 10;
            text-transform: uppercase;
        }

        td {
            padding: 12px 10px;
            text-align: center;
            border: 1px solid rgba(0,0,0,0.05);
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            font-weight: 500;
        }

        td:hover {
            background: rgba(41, 182, 246, 0.1);
            transform: translateY(-2px);
        }

        td.active {
            background: var(--accent);
            color: white;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .subject-cell {
            border-radius: 8px;
        }

        .recess-cell {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%) !important;
            color: white;
        }

        .free-cell {
            background: #ECEFF1;
            color: #90A4AE;
            font-style: italic;
        }

        .mobile-card {
            background: var(--card-bg);
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 15px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .mobile-card.active {
            border-left: 5px solid var(--accent);
            background: linear-gradient(to right, rgba(41, 182, 246, 0.1), var(--card-bg));
        }

        .mobile-card.recess {
            border-left: 5px solid #f5576c;
            background: linear-gradient(to right, rgba(245, 87, 108, 0.1), var(--card-bg));
        }

        .mobile-time {
            font-weight: bold;
            color: var(--primary);
            font-size: 1.1rem;
        }

        .mobile-subject {
            font-size: 1.2rem;
            margin: 8px 0;
            color: var(--text);
        }

        .mobile-teacher {
            font-size: 0.9rem;
            color: var(--accent);
            display: none;
        }

        .mobile-teacher.show {
            display: block;
        }

        .teacher-info-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .teacher-info-modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            position: relative;
            animation: slideUp 0.4s ease;
            box-shadow: var(--shadow);
            border: 2px solid var(--accent);
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.8rem;
            cursor: pointer;
            color: var(--text-light);
            transition: var(--transition);
        }

        .close-btn:hover {
            color: var(--accent);
            transform: scale(1.2);
        }

        .modal-content h3 {
            margin-bottom: 15px;
            color: var(--primary);
        }

        .modal-content p {
            margin: 10px 0;
            color: var(--text);
        }

        .modal-content .profesor {
            font-weight: bold;
            color: var(--accent);
            font-size: 1.2rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            header {
                padding: 15px 0;
            }

            h1 {
                font-size: 1.5rem;
            }

            .school-name {
                font-size: 0.8rem;
            }

            .datetime {
                font-size: 0.9rem;
                padding: 6px 12px;
            }

            .current-class-container, .next-class-container {
                padding: 20px;
            }

            .current-subject, .next-subject {
                font-size: 1.4rem;
            }

            .day-selector {
                display: flex;
            }

            .desktop-view {
                display: none !important;
            }

            .mobile-view {
                display: block !important;
            }

            th {
                padding: 10px 5px;
                font-size: 0.8rem;
            }

            td {
                padding: 8px 5px;
                font-size: 0.85rem;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.3rem;
            }

            .current-subject, .next-subject {
                font-size: 1.2rem;
            }

            .day-btn {
                padding: 8px 12px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="school-logo">🏫</div>
            <h1>Horario Grupo 1C</h1>
            <p class="school-name">Colegio de Bachilleres del Estado de Quintana Roo</p>
            <div class="datetime" id="datetime"></div>
        </header>

        <div class="current-class-container" id="currentClassContainer">
            <div class="class-icon" id="currentIcon">📖</div>
            <div class="current-subject" id="currentSubject">--</div>
            <div class="current-details" id="currentDetails">--</div>
            <div class="teacher-name" id="teacherName"></div>

        <div class="next-class-container" id="nextClassContainer">

            <button class="day-btn" data-day="Jueves">Jueves</button>
            <button class="day-btn" data-day="Viernes">Viernes</button>

            <table id="scheduleTable">

                        <th>Miércoles</th>

                        <th>Viernes</th>
                    </tr>
                </thead>
                <tbody id="scheduleBody">
                </tbody>
            </table>
        </div>

        <div class="mobile-view" id="mobileSchedule">
            <!-- Vista mobile generada dinámicamente -->
        </div>
    </div>

    <div class="teacher-info-modal" id="teacherModal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <h3 id="modalSubject"></h3>
            <p class="profesor" id="modalTeacher"></p>
            <p id="modalTime"></p>
            <p id="modalDay"></p>
        </div>
    </div>

    <script>
        // Datos del horario del grupo 1C (corregidos y completos)
        const scheduleData = {

                { time: '09:45-10:15', code: 'RECESO', name: 'RECESO', teacher: null },
                { time: '10:15-11:00', code: 'PEMA A10', name: 'PENSAMIENTO MATEMÁTICO I', teacher: 'NANCY SÁNCHEZ PUC' },
                { time: '11:05-11:50', code: 'LEYCO A3', name: 'LENGUA Y COMUNICACIÓN I', teacher: 'GRACIELA ROSALIA MAY POLANCO' },
                { time: '12:00-12:50', code: 'HUMA A15', name: 'HUMANIDADES I', teacher: 'BRENDA YAZMIN CORONA SÁNCHEZ' },
                { time: '13:00-13:50', code: null, name: 'LIBRE', teacher: null }
            ],
            'Miércoles': [
                { time: '07:00-07:50', code: null, name: 'LIBRE', teacher: null },
                { time: '08:00-08:50', code: 'LADEIN A6', name: 'LABORATORIO DE INVESTIGACIÓN', teacher: 'JESÚS ISRAEL PUC MAGAÑA' },
                { time: '09:00-09:45', code: 'LADEIN A6', name: 'LABORATORIO DE INVESTIGACIÓN', teacher: 'JESÚS ISRAEL PUC MAGAÑA' },
                { time: '09:45-10:15', code: 'RECESO', name: 'RECESO', teacher: null },
                { time: '10:15-11:00', code: 'LA MATERIA Y SUS INTERACCIONES A8', name: 'LA MATERIA Y SUS INTERACCIONES', teacher: 'TERESA BEATRIZ UN CEN' },
                { time: '11:05-11:50', code: 'LEYCO A3', name: 'LENGUA Y COMUNICACIÓN I', teacher: 'GRACIELA ROSALIA MAY POLANCO' },
                { time: '12:00-12:50', code: 'LEYCO A3', name: 'LENGUA Y COMUNICACIÓN I', teacher: 'GRACIELA ROSALIA MAY POLANCO' },
                { time: '13:00-13:50', code: 'EDIESYG A5', name: 'EDUCACIÓN INTEGRAL EN SEXUALIDAD Y GÉNERO I', teacher: 'ZAFIRO FLOR SILVESTRE DEL ÁNGEL PONCE' }
            ],
            'Jueves': [
                { time: '07:00-07:50', code: 'TUTOR', name: 'TUTORÍA', teacher: 'TUTOR RESPONSABLE DE GRUPO A6' },
                { time: '08:00-08:50', code: 'HUMA A15', name: 'HUMANIDADES I', teacher: 'BRENDA YAZMIN CORONA SÁNCHEZ' },
                { time: '09:00-09:45', code: 'HUMA A15', name: 'HUMANIDADES I', teacher: 'BRENDA YAZMIN CORONA SÁNCHEZ' },
                { time: '09:45-10:15', code: 'RECESO', name: 'RECESO', teacher: null },
                { time: '10:15-11:00', code: 'INGLÉS A3', name: 'INGLÉS I', teacher: 'GRACIELA ROSALIA MAY POLANCO' },
                { time: '11:05-11:50', code: 'CUDI LAB INFO', name: 'CULTURA DIGITAL I', teacher: 'VACANTE 3' },
                { time: '12:00-12:50', code: 'CUDI LAB INFO', name: 'CULTURA DIGITAL I', teacher: 'VACANTE 3' },
                { time: '13:00-13:50', code: 'AFDC A11', name: 'ACTIVIDADES FÍSICAS DEPORTIVAS Y CULTURALES I', teacher: 'LUIS HUMBERTO CONCHA CABALLERO' }
            ],
            'Viernes': [
                { time: '07:00-07:50', code: null, name: 'LIBRE', teacher: null },
                { time: '08:00-08:50', code: 'PEMA A10', name: 'PENSAMIENTO MATEMÁTICO I', teacher: 'NANCY SÁNCHEZ PUC' },
                { time: '09:00-09:45', code: 'PEMA A10', name: 'PENSAMIENTO MATEMÁTICO I', teacher: 'NANCY SÁNCHEZ PUC' },
                { time: '09:45-10:15', code: 'RECESO', name: 'RECESO', teacher: null },
                { time: '10:15-11:00', code: 'LA MATERIA Y SUS INTERACCIONES A8/LM2', name: 'LA MATERIA Y SUS INTERACCIONES', teacher: 'TERESA BEATRIZ UN CEN' },
                { time: '11:05-11:50', code: 'LA MATERIA Y SUS INTERACCIONES A8/LM2', name: 'LA MATERIA Y SUS INTERACCIONES', teacher: 'TERESA BEATRIZ UN CEN' },
                { time: '12:00-12:50', code: 'EDIESYG A5', name: 'EDUCACIÓN INTEGRAL EN SEXUALIDAD Y GÉNERO I', teacher: 'ZAFIRO FLOR SILVESTRE DEL ÁNGEL PONCE' },
                { time: '13:00-13:50', code: 'LADEIN A6', name: 'LABORATORIO DE INVESTIGACIÓN', teacher: 'JESÚS ISRAEL PUC MAGAÑA' }
            ]
        };

        const days = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes'];
        let currentDayIndex = 0;

        // Funciones de utilidad
        function getCurrentDateTime() {
            const options = {
                timeZone: 'America/Cancun',
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            };
            return new Date().toLocaleString('es-MX', options);
        }

        function getCurrentDay() {
            const options = { timeZone: 'America/Cancun', weekday: 'long' };
            const dayName = new Date().toLocaleDateString('es-MX', options);
            return dayName.charAt(0).toUpperCase() + dayName.slice(1);
        }

        function getCurrentTime() {
            const options = { timeZone: 'America/Cancun', hour12: false, hour: '2-digit', minute: '2-digit' };
            return new Date().toLocaleTimeString('es-MX', options);
        }

        function isSchoolTime() {
            const now = new Date(new Date().toLocaleString("en-US", {timeZone: "America/Cancun"}));
            const hour = now.getHours();
            const minute = now.getMinutes();
            const currentMinutes = hour * 60 + minute;
            const startMinutes = 7 * 60;
            const endMinutes = 13 * 60 + 50;
            return currentMinutes >= startMinutes && currentMinutes <= endMinutes;
        }

        function parseTimeToMinutes(timeStr) {
            const [hours, minutes] = timeStr.split(':').map(Number);
            return hours * 60 + minutes;
        }

        function getCurrentClass() {
            const currentDay = getCurrentDay();
            const currentTime = getCurrentTime();
            
            if (!days.includes(currentDay) || !isSchoolTime()) {
                return null;
            }

            const daySchedule = scheduleData[currentDay];
            const [currentHour, currentMin] = currentTime.split(':').map(Number);
            const currentMinutes = currentHour * 60 + currentMin;

            for (const slot of daySchedule) {
                const [startTime, endTime] = slot.time.split('-');
                const startMinutes = parseTimeToMinutes(startTime.trim());
                const endMinutes = parseTimeToMinutes(endTime.trim());

                if (currentMinutes >= startMinutes && currentMinutes < endMinutes) {
                    return { ...slot, day: currentDay };
                }
            }

            return null;
        }

        function getNextClass() {
            const currentDay = getCurrentDay();
            const currentTime = getCurrentTime();
            let currentMinutes = parseTimeToMinutes(currentTime);

            // Si no es un día escolar, buscar el siguiente lunes
            if (!days.includes(currentDay)) {
                return { name: '🎉 Fin de semana', details: 'Disfruta tu descanso', teacher: null };
            }

            const daySchedule = scheduleData[currentDay];
            
            // Buscar la siguiente clase del día actual
            for (const slot of daySchedule) {
                const [startTime, endTime] = slot.time.split('-');
                const startMinutes = parseTimeToMinutes(startTime.trim());
                
                if (currentMinutes < startMinutes) {
                    return { ...slot, day: currentDay };
                }
            }

            // Si es la última clase, buscar el siguiente día
            const currentIndex = days.indexOf(currentDay);
            for (let i = currentIndex + 1; i < days.length; i++) {
                const nextDaySchedule = scheduleData[days[i]];
                for (const slot of nextDaySchedule) {
                    if (slot.code !== null && slot.code !== 'RECESO') {
                        return { ...slot, day: days[i] };
                    }
                }
            }

            // Si no hay más días, es fin de semana
            return { name: '🏁 Fin de clases', details: 'No hay más clases esta semana', teacher: null };
        }

        function updateCurrentClass() {
            const container = document.getElementById('currentClassContainer');
            const subjectEl = document.getElementById('currentSubject');
            const detailsEl = document.getElementById('currentDetails');
            const teacherEl = document.getElementById('teacherName');
            const iconEl = document.getElementById('currentIcon');
            
            const currentClass = getCurrentClass();
            
            if (!currentClass) {
                const currentDay = getCurrentDay();
                const isWeekday = days.includes(currentDay);
                
                if (!isWeekday) {
                    subjectEl.textContent = '🎉 Fin de semana';
                    detailsEl.textContent = '¡Disfruta tu descanso!';
                    iconEl.textContent = '😎';
                    container.className = 'current-class-container free';
                } else if (!isSchoolTime()) {
                    subjectEl.textContent = '🏠 Fuera de horario';
                    detailsEl.textContent = 'Horario escolar: 7:00 AM - 1:50 PM';
                    iconEl.textContent = '🏠';
                    container.className = 'current-class-container free';
                } else {
                    subjectEl.textContent = '⏸️ No hay clase';
                    detailsEl.textContent = 'Espacio libre o tutoría';
                    iconEl.textContent = '⏸️';
                    container.className = 'current-class-container free';
                }
                teacherEl.textContent = '';
                teacherEl.classList.remove('show');
                return;
            }

            subjectEl.textContent = currentClass.name;
            detailsEl.textContent = `${currentClass.day} | ${currentClass.time}`;
            
            if (currentClass.code === 'RECESO') {
                container.className = 'current-class-container recess';
                iconEl.textContent = '😎';
                teacherEl.textContent = '¡Hora de descansar!';
            } else if (currentClass.teacher) {
                container.className = 'current-class-container active';
                iconEl.textContent = '📖';
                teacherEl.textContent = `Prof. ${currentClass.teacher}`;
            } else {
                container.className = 'current-class-container active';
                iconEl.textContent = '📖';
                teacherEl.textContent = 'Sin profesor asignado';
            }
            
            teacherEl.classList.add('show');
        }

        function updateNextClass() {
            const nextClass = getNextClass();
            const subjectEl = document.getElementById('nextSubject');
            const detailsEl = document.getElementById('nextDetails');
            const iconEl = document.getElementById('nextIcon');

            subjectEl.textContent = nextClass.name;
            
            if (nextClass.day && nextClass.time) {
                detailsEl.textContent = `${nextClass.day} | ${nextClass.time}`;
                iconEl.textContent = '⏭️';
            } else {
                detailsEl.textContent = nextClass.details;
                iconEl.textContent = '🏁';
            }
        }

        function createDesktopSchedule() {
            const tbody = document.getElementById('scheduleBody');
            
            const timeSlots = [
                '07:00-07:50', '08:00-08:50', '09:00-09:45', '09:45-10:15',
                '10:15-11:00', '11:05-11:50', '12:00-12:50', '13:00-13:50'
            ];

            timeSlots.forEach((timeSlot, rowIndex) => {
                const tr = document.createElement('tr');
                tr.dataset.time = timeSlot;
                
                const timeCell = document.createElement('td');
                timeCell.textContent = timeSlot;
                timeCell.style.fontWeight = 'bold';
                timeCell.style.background = 'rgba(13, 71, 161, 0.08)';
                tr.appendChild(timeCell);

                days.forEach(day => {
                    const td = document.createElement('td');
                    const slot = scheduleData[day][rowIndex];
                    
                    td.dataset.day = day;
                    td.dataset.time = timeSlot;
                    
                    if (slot.code === 'RECESO') {
                        td.textContent = slot.name;
                        td.className = 'subject-cell recess-cell';
                    } else if (slot.code === null) {
                        td.textContent = slot.name;
                        td.className = 'subject-cell free-cell';
                    } else if (slot.code === 'TUTOR') {
                        td.textContent = 'TUTORÍA';
                        td.className = 'subject-cell free-cell';
                    } else {
                        td.textContent = slot.name;
                        td.className = 'subject-cell';
                        td.dataset.teacher = slot.teacher || 'Sin profesor asignado';
                        td.dataset.subject = slot.name;
                    }
                    
                    const currentClass = getCurrentClass();
                    if (currentClass && currentClass.day === day && currentClass.time === slot.time) {
                        td.classList.add('active');
                    }
                    
                    td.addEventListener('click', () => handleCellClick(slot, day));
                    tr.appendChild(td);
                });
                
                tbody.appendChild(tr);
            });
        }

        function createMobileSchedule(selectedDay = null) {
            const container = document.getElementById('mobileSchedule');
            container.innerHTML = '';
            
            const dayToShow = selectedDay || getCurrentDay();
            if (!days.includes(dayToShow)) {
                container.innerHTML = '<div class="mobile-card free">No hay clases hoy</div>';
                return;
            }

            const daySchedule = scheduleData[dayToShow];
            const currentClass = getCurrentClass();

            daySchedule.forEach(slot => {
                const card = document.createElement('div');
                card.className = 'mobile-card';
                
                const timeDiv = document.createElement('div');
                timeDiv.className = 'mobile-time';
                timeDiv.textContent = slot.time;
                card.appendChild(timeDiv);
                
                const subjectDiv = document.createElement('div');
                subjectDiv.className = 'mobile-subject';
                subjectDiv.textContent = slot.name;
                card.appendChild(subjectDiv);

                if (slot.teacher && slot.code !== 'RECESO') {
                    const teacherDiv = document.createElement('div');
                    teacherDiv.className = 'mobile-teacher';
                    teacherDiv.textContent = `Prof. ${slot.teacher}`;
                    card.appendChild(teacherDiv);

                    card.addEventListener('click', () => {
                        teacherDiv.classList.toggle('show');
                    });
                }

                if (slot.code === 'RECESO') {
                    card.classList.add('recess');
                } else if (slot.code === null) {
                    card.classList.add('free');
                }

                if (currentClass && currentClass.time === slot.time) {
                    card.classList.add('active');
                }

                container.appendChild(card);
            });
        }

        function handleCellClick(slot, day) {
            if (slot.code && slot.code !== 'RECESO' && slot.teacher) {
                showTeacherModal({
                    subject: slot.name,
                    teacher: slot.teacher,
                    time: slot.time,
                    day: day
                });
            } else if (slot.code === 'RECESO') {
                showTeacherModal({
                    subject: 'RECESO',
                    teacher: '¡Hora de descansar!',
                    time: slot.time,
                    day: day
                });
            } else if (slot.code === null) {
                showTeacherModal({
                    subject: 'LIBRE',
                    teacher: 'No hay clase asignada',
                    time: slot.time,
                    day: day
                });
            }
        }

        function showTeacherModal(info) {
            const modal = document.getElementById('teacherModal');
            document.getElementById('modalSubject').textContent = info.subject;
            document.getElementById('modalTeacher').textContent = info.teacher;
            document.getElementById('modalTime').textContent = `Horario: ${info.time}`;
            document.getElementById('modalDay').textContent = `Día: ${info.day}`;
            modal.classList.add('show');
        }

        function hideTeacherModal() {
            document.getElementById('teacherModal').classList.remove('show');
        }

        function updateDaySelector() {
            const currentDay = getCurrentDay();
            const buttons = document.querySelectorAll('.day-btn');
            
            buttons.forEach(btn => {
                if (btn.dataset.day === currentDay) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        function initDaySelector() {
            const buttons = document.querySelectorAll('.day-btn');
            buttons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    buttons.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    createMobileSchedule(e.target.dataset.day);
                });
            });
        }

        function updateDateTime() {
            document.getElementById('datetime').textContent = getCurrentDateTime();
        }

        function init() {
            updateDateTime();
            updateCurrentClass();
            updateNextClass();
            createDesktopSchedule();
            createMobileSchedule();
            updateDaySelector();
            initDaySelector();
            
            document.getElementById('closeModal').addEventListener('click', hideTeacherModal);
            document.getElementById('teacherModal').addEventListener('click', (e) => {
                if (e.target.id === 'teacherModal') hideTeacherModal();
            });
            
            setInterval(() => {
                updateDateTime();
                updateCurrentClass();
                updateNextClass();
                createDesktopSchedule();
                createMobileSchedule();
            }, 60000);
            
            setInterval(updateDateTime, 1000);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
