<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horario Grupo 1C - Bachilleres</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0D47A1;
            --secondary: #1976D2;
            --accent: #29B6F6;
            --accent-light: #81D4FA;
            --text: #1a237e;
            --text-light: #546E7A;
            --bg: linear-gradient(135deg, #E3F2FD 0%, #BBDEFB 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --shadow: 0 4px 20px rgba(31, 38, 135, 0.15);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --hover-glow: 0 8px 25px rgba(41, 182, 246, 0.3);
            --border-radius: 15px;
            --border: 1px solid rgba(0,0,0,0.08);
        }

        body.dark-mode {
            --primary: #1e40af;
            --secondary: #3b82f6;
            --accent: #60a5fa;
            --accent-light: #93c5fd;
            --text: #e3f2fd;
            --text-light: #cbd5e1;
            --bg: #000000;
            --card-bg: #0a0f1c;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            --hover-glow: 0 8px 25px rgba(96, 165, 250, 0.3);
            --border: 1px solid rgba(255,255,255,0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
            transition: var(--transition);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding-bottom: 80px;
        }

        header {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-radius: var(--border-radius);
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            animation: fadeInDown 0.6s ease;
        }

        .school-logo {
            font-size: 3rem;
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .school-name {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .datetime {
            font-size: 1rem;
            background: rgba(255,255,255,0.2);
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
            backdrop-filter: blur(10px);
            animation: pulse 4s infinite;
        }

        .class-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .current-class-container,
        .next-class-container {
            background: var(--card-bg);
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            border: 3px solid transparent;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .current-class-container.active {
            border-color: var(--accent);
            transform: translateY(-5px);
            box-shadow: var(--hover-glow);
        }

        .current-class-container.recess {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-color: #f5576c;
        }

        .current-class-container.free {
            background: linear-gradient(135deg, var(--accent-light) 0%, #E1F5FE 100%);
        }

        .class-icon {
            font-size: 2rem;
            margin-bottom: 10px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        .current-subject,
        .next-subject {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .current-details,
        .next-details {
            font-size: 0.95rem;
            color: var(--text-light);
            margin-bottom: 10px;
        }

        .teacher-name {
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent);
            margin-top: 10px;
            opacity: 0;
            transform: translateY(10px);
            transition: var(--transition);
        }

        .teacher-name.show {
            opacity: 1;
            transform: translateY(0);
        }

        .schedule-section {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 25px;
            box-shadow: var(--shadow);
            animation: fadeInUp 0.6s ease;
        }

        .schedule-title {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--primary);
            font-weight: 600;
        }

        .schedule-table {
            overflow-x: auto;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            min-width: 800px;
            background: var(--card-bg);
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            background: var(--primary);
            color: white;
            padding: 15px 10px;
            font-size: 0.9rem;
            text-transform: uppercase;
            font-weight: 600;
            transition: var(--transition);
        }

        th:hover {
            background: var(--secondary);
        }

        td {
            padding: 12px 8px;
            text-align: center;
            border: var(--border);
            transition: var(--transition);
            cursor: pointer;
            font-weight: 500;
            background: var(--card-bg);
        }

        td:hover {
            background: rgba(41, 182, 246, 0.08);
            transform: translateY(-2px);
            box-shadow: var(--hover-glow);
            z-index: 5;
        }

        td.active {
            background: var(--accent) !important;
            color: white !important;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        .recess-cell {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%) !important;
            color: white;
            font-weight: bold;
        }

        .free-cell {
            background: #F5F7FA;
            color: #90A4AE;
            font-style: italic;
        }

        body.dark-mode .free-cell {
            background: #1a1f2e;
            color: #64748b;
        }

        .tutor-cell {
            background: var(--card-bg);
            color: var(--text);
        }

        .teacher-info-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .teacher-info-modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            position: relative;
            animation: slideUp 0.4s ease;
            box-shadow: var(--shadow);
            border: 2px solid var(--accent);
        }

        .modal-content h3 {
            margin-bottom: 15px;
            color: var(--primary);
            font-size: 1.4rem;
            font-weight: 700;
        }

        .modal-content .profesor {
            font-weight: 700;
            color: var(--accent);
            font-size: 1.1rem;
            padding: 10px;
            background: rgba(41, 182, 246, 0.1);
            border-radius: 10px;
            margin: 15px 0;
        }

        .modal-aula {
            background: rgba(25, 118, 210, 0.1);
            color: var(--primary);
            padding: 8px;
            border-radius: 8px;
            font-weight: 600;
            margin: 10px 0;
        }

        .modal-content p {
            margin: 8px 0;
            color: var(--text);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.8rem;
            cursor: pointer;
            color: var(--text-light);
            transition: var(--transition);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .close-btn:hover {
            color: var(--accent);
            background: rgba(41, 182, 246, 0.1);
            transform: rotate(90deg);
        }

        .theme-toggle {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: var(--card-bg);
            border: none;
            box-shadow: var(--shadow);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            z-index: 999;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }

        .theme-toggle:hover {
            transform: scale(1.1) rotate(15deg);
            box-shadow: var(--hover-glow);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .class-cards {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            h1 {
                font-size: 1.4rem;
            }

            .current-subject,
            .next-subject {
                font-size: 1.2rem;
            }

            th {
                padding: 12px 5px;
                font-size: 0.8rem;
            }

            td {
                padding: 10px 5px;
                font-size: 0.8rem;
            }

            .modal-content {
                padding: 25px;
            }

            .theme-toggle {
                width: 50px;
                height: 50px;
                font-size: 1.4rem;
                bottom: 20px;
                right: 20px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.2rem;
            }

            .school-name {
                font-size: 0.8rem;
            }

            .class-cards {
                gap: 12px;
            }

            .current-class-container,
            .next-class-container {
                padding: 20px 15px;
            }

            .schedule-section {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="school-logo">🏫</div>
            <h1>Horario Grupo 1C</h1>
            <p class="school-name">Colegio de Bachilleres del Estado de Quintana Roo</p>
            <div class="datetime" id="datetime"></div>
        </header>

        <div class="class-cards">
            <div class="current-class-container" id="currentClassContainer">
                <div class="class-icon" id="currentIcon">📖</div>
                <div class="current-subject" id="currentSubject">--</div>
                <div class="current-details" id="currentDetails">--</div>
                <div class="teacher-name" id="teacherName"></div>
            </div>

            <div class="next-class-container" id="nextClassContainer">
                <div class="class-icon" id="nextIcon">⏭️</div>
                <div class="next-subject" id="nextSubject">--</div>
                <div class="next-details" id="nextDetails">--</div>
            </div>
        </div>

        <div class="schedule-section">
            <h2 class="schedule-title">📋 Horario Completo</h2>
            <div class="schedule-table">
                <table id="scheduleTable">
                    <thead>
                        <tr>
                            <th scope="col">Hora</th>
                            <th scope="col">Lunes</th>
                            <th scope="col">Martes</th>
                            <th scope="col">Miércoles</th>
                            <th scope="col">Jueves</th>
                            <th scope="col">Viernes</th>
                        </tr>
                    </thead>
                    <tbody id="scheduleBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema">
        <span id="themeIcon">🌙</span>
    </button>

    <div class="teacher-info-modal" id="teacherModal" role="dialog" aria-modal="true" aria-labelledby="modalSubject">
        <div class="modal-content">
            <button class="close-btn" id="closeModal" aria-label="Cerrar">&times;</button>
            <h3 id="modalSubject"></h3>
            <p class="profesor" id="modalTeacher"></p>
            <p class="modal-aula" id="modalAula"></p>
            <p id="modalTime"></p>
            <p id="modalDay"></p>
        </div>
    </div>

    <script>
        const scheduleData = {

                { time: '08:00-08:50', code: 'AFDC A11', name: 'Actividades Físicas Deportivas y Culturales I', teacher: 'Luis Humberto Concha Caballero' },

                { time: '10:15-11:00', code: 'PEMA A10', name: 'Pensamiento Matemático I', teacher: 'Nancy Sánchez Puc' },
                { time: '11:05-11:50', code: 'LEYCO A3', name: 'Lengua y Comunicación I', teacher: 'Graciela Rosalia May Polanco' },
                { time: '12:00-12:50', code: 'HUMA A15', name: 'Humanidades I', teacher: 'Brenda Yazmin Corona Sánchez' },

            ],

                { time: '10:15-11:00', code: 'LA MATERIA A8', name: 'La Materia y sus Interacciones', teacher: 'Teresa Beatriz Un Cen' },
                { time: '11:05-11:50', code: 'LEYCO A3', name: 'Lengua y Comunicación I', teacher: 'Graciela Rosalia May Polanco' },

            ],
            'Jueves': [

                { time: '08:00-08:50', code: 'HUMA A15', name: 'Humanidades I', teacher: 'Brenda Yazmin Corona Sánchez' },
                { time: '09:00-09:45', code: 'HUMA A15', name: 'Humanidades I', teacher: 'Brenda Yazmin Corona Sánchez' },
                { time: '09:45-10:15', code: 'RECESO', name: 'Receso', teacher: null },
                { time: '10:15-11:00', code: 'INGLÉS A3', name: 'Inglés I', teacher: 'Graciela Rosalia May Polanco' },
                { time: '11:05-11:50', code: 'CUDI LAB INFO', name: 'Cultura Digital I', teacher: 'Yeni del Rocío Aguilar Cen' },
                { time: '12:00-12:50', code: 'CUDI LAB INFO', name: 'Cultura Digital I', teacher: 'Yeni del Rocío Aguilar Cen' },
                { time: '13:00-13:50', code: 'AFDC A11', name: 'Actividades Físicas Deportivas y Culturales I', teacher: 'Luis Humberto Concha Caballero' }
            ],
            'Viernes': [
                { time: '07:00-07:50', code: null, name: 'Libre', teacher: null },
                { time: '08:00-08:50', code: 'PEMA A10', name: 'Pensamiento Matemático I', teacher: 'Nancy Sánchez Puc' },
                { time: '09:00-09:45', code: 'PEMA A10', name: 'Pensamiento Matemático I', teacher: 'Nancy Sánchez Puc' },
                { time: '09:45-10:15', code: 'RECESO', name: 'Receso', teacher: null },
                { time: '10:15-11:00', code: 'LA MATERIA A8', name: 'La Materia y sus Interacciones', teacher: 'Teresa Beatriz Un Cen' },
                { time: '11:05-11:50', code: 'LA MATERIA A8', name: 'La Materia y sus Interacciones', teacher: 'Teresa Beatriz Un Cen' },
                { time: '12:00-12:50', code: 'EDIESYG A5', name: 'Educación Integral en Sexualidad y Género I', teacher: 'Zafiro Flor Silvestre del Ángel Ponce' },
                { time: '13:00-13:50', code: 'LADEIN A6', name: 'Laboratorio de Investigación', teacher: 'Jesús Israel Puc Magaña' }
            ]
        };

        const days = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes'];
        const timeZone = 'America/Cancun';

        function convertTo12HourFormat(time24) {
            const [hours, minutes] = time24.split(':').map(Number);
            const period = hours >= 12 ? 'PM' : 'AM';
            const hours12 = hours % 12 || 12;
            return `${hours12}:${minutes.toString().padStart(2, '0')} ${period}`;
        }

        function convertTimeRangeTo12Hour(range) {
            return range.split('-').map(t => convertTo12HourFormat(t.trim())).join(' - ');
        }

        function extractAula(code) {
            if (!code || code === 'RECESO' || code === 'CUDI LAB INFO') {
                return code === 'CUDI LAB INFO' ? 'Laboratorio de Informática' : 'N/A';
            }
            const match = code.match(/A\d+/);
            return match ? match[0] : 'N/A';
        }

        function getCurrentDateTime() {
            const options = {
                timeZone,
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            };
            return new Date().toLocaleString('es-MX', options);
        }

        function getCurrentDay() {
            const options = { timeZone, weekday: 'long' };
            const dayName = new Date().toLocaleDateString('es-MX', options);
            return dayName.charAt(0).toUpperCase() + dayName.slice(1);
        }

        function getCurrentTime() {
            const options = { timeZone, hour12: true, hour: '2-digit', minute: '2-digit' };
            return new Date().toLocaleTimeString('es-MX', options);
        }

        function parseTimeToMinutes(timeStr) {
            const [hours, minutes] = timeStr.split(':').map(Number);
            return hours * 60 + minutes;
        }

        function isSchoolTime() {
            const now = new Date(new Date().toLocaleString("en-US", {timeZone}));
            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            return currentMinutes >= 420 && currentMinutes <= 830;
        }

        function getCurrentClass() {
            const currentDay = getCurrentDay();
            if (!days.includes(currentDay) || !isSchoolTime()) return null;

            const daySchedule = scheduleData[currentDay];
            const now = new Date(new Date().toLocaleString("en-US", {timeZone}));
            const currentMinutes = now.getHours() * 60 + now.getMinutes();

            for (const slot of daySchedule) {
                const [startTime, endTime] = slot.time.split('-');
                const startMinutes = parseTimeToMinutes(startTime.trim());
                const endMinutes = parseTimeToMinutes(endTime.trim());

                if (currentMinutes >= startMinutes && currentMinutes < endMinutes) {
                    return { ...slot, day: currentDay };
                }
            }

            return null;
        }

        function getNextClass() {
            const currentDay = getCurrentDay();
            const now = new Date(new Date().toLocaleString("en-US", {timeZone}));
            const currentMinutes = now.getHours() * 60 + now.getMinutes();

            if (!days.includes(currentDay)) {
                return { name: 'Fin de semana', details: 'Disfruta tu descanso', teacher: null };
            }

            const daySchedule = scheduleData[currentDay];
            
            for (const slot of daySchedule) {
                const [startTime] = slot.time.split('-');
                const startMinutes = parseTimeToMinutes(startTime.trim());
                
                if (currentMinutes < startMinutes && slot.code !== null && slot.code !== 'RECESO') {
                    return { ...slot, day: currentDay };
                }
            }

            const currentIndex = days.indexOf(currentDay);
            for (let i = currentIndex + 1; i < days.length; i++) {
                const nextDaySchedule = scheduleData[days[i]];
                for (const slot of nextDaySchedule) {
                    if (slot.code !== null && slot.code !== 'RECESO') {
                        return { ...slot, day: days[i] };
                    }
                }
            }

            return { name: 'Fin de clases', details: 'No hay más clases esta semana', teacher: null };
        }

        function updateCurrentClass() {
            const container = document.getElementById('currentClassContainer');
            const subjectEl = document.getElementById('currentSubject');
            const detailsEl = document.getElementById('currentDetails');
            const teacherEl = document.getElementById('teacherName');
            const iconEl = document.getElementById('currentIcon');
            
            const currentClass = getCurrentClass();
            
            if (!currentClass) {
                const currentDay = getCurrentDay();
                const isWeekday = days.includes(currentDay);
                
                if (!isWeekday) {
                    subjectEl.textContent = 'Fin de semana';
                    detailsEl.textContent = 'Disfruta tu descanso';
                    iconEl.textContent = '😎';
                    container.className = 'current-class-container free';
                } else if (!isSchoolTime()) {
                    subjectEl.textContent = 'Fuera de horario';
                    detailsEl.textContent = 'Horario escolar: 7:00 AM - 1:50 PM';
                    iconEl.textContent = '🏠';
                    container.className = 'current-class-container free';
                } else {
                    subjectEl.textContent = 'No hay clase';
                    detailsEl.textContent = 'Espacio libre o tutoría';
                    iconEl.textContent = '⏸️';
                    container.className = 'current-class-container free';
                }
                teacherEl.textContent = '';
                teacherEl.classList.remove('show');
                return;
            }

            subjectEl.textContent = currentClass.name;
            detailsEl.textContent = `${currentClass.day} | ${convertTimeRangeTo12Hour(currentClass.time)}`;
            
            if (currentClass.code === 'RECESO') {
                container.className = 'current-class-container recess';
                iconEl.textContent = '😎';
                teacherEl.textContent = '¡Hora de descansar!';
            } else {
                container.className = 'current-class-container active';
                iconEl.textContent = '📖';
                teacherEl.textContent = `Prof. ${currentClass.teacher}`;
            }
            
            teacherEl.classList.add('show');
        }

        function updateNextClass() {
            const nextClass = getNextClass();
            const subjectEl = document.getElementById('nextSubject');
            const detailsEl = document.getElementById('nextDetails');
            const iconEl = document.getElementById('nextIcon');

            subjectEl.textContent = nextClass.name;
            
            if (nextClass.day && nextClass.time) {
                detailsEl.textContent = `${nextClass.day} | ${convertTimeRangeTo12Hour(nextClass.time)}`;
                iconEl.textContent = '⏭️';
            } else {
                detailsEl.textContent = nextClass.details;
                iconEl.textContent = '🏁';
            }
        }

        function createScheduleTable() {
            const tbody = document.getElementById('scheduleBody');
            tbody.innerHTML = '';
            
            const timeSlots = [
                '07:00-07:50', '08:00-08:50', '09:00-09:45', '09:45-10:15',
                '10:15-11:00', '11:05-11:50', '12:00-12:50', '13:00-13:50'
            ];

            const currentClass = getCurrentClass();

            timeSlots.forEach((timeSlot, rowIndex) => {
                const tr = document.createElement('tr');
                tr.dataset.time = timeSlot;
                
                const timeCell = document.createElement('th');
                timeCell.textContent = convertTimeRangeTo12Hour(timeSlot);
                timeCell.style.fontWeight = 'bold';
                timeCell.style.background = 'rgba(13, 71, 161, 0.08)';
                timeCell.style.color = 'var(--primary)';
                tr.appendChild(timeCell);

                days.forEach(day => {
                    const td = document.createElement('td');
                    const slot = scheduleData[day][rowIndex];
                    
                    td.dataset.day = day;
                    td.dataset.time = timeSlot;
                    td.dataset.teacher = slot.teacher || '';
                    td.dataset.subject = slot.name;
                    td.dataset.aula = extractAula(slot.code);
                    
                    if (slot.code === 'RECESO') {
                        td.textContent = slot.name;
                        td.className = 'recess-cell';
                    } else if (slot.code === null) {
                        td.textContent = 'Libre';
                        td.className = 'free-cell';
                    } else {
                        td.textContent = slot.name;
                        td.className = '';
                    }
                    
                    if (currentClass && currentClass.day === day && currentClass.time === slot.time) {
                        td.classList.add('active');
                    }
                    
                    td.addEventListener('click', () => {
                        if (slot.code !== null && slot.code !== 'RECESO') {
                            showTeacherModal({
                                subject: slot.name,
                                teacher: slot.teacher || 'Sin profesor asignado',
                                aula: extractAula(slot.code),
                                time: convertTimeRangeTo12Hour(slot.time),
                                day
                            });
                        }
                    });
                    
                    tr.appendChild(td);
                });
                
                tbody.appendChild(tr);
            });
        }

        function showTeacherModal(info) {
            const modal = document.getElementById('teacherModal');
            document.getElementById('modalSubject').textContent = info.subject;
            document.getElementById('modalTeacher').textContent = `Prof. ${info.teacher}`;
            document.getElementById('modalAula').textContent = `Aula: ${info.aula}`;
            document.getElementById('modalTime').textContent = `Horario: ${info.time}`;
            document.getElementById('modalDay').textContent = `Día: ${info.day}`;
            modal.classList.add('show');
        }

        function hideTeacherModal() {
            document.getElementById('teacherModal').classList.remove('show');
        }

        function updateDateTime() {
            document.getElementById('datetime').textContent = getCurrentDateTime();
        }

        function toggleTheme() {
            const body = document.body;
            const themeIcon = document.getElementById('themeIcon');
            
            if (body.classList.contains('dark-mode')) {
                body.classList.remove('dark-mode');
                themeIcon.textContent = '🌙';
                localStorage.setItem('darkMode', 'false');
            } else {
                body.classList.add('dark-mode');
                themeIcon.textContent = '☀️';
                localStorage.setItem('darkMode', 'true');
            }
        }

        function applySavedTheme() {
            const savedTheme = localStorage.getItem('darkMode');
            const themeIcon = document.getElementById('themeIcon');
            
            if (savedTheme === 'true') {
                document.body.classList.add('dark-mode');
                themeIcon.textContent = '☀️';
            } else {
                document.body.classList.remove('dark-mode');
                themeIcon.textContent = '🌙';
            }
        }

        function init() {
            applySavedTheme();
            
            updateDateTime();
            updateCurrentClass();
            updateNextClass();
            createScheduleTable();
            
            document.getElementById('closeModal').addEventListener('click', hideTeacherModal);
            document.getElementById('teacherModal').addEventListener('click', (e) => {
                if (e.target.id === 'teacherModal') hideTeacherModal();
            });
            
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);
            
            setInterval(() => {
                updateDateTime();
                updateCurrentClass();
                updateNextClass();
                createScheduleTable();
            }, 60000);
            
            setInterval(updateDateTime, 1000);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
