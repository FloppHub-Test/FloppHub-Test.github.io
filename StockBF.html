<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock de Blox Fruits</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #ff7700;
            --secondary-color: #000000;
            --accent-color: #ff5500;
            --text-color: #ffffff;
            --card-bg: rgba(0, 0, 0, 0.7);
            --glow-color: rgba(255, 119, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--secondary-color) 0%, #1a1a1a 100%);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1471&q=80') center/cover no-repeat;
            opacity: 0.1;
            z-index: -1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 20px 0;
            position: relative;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 3rem;
            color: var(--primary-color);
            text-shadow: 0 0 10px var(--glow-color);
            margin-bottom: 10px;
            animation: pulse 2s infinite;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .developer {
            font-size: 1.2rem;
            color: var(--text-color);
            margin-bottom: 20px;
            font-style: italic;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 0 15px var(--glow-color);
            border: 1px solid var(--primary-color);
        }

        .last-update {
            font-size: 0.9rem;
            color: #cccccc;
        }

        .refresh-info {
            font-size: 0.9rem;
            color: var(--primary-color);
        }

        .fruits-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .fruit-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .fruit-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 25px var(--glow-color);
            border-color: var(--primary-color);
        }

        .fruit-card.in-stock {
            border-color: #00ff00;
        }

        .fruit-card.out-of-stock {
            border-color: #ff0000;
        }

        .fruit-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fruit-icon img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .fruit-name {
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: var(--primary-color);
            font-weight: bold;
        }

        .fruit-status {
            font-size: 1.1rem;
            padding: 5px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 10px;
        }

        .in-stock .fruit-status {
            background-color: rgba(0, 255, 0, 0.2);
            color: #00ff00;
        }

        .out-of-stock .fruit-status {
            background-color: rgba(255, 0, 0, 0.2);
            color: #ff0000;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.5rem;
            color: var(--primary-color);
        }

        .loading i {
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            border-top: 1px solid rgba(255, 119, 0, 0.3);
            color: #cccccc;
            font-size: 0.9rem;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fruit-card {
            animation: fadeIn 0.5s ease-out;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .fruits-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .logo {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-apple-alt"></i>
            </div>
            <h1>Stock de Blox Fruits</h1>
            <div class="developer">
                Desarrollado por ⛧⃝𓄃THE NOTORIOUS B.H.R ♡♱
            </div>
        </header>

        <div class="status-bar">
            <div class="last-update">
                Última actualización: <span id="last-update-time">Cargando...</span>
            </div>
            <div class="refresh-info">
                <i class="fas fa-sync-alt"></i> Actualización automática cada 30 segundos
            </div>
        </div>

        <div id="fruits-container" class="fruits-grid">
            <div class="loading">
                <i class="fas fa-spinner"></i> Cargando stock de frutas...
            </div>
        </div>

        <footer>
            <p>Stock en tiempo real de Blox Fruits - Todos los derechos reservados</p>
        </footer>
    </div>

    <script>
        // Mapeo de nombres de frutas a emojis/imágenes
        const fruitIcons = {
            "bomb": "💣",
            "spike": "🌵",
            "chop": "🪓",
            "spring": "🦘",
            "kilo": "⚖️",
            "spin": "🌀",
            "smoke": "💨",
            "flame": "🔥",
            "falcon": "🦅",
            "ice": "❄️",
            "sand": "🏜️",
            "dark": "🌑",
            "diamond": "💎",
            "light": "💡",
            "rubber": "🛞",
            "barrier": "🛡️",
            "ghost": "👻",
            "magma": "🌋",
            "quake": "🌍",
            "buddha": "🪷",
            "love": "💖",
            "spider": "🕷️",
            "sound": "🔊",
            "phoenix": "🐦",
            "portal": "🌀",
            "rumble": "⚡",
            "pain": "💀",
            "blizzard": "🌨️",
            "gravity": "🌌",
            "mammoth": "🐘",
            "dough": "🍞",
            "shadow": "👤",
            "venom": "🐍",
            "control": "🎮",
            "spirit": "👻",
            "dragon": "🐉",
            "leopard": "🐆",
            "kitsune": "🦊"
        };

        // URLs de imágenes de ejemplo (en un caso real, usaríamos imágenes específicas)
        const fruitImages = {
            "bomb": "https://static.wikia.nocookie.net/roblox-blox-fruits/images/6/6c/Bomb_Fruit.png",
            "flame": "https://static.wikia.nocookie.net/roblox-blox-fruits/images/8/8c/Flame_Fruit.png",
            "ice": "https://static.wikia.nocookie.net/roblox-blox-fruits/images/4/4b/Ice_Fruit.png",
            "sand": "https://static.wikia.nocookie.net/roblox-blox-fruits/images/9/9b/Sand_Fruit.png",
            "dark": "https://static.wikia.nocookie.net/roblox-blox-fruits/images/6/6e/Dark_Fruit.png",
            "light": "https://static.wikia.nocookie.net/roblox-blox-fruits/images/5/5c/Light_Fruit.png",
            "magma": "https://static.wikia.nocookie.net/roblox-blox-fruits/images/3/3a/Magma_Fruit.png",
            "quake": "https://static.wikia.nocookie.net/roblox-blox-fruits/images/4/4a/Quake_Fruit.png",
            "buddha": "https://static.wikia.nocookie.net/roblox-blox-fruits/images/0/0a/Buddha_Fruit.png",
            "love": "https://static.wikia.nocookie.net/roblox-blox-fruits/images/3/3e/Love_Fruit.png",
            "spider": "https://static.wikia.nocookie.net/roblox-blox-fruits/images/3/3a/Spider_Fruit.png",
            "sound": "https://static.wikia.nocookie.net/roblox-blox-fruits/images/2/2e/Sound_Fruit.png",
            "phoenix": "https://static.wikia.nocookie.net/roblox-blox-fruits/images/6/6c/Phoenix_Fruit.png",
            "portal": "https://static.wikia.nocookie.net/roblox-blox-fruits/images/0/0c/Portal_Fruit.png",
            "rumble": "https://static.wikia.nocookie.net/roblox-blox-fruits/images/5/5e/Rumble_Fruit.png",
            "pain": "https://static.wikia.nocookie.net/roblox-blox-fruits/images/4/4a/Pain_Fruit.png",
            "blizzard": "https://static.wikia.nocookie.net/roblox-blox-fruits/images/8/8c/Blizzard_Fruit.png",
            "gravity": "https://static.wikia.nocookie.net/roblox-blox-fruits/images/8/8c/Gravity_Fruit.png",
            "mammoth": "https://static.wikia.nocookie.net/roblox-blox-fruits/images/8/8c/Mammoth_Fruit.png",
            "dough": "https://static.wikia.nocookie.net/roblox-blox-fruits/images/8/8c/Dough_Fruit.png",
            "shadow": "https://static.wikia.nocookie.net/roblox-blox-fruits/images/8/8c/Shadow_Fruit.png",
            "venom": "https://static.wikia.nocookie.net/roblox-blox-fruits/images/8/8c/Venom_Fruit.png",
            "control": "https://static.wikia.nocookie.net/roblox-blox-fruits/images/8/8c/Control_Fruit.png",
            "spirit": "https://static.wikia.nocookie.net/roblox-blox-fruits/images/8/8c/Spirit_Fruit.png",
            "dragon": "https://static.wikia.nocookie.net/roblox-blox-fruits/images/8/8c/Dragon_Fruit.png",
            "leopard": "https://static.wikia.nocookie.net/roblox-blox-fruits/images/8/8c/Leopard_Fruit.png",
            "kitsune": "https://static.wikia.nocookie.net/roblox-blox-fruits/images/8/8c/Kitsune_Fruit.png"
        };

        // Función para obtener datos de la API
        async function fetchStockData() {
            try {
                const response = await fetch('http://104.234.236.61:30200/api/stock?name=bf&mode=free');
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error al obtener datos de la API:', error);
                return null;
            }
        }

        // Función para formatear el nombre de la fruta
        function formatFruitName(name) {
            return name.charAt(0).toUpperCase() + name.slice(1);
        }

        // Función para mostrar los datos en la página
        function displayStockData(stockData) {
            const container = document.getElementById('fruits-container');
            
            if (!stockData || !stockData.stock) {
                container.innerHTML = '<div class="loading">Error al cargar los datos del stock</div>';
                return;
            }

            let html = '';
            
            // Procesar cada fruta en el stock
            Object.entries(stockData.stock).forEach(([fruitName, isAvailable]) => {
                const formattedName = formatFruitName(fruitName);
                const statusClass = isAvailable ? 'in-stock' : 'out-of-stock';
                const statusText = isAvailable ? 'Disponible' : 'Agotado';
                
                // Intentar usar imagen, si no está disponible usar emoji
                let iconHtml = '';
                if (fruitImages[fruitName]) {
                    iconHtml = `<img src="${fruitImages[fruitName]}" alt="${formattedName}" onerror="this.parentElement.innerHTML='${fruitIcons[fruitName] || '🍎'}'">`;
                } else {
                    iconHtml = fruitIcons[fruitName] || '🍎';
                }
                
                html += `
                    <div class="fruit-card ${statusClass}">
                        <div class="fruit-icon">
                            ${iconHtml}
                        </div>
                        <div class="fruit-name">${formattedName}</div>
                        <div class="fruit-status">${statusText}</div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            
            // Actualizar la hora de la última actualización
            document.getElementById('last-update-time').textContent = new Date().toLocaleTimeString();
        }

        // Función principal para cargar y actualizar datos
        async function loadAndUpdateStock() {
            const stockData = await fetchStockData();
            displayStockData(stockData);
        }

        // Cargar datos iniciales
        loadAndUpdateStock();

        // Actualizar datos cada 30 segundos
        setInterval(loadAndUpdateStock, 30000);
    </script>
</body>
</html>
