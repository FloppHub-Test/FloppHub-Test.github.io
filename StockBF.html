<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Stock de Blox Fruits</title>
    <style>
        body {
            background: linear-gradient(135deg, #000000, #1a1a1a);
            color: #FF8C00;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: glow 2s ease-in-out infinite alternate;
        }
        @keyframes glow {
            from { text-shadow: 0 0 5px #FF8C00; }
            to { text-shadow: 0 0 20px #FF8C00, 0 0 30px #FF8C00; }
        }
        .logo {
            width: 200px;
            height: auto;
            animation: rotate 10s linear infinite;
            border-radius: 50%;
            border: 3px solid #FF8C00;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        h1 {
            font-size: 3em;
            margin: 10px 0;
            text-transform: uppercase;
            letter-spacing: 5px;
        }
        h2 {
            color: #FF8C00;
            border-bottom: 2px solid #FF8C00;
            padding-bottom: 10px;
            text-align: center;
            font-size: 2em;
        }
        .section {
            max-width: 800px;
            margin: 30px auto;
            background: rgba(255, 140, 0, 0.1);
            border: 2px solid #FF8C00;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(255, 140, 0, 0.3);
        }
        .fruit {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 15px 0;
            padding: 15px;
            background: rgba(0, 0, 0, 0.5);
            border-left: 5px solid #FF8C00;
            border-radius: 10px;
            animation: slideIn 0.5s ease-out;
            transition: transform 0.3s;
        }
        .fruit:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(255, 140, 0, 0.4);
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .emoji {
            font-size: 3em;
            margin-right: 15px;
        }
        .info {
            flex-grow: 1;
        }
        .name {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .price {
            color: #FFD700;
            font-weight: bold;
        }
        .stock {
            color: #FF4500;
            font-weight: bold;
            font-size: 1.2em;
        }
        .unlimited {
            color: #00FF00;
        }
        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            font-size: 1.2em;
            color: #FF8C00;
            border-top: 1px solid #FF8C00;
            animation: fadeIn 2s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .update-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #FF8C00;
            color: black;
            padding: 10px;
            border-radius: 50px;
            font-weight: bold;
            animation: pulse 1s infinite;
        }
    </style>
</head>
<body>
    <div class="update-indicator" id="updateIndicator">Actualizando...</div>
    
    <div class="header">
        <img src="https://static.wikia.nocookie.net/roblox-blox-piece/images/5/52/BloxFruitsHeader.png/revision/latest?cb=20250731190159" alt="Blox Fruits Logo" class="logo">
        <h1>Monitor de Stock</h1>
        <p>Información en tiempo real de Blox Fruits</p>
    </div>

    <div class="section" id="normalSection">
        <h2>Frutas Normales</h2>
        <div id="normal"></div>
    </div>

    <div class="section" id="mirageSection">
        <h2>Frutas de la Isla Mirage</h2>
        <div id="mirage"></div>
    </div>

    <footer>
        Desarrollador de la página y API: ⛧⃝𓄃THE NOTORIUS B.H.R ♡♱
    </footer>

    <script>
        const apiUrl = 'http://104.234.236.61:30200/api/stock?name=bf&mode=free';
        
        function getEmoji(name) {
            const emojis = {
                'Rocket-Rocket': '🚀',
                'Spin-Spin': '🌀',
                'Blade-Blade': '⚔️',
                'Smoke-Smoke': '💨',
                'Buddha-Buddha': '🧘',
                'Sound-Sound': '🔊',
                'Shadow-Shadow': '🌑',
                'Bomb-Bomb': '💣',
                'Spike-Spike': '🌵',
                'Dark-Dark': '🌑',
                'Magma-Magma': '🔥'
            };
            return emojis[name] || '🍎';
        }
        
        function updateStock() {
            document.getElementById('updateIndicator').textContent = 'Actualizando...';
            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    // Update Normal
                    const normalDiv = document.getElementById('normal');
                    normalDiv.innerHTML = '';
                    data['Blox Fruits'].normal.forEach(fruit => {
                        const fruitDiv = document.createElement('div');
                        fruitDiv.className = 'fruit';
                        fruitDiv.innerHTML = `
                            <span class="emoji">${getEmoji(fruit.name)}</span>
                            <div class="info">
                                <div class="name">${fruit.name}</div>
                                <div class="price">Precio: ${fruit.price.toLocaleString()}</div>
                                <div class="stock ${fruit.stock === null ? 'unlimited' : ''}">
                                    Stock: ${fruit.stock === null ? 'Ilimitado' : fruit.stock}
                                </div>
                            </div>
                        `;
                        normalDiv.appendChild(fruitDiv);
                    });

                    // Update Mirage
                    const mirageDiv = document.getElementById('mirage');
                    mirageDiv.innerHTML = '';
                    data['Blox Fruits'].mirage.forEach(fruit => {
                        const fruitDiv = document.createElement('div');
                        fruitDiv.className = 'fruit';
                        fruitDiv.innerHTML = `
                            <span class="emoji">${getEmoji(fruit.name)}</span>
                            <div class="info">
                                <div class="name">${fruit.name}</div>
                                <div class="price">Precio: ${fruit.price.toLocaleString()}</div>
                                <div class="stock ${fruit.stock === null ? 'unlimited' : ''}">
                                    Stock: ${fruit.stock === null ? 'Ilimitado' : fruit.stock}
                                </div>
                            </div>
                        `;
                        mirageDiv.appendChild(fruitDiv);
                    });

                    document.getElementById('updateIndicator').textContent = `Última actualización: ${new Date().toLocaleTimeString()}`;
                })
                .catch(error => {
                    console.error('Error fetching stock:', error);
                    document.getElementById('updateIndicator').textContent = 'Error al actualizar';
                });
        }

        // Initial load and update every 10 seconds
        updateStock();
        setInterval(updateStock, 10000);
    </script>
</body>
</html>
