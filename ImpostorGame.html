<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Impostor</title>
<style>
  :root {
    --ink: #f4f4f5;
    --cream: #000;
    --pink: #ff2d6a;
    --yellow: #ffe14a;
    --blue: #7ecbff;
    --mint: #8ee6b0;
    --card: #0c0c0c;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100dvh; color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    background: #000;
    overflow: hidden;
  }
  button, input { font-family: inherit; color: var(--ink); }
  button { cursor: pointer; border: 0; }
  #app {
    height: 100dvh; display: flex; flex-direction: column;
    padding: calc(12px + var(--safe-t)) 16px calc(14px + var(--safe-b));
  }
  .screen { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .screen.on { display: flex; }
  .scroll { overflow: auto; flex: 1; min-height: 0; }
  h1 {
    font-size: 64px; line-height: .86; margin: 8px 0 18px; letter-spacing: -2px;
    color: #fff; text-shadow: 0 0 24px rgba(255,45,106,.45);
  }
  .face {
    width: 108px; height: 108px; border-radius: 36px; border: 3px solid #3a3a3a;
    background: #111; box-shadow: 0 0 0 1px #000, 0 0 28px rgba(255,225,74,.2);
    display: grid; place-items: center; margin-bottom: 8px;
  }
  .btn, .step button, .ghost, .primary {
    min-height: 64px; border-radius: 22px; border: 3px solid #2c2c2c;
    font-size: 24px; font-weight: 800; box-shadow: none;
  }
  .primary { background: var(--pink); color: white; width: 100%; border-color: #ff2d6a; }
  .ghost { background: #111; color: #fff; width: 100%; }
  .primary:active, .ghost:active, .step button:active, .pbtn:active { transform: translateY(1px); }
  .stack { display: grid; gap: 12px; margin-top: auto; }
  .block {
    background: #0a0a0a; border: 3px solid #222; border-radius: 26px;
    box-shadow: none; padding: 14px 16px; margin-bottom: 12px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .k { font-size: 22px; font-weight: 800; }
  .step { display: flex; align-items: center; gap: 8px; }
  .step button {
    width: 58px; background: #111; color: #fff; font-size: 32px; padding: 0;
  }
  .num { font-size: 40px; font-weight: 900; min-width: 42px; text-align: center; }
  .names { display: grid; gap: 10px; }
  .names input {
    width: 100%; min-height: 58px; border-radius: 18px; border: 3px solid #2a2a2a;
    background: #000; color: #fff; font-size: 22px; font-weight: 800; padding: 0 14px;
  }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mode {
    min-height: 74px; border-radius: 20px; border: 3px solid #2a2a2a;
    background: #111; color: #fff; font-size: 18px; font-weight: 800; box-shadow: none;
  }
  .mode.on { background: #1a1400; border-color: var(--yellow); color: var(--yellow); }
  .who { text-align: center; font-size: 18px; font-weight: 800; opacity: .7; }
  .pname { text-align: center; font-size: 48px; font-weight: 900; line-height: .95; margin: 4px 0 8px; letter-spacing: -1px; }
  .stage { flex: 1; position: relative; min-height: 280px; }
  .role, .cover {
    position: absolute; inset: 0; border-radius: 32px; border: 3px solid #2a2a2a;
    box-shadow: none; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 22px;
  }
  .role.det { background: #041018; border-color: #164e63; }
  .role.imp { background: #14060c; border-color: #9f1239; }
  .cover { background: #0a0a0a; border-color: #3a3a3a; z-index: 2; touch-action: none; justify-content: flex-end; align-items: flex-start; }
  .badge {
    font-size: 18px; font-weight: 900; letter-spacing: .12em;
    background: #000; border: 3px solid #333; border-radius: 999px; padding: 6px 12px; color: #fff;
  }
  .secret { font-size: 46px; font-weight: 900; line-height: .95; margin: 12px 0; letter-spacing: -1px; color: #fff; }
  .timer { font-size: 78px; font-weight: 900; text-align: center; letter-spacing: -3px; line-height: .9; color: #fff; }
  .timer.warn { color: var(--yellow); }
  .timer.late { color: var(--pink); }
  .players { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pbtn {
    min-height: 78px; text-align: left; padding: 12px; border-radius: 22px;
    border: 3px solid #2a2a2a; background: #0c0c0c; color: #fff; box-shadow: none; font-size: 20px; font-weight: 900;
  }
  .pbtn.on { background: var(--pink); color: white; border-color: var(--pink); }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .pill {
    background: #111; border: 3px solid #2a2a2a; border-radius: 999px;
    padding: 6px 12px; font-weight: 800; font-size: 16px; color: #fff;
  }
  .tiny { text-align: center; font-weight: 800; font-size: 18px; margin: 0 0 8px; }
  .back {
    width: auto; min-height: 48px; padding: 0 14px; font-size: 18px; background: #111; color: #fff;
  }
  svg circle, svg path { stroke: #ffe14a; }
  svg circle { fill: #ffe14a; }
</style>
</head>
<body>
<div id="app">
  <section class="screen on" id="home">
    <div class="face" aria-hidden="true">
      <svg width="74" height="74" viewBox="0 0 74 74" fill="none">
        <circle cx="26" cy="30" r="6" fill="#ffe14a"/>
        <circle cx="48" cy="30" r="6" fill="#ffe14a"/>
        <path d="M24 48c6 8 20 8 26 0" stroke="#ffe14a" stroke-width="5" stroke-linecap="round"/>
        <path d="M14 22c4-8 10-8 14-2M60 22c-4-8-10-8-14-2" stroke="#ffe14a" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>Impostor</h1>
    <div class="stack">
      <button class="primary" id="goSetup">Jugar</button>
    </div>
  </section>

  <section class="screen" id="setup">
    <div class="top"><button class="ghost back" id="setupBack">Atrás</button><span class="pill" id="timerPreview">07:00</span></div>
    <div class="scroll">
      <div class="block">
        <div class="row">
          <div class="k">Jugadores</div>
          <div class="step"><button type="button" id="minusP">−</button><div class="num" id="pCount">4</div><button type="button" id="plusP">+</button></div>
        </div>
      </div>
      <div class="block">
        <div class="row">
          <div class="k">Impostores</div>
          <div class="step"><button type="button" id="minusI">−</button><div class="num" id="iCount">1</div><button type="button" id="plusI">+</button></div>
        </div>
      </div>
      <div class="block">
        <div class="names" id="nameList"></div>
      </div>
      <div class="modes">
        <button class="mode on" id="modeSame" type="button">Misma pista</button>
        <button class="mode" id="modeDiff" type="button">Pistas distintas</button>
      </div>
    </div>
    <button class="primary" id="startBtn">Empezar</button>
  </section>

  <section class="screen" id="pass">
    <div class="who" id="passHelp">1 de 4</div>
    <div class="pname" id="passName">—</div>
    <div class="stage" id="stage">
      <div class="role" id="roleCard"></div>
      <div class="cover" id="cover">
        <div class="pname" id="coverName" style="font-size:42px">—</div>
        <div class="k">Desliza ↑</div>
      </div>
    </div>
    <div class="stack" id="beforeReveal">
      <button class="ghost" id="tapReveal">Ver rol</button>
    </div>
    <div class="stack" id="afterReveal" style="display:none">
      <button class="primary" id="hidePass">Listo</button>
    </div>
  </section>

  <section class="screen" id="discuss">
    <div class="top"><span class="pill" id="startNote">Empieza</span><span class="pill" id="alivePill">4</span></div>
    <div class="timer" id="timer">07:00</div>
    <div class="scroll"><div class="players" id="aliveList"></div></div>
    <div class="stack">
      <button class="primary" id="toVote">Votar</button>
      <button class="ghost" id="pauseBtn">Pausa</button>
    </div>
  </section>

  <section class="screen" id="vote">
    <div class="pname" id="voteTitle" style="font-size:40px">¿A quién?</div>
    <div class="scroll"><div class="players" id="voteList"></div></div>
    <button class="ghost" id="backDiscuss">Volver</button>
  </section>

  <section class="screen" id="expel">
    <div class="scroll" id="expelBox"></div>
    <button class="primary" id="continueBtn">Seguir</button>
  </section>

  <section class="screen" id="win">
    <div class="scroll" id="winBox"></div>
    <div class="stack">
      <button class="primary" id="againBtn">Otra ronda</button>
      <button class="ghost" id="menuBtn">Jugadores</button>
    </div>
  </section>
</div>

nudas fuerte"]}];
const KEY = "impostor-config-v2";
const $ = (id) => document.getElementById(id);
const screens = [...document.querySelectorAll(".screen")];
function show(id) { screens.forEach(s => s.classList.toggle("on", s.id === id)); }
let playersN = 4, impostorsN = 1, hintMode = "same";
let names = ["Jugador 1","Jugador 2","Jugador 3","Jugador 4"];
let game = null, timerId = null;
function maxImp(n) { return Math.max(1, n - 2); }
function roundSeconds(n) { return (5 + Math.floor(n / 2)) * 60; }
function fmt(s) { s = Math.max(0, s|0); return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0"); }
function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function beep(freq=440) { try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); const o = ctx.createOscillator(); const g = ctx.createGain(); o.frequency.value = freq; o.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(0.05, ctx.currentTime); o.start(); o.stop(ctx.currentTime + 0.08); } catch (e) {} if (navigator.vibrate) navigator.vibrate(12); }
function saveConfig() {
  try { localStorage.setItem(KEY, JSON.stringify({ playersN, impostorsN, hintMode, names: names.slice(0, playersN) })); } catch (e) {}
}
function renderNames() {
  names = names.slice(0, playersN);
  while (names.length < playersN) names.push("Jugador " + (names.length + 1));
  const box = $("nameList");
  box.innerHTML = "";
  names.forEach((n, i) => {
    const input = document.createElement("input");
    input.value = n; input.maxLength = 18;
    input.addEventListener("input", () => { names[i] = input.value; saveConfig(); });
    box.appendChild(input);
  });
  $("pCount").textContent = playersN;
  impostorsN = Math.min(Math.max(1, impostorsN), maxImp(playersN));
  $("iCount").textContent = impostorsN;
  $("timerPreview").textContent = fmt(roundSeconds(playersN));
  $("modeSame").classList.toggle("on", hintMode === "same");
  $("modeDiff").classList.toggle("on", hintMode === "diff");
  saveConfig();
}
function loadConfig() {
  try {
    const raw = localStorage.getItem(KEY) || localStorage.getItem("impostor-names");
    if (!raw) return;
    const data = JSON.parse(raw);
    if (Array.isArray(data)) { names = data; playersN = Math.min(16, Math.max(3, data.length)); return; }
    if (Array.isArray(data.names)) names = data.names;
    if (data.playersN) playersN = Math.min(16, Math.max(3, data.playersN));
    if (data.impostorsN) impostorsN = data.impostorsN;
    if (data.hintMode === "diff" || data.hintMode === "same") hintMode = data.hintMode;
  } catch (e) {}
}
loadConfig();
renderNames();
$("minusP").onclick = () => { if (playersN > 3) { playersN--; renderNames(); } };
$("plusP").onclick = () => { if (playersN < 16) { playersN++; renderNames(); } };
$("minusI").onclick = () => { if (impostorsN > 1) { impostorsN--; renderNames(); } };
$("plusI").onclick = () => { if (impostorsN < maxImp(playersN)) { impostorsN++; renderNames(); } };
$("modeSame").onclick = () => { hintMode = "same"; renderNames(); };
$("modeDiff").onclick = () => { hintMode = "diff"; renderNames(); };
$("goSetup").onclick = () => show("setup");
$("setupBack").onclick = () => show("home");
function cleanNames() {
  const used = {};
  return names.slice(0, playersN).map((n, i) => {
    let base = (n || "").trim() || ("Jugador " + (i + 1));
    let name = base, k = 2;
    while (used[name.toLowerCase()]) { name = base + " " + k; k++; }
    used[name.toLowerCase()] = true;
    return name;
  });
}
function assign() {
  const entry = WORDS[Math.floor(Math.random() * WORDS.length)];
  const bag = hintMode === "same" ? Array(impostorsN).fill(entry.h[Math.floor(Math.random() * entry.h.length)]) : shuffle(entry.h);
  const roles = shuffle([...Array(impostorsN).fill("imp"), ...Array(playersN - impostorsN).fill("det")]);
  let hi = 0;
  const people = cleanNames().map((name, i) => ({ name, role: roles[i], hint: roles[i] === "imp" ? bag[hi++ % bag.length] : null, alive: true }));
  game = { word: entry.w, category: entry.c, people, order: shuffle(people.map((_, i) => i)), cursor: 0, revealed: false, seconds: roundSeconds(people.length), paused: false, mustVote: false, starter: people[Math.floor(Math.random() * people.length)].name };
}
$("startBtn").onclick = () => { saveConfig(); assign(); openPass(); show("pass"); };
function openPass() {
  const p = game.people[game.order[game.cursor]];
  $("passName").textContent = p.name;
  $("coverName").textContent = p.name;
  $("passHelp").textContent = (game.cursor + 1) + " / " + game.order.length;
  $("afterReveal").style.display = "none";
  $("beforeReveal").style.display = "grid";
  const cover = $("cover");
  cover.style.transition = "none";
  cover.style.transform = "translateY(0)";
  cover.style.opacity = "1";
  game.revealed = false;
  const card = $("roleCard");
  card.className = "role " + p.role;
  card.innerHTML = p.role === "det"
    ? `<div class="badge">DETECTIVE</div><div class="secret">${game.word}</div>`
    : `<div class="badge">IMPOSTOR</div><div class="secret">${p.hint}</div>`;
}
let drag = null;
const cover = $("cover");
function revealRole() {
  if (!game || game.revealed) return;
  cover.style.transition = "transform .35s ease, opacity .35s ease";
  cover.style.transform = "translateY(-120%)";
  cover.style.opacity = "0";
  game.revealed = true;
  $("beforeReveal").style.display = "none";
  $("afterReveal").style.display = "grid";
  beep(620);
}
cover.addEventListener("touchstart", e => { if (!$("pass").classList.contains("on") || game?.revealed) return; drag = { y: e.touches[0].clientY, dy: 0 }; }, {passive: false});
cover.addEventListener("mousedown", e => { if (!$("pass").classList.contains("on") || game?.revealed) return; drag = { y: e.clientY, dy: 0 }; });
function moveDrag(e) {
  if (!drag) return;
  const y = e.touches ? e.touches[0].clientY : e.clientY;
  drag.dy = Math.min(0, y - drag.y);
  cover.style.transition = "none";
  cover.style.transform = `translateY(${drag.dy}px)`;
  if (e.cancelable) e.preventDefault();
}
window.addEventListener("touchmove", moveDrag, {passive: false});
window.addEventListener("mousemove", moveDrag);
function endDrag() {
  if (!drag) return;
  const dy = drag.dy; drag = null;
  if (dy < -110) revealRole();
  else { cover.style.transition = "transform .25s ease"; cover.style.transform = "translateY(0)"; }
}
window.addEventListener("touchend", endDrag);
window.addEventListener("mouseup", endDrag);
$("tapReveal").onclick = revealRole;
$("hidePass").onclick = () => { game.cursor++; if (game.cursor >= game.order.length) beginDiscuss(); else openPass(); };
function beginDiscuss() {
  show("discuss");
  $("startNote").textContent = "Empieza " + game.starter;
  renderAlive();
  startClock();
}
function renderAlive() {
  const alive = game.people.filter(p => p.alive);
  $("alivePill").textContent = alive.length;
  $("aliveList").innerHTML = alive.map(p => `<div class="pbtn">${p.name}</div>`).join("");
}
function paintTimer() {
  const el = $("timer");
  el.textContent = fmt(game.seconds);
  el.className = "timer" + (game.seconds <= 30 ? " late" : game.seconds <= 60 ? " warn" : "");
}
function startClock() {
  clearInterval(timerId);
  game.paused = false;
  $("pauseBtn").textContent = "Pausa";
  paintTimer();
  timerId = setInterval(() => {
    if (game.paused) return;
    game.seconds--;
    paintTimer();
    if (game.seconds <= 0) { clearInterval(timerId); forceVote(); }
  }, 1000);
}
$("pauseBtn").onclick = () => { game.paused = !game.paused; $("pauseBtn").textContent = game.paused ? "Seguir" : "Pausa"; };
$("toVote").onclick = () => { game.paused = true; game.mustVote = false; beginVote(); };
function forceVote() {
  game.mustVote = true;
  game.paused = true;
  beginVote();
}
function beginVote() {
  show("vote");
  $("voteTitle").textContent = game.mustVote ? "Voto obligatorio" : "¿A quién?";
  $("voteList").innerHTML = "";
  $("backDiscuss").style.display = game.mustVote ? "none" : "block";
  game.people.filter(p => p.alive).forEach(p => {
    const b = document.createElement("button");
    b.className = "pbtn";
    b.textContent = p.name;
    b.onclick = () => expelPlayer(p.name);
    $("voteList").appendChild(b);
  });
}
$("backDiscuss").onclick = () => { if (game.mustVote) return; show("discuss"); if (game.seconds > 0) startClock(); };
function expelPlayer(name) {
  const person = game.people.find(x => x.name === name);
  person.alive = false;
  game.lastExpelImp = person.role === "imp";
  show("expel");
  $("expelBox").innerHTML = `<div class="role ${person.role}" style="position:relative;min-height:320px"><div class="badge">${person.role === "imp" ? "IMPOSTOR" : "DETECTIVE"}</div><div class="secret">${person.name}</div><div class="tiny">${person.role === "imp" ? "Sí era impostor" : "No era impostor"}</div></div>`;
  beep(person.role === "imp" ? 520 : 220);
}
$("continueBtn").onclick = () => {
  const alive = game.people.filter(p => p.alive);
  const imps = alive.filter(p => p.role === "imp").length;
  const dets = alive.length - imps;
  if (imps === 0) return endGame("det");
  if (imps >= dets) return endGame("imp");
  if (game.seconds <= 0) game.seconds = 180;
  game.mustVote = false;
  game.starter = alive[Math.floor(Math.random() * alive.length)].name;
  show("discuss");
  $("startNote").textContent = game.seconds === 180 ? "3 min más" : ("Empieza " + game.starter);
  renderAlive();
  startClock();
};
function endGame(winner) {
  clearInterval(timerId);
  show("win");
  const imps = game.people.filter(p => p.role === "imp");
  const won = winner === "det";
  $("winBox").innerHTML = `
    <div class="badge">FIN</div>
    <div class="pname" style="font-size:40px">${won ? "Ganaron los detectives" : "Ganaron los impostores"}</div>
    <div class="tiny">${won ? "Expulsaron a todos los impostores" : "Los detectives no lograron echarlos"}</div>
    <div class="role ${won ? "det" : "imp"}" style="position:relative;min-height:200px;margin-top:12px"><div class="tiny">La palabra era</div><div class="secret">${game.word}</div></div>
    <div class="block" style="margin-top:12px">${game.people.map(p => `<div class="row" style="margin:10px 0"><b>${p.name}</b><span>${p.role === "imp" ? "Impostor" : "Detective"}</span></div>`).join("")}</div>`;
}
$("againBtn").onclick = () => { names = game.people.map(p => p.name); playersN = names.length; saveConfig(); assign(); openPass(); show("pass"); };
$("menuBtn").onclick = () => { clearInterval(timerId); show("setup"); renderNames(); };
</script>
